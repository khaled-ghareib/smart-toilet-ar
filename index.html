<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Smart Toilet</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #111;
      color: white;
      font-family: sans-serif;
    }
    h1 {
      margin: 16px 0;
      text-align: center;
    }
    model-viewer {
      width: 100%;
      max-width: 800px;
      height: 80vh;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }
    .buttons button {
      padding: 12px 18px;
      font-size: 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      transition: all 0.2s;
    }
    .buttons button.active { background: #2E7D32; }
    .buttons button:hover { transform: translateY(-2px); }

    .ar-button {
      margin-top: 20px;
      padding: 14px 24px;
      font-size: 16px;
      border-radius: 12px;
      background: #2196F3;
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ar-button:hover { transform: translateY(-2px); }
  </style>
</head>
<body>

  <h1>Icon Smart Toilet</h1>

  <model-viewer
    id="toiletViewer"
    src="https://pub-0426d526ef114881be492fff3021cec3.r2.dev/790f3b98-798d-4442-9113-86107e9c2ae4/1768809086069-toilet_full_active.glb"
    camera-controls
    auto-rotate
    environment-image="neutral"
  ></model-viewer>

  <div class="buttons">
    <button data-animation="CoverAction" class="active">Cover</button>
    <button data-animation="SeatAction">Seat</button>
    <button data-animation="BidetActionGroup">Bidet</button>
    <button data-animation="AirventAction">Air Vent</button>
  </div>

  <!-- Direct AR button using the same GLB -->
  <model-viewer
    id="arButton"
    src="https://pub-0426d526ef114881be492fff3021cec3.r2.dev/790f3b98-798d-4442-9113-86107e9c2ae4/1768809086069-toilet_full_active.glb"
    ios-src="https://pub-0426d526ef114881be492fff3021cec3.r2.dev/790f3b98-798d-4442-9113-86107e9c2ae4/1768809086069-toilet_full_active.usdz"
    ar
    ar-modes="quick-look scene-viewer"
    style="display:none;"
  ></model-viewer>

  <button class="ar-button" onclick="document.getElementById('arButton').activateAR()">
    View in AR
  </button>

  <script>
    const viewer = document.getElementById('toiletViewer');
    const buttons = document.querySelectorAll('.buttons button');

    // Track currently playing animations
    const activeAnimations = new Set();

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const anim = btn.getAttribute('data-animation');

        // Highlight clicked button
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Bidet button plays two animations in sequence
        if(anim === "BidetActionGroup") {
          activeAnimations.add("BidetCoverAction");
          viewer.animationName = "BidetCoverAction";
          viewer.play();
          setTimeout(() => {
            activeAnimations.add("BidetAction");
            viewer.animationName = "BidetAction";
            viewer.play();
          }, 500);
        } else {
          if(!activeAnimations.has(anim)) activeAnimations.add(anim);
          viewer.animationName = anim;
          viewer.play();
        }
      });
    });
  </script>

</body>
</html>
