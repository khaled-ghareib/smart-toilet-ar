<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Toilet AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; color: white; }
        model-viewer { width: 100vw; height: 100vh; }
        .controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 90%;
        }
        button {
            padding: 16px; border-radius: 12px; border: 1px solid #444;
            background: rgba(30, 30, 30, 0.9); color: white; font-weight: bold;
        }
        button.active { background: #007bff; border-color: #007bff; }
    </style>
</head>
<body>

<model-viewer id="toilet" src="toilet_final.glb" ar camera-controls autoplay="false">
    <div class="controls">
        <button id="btn-Cover" onclick="handleAction('CoverAction', 'btn-Cover')">Cover</button>
        <button id="btn-Seat" onclick="handleAction('SeatAction', 'btn-Seat')">Seat</button>
        <button id="btn-BidetCover" onclick="handleAction('BidetCoverAction', 'btn-BidetCover')">Bidet Lid</button>
        <button id="btn-Bidet" onclick="handleAction('BidetAction', 'btn-Bidet')">Bidet</button>
        <button id="btn-Airvent" onclick="handleAction('AirventAction', 'btn-Airvent')">Air Vent</button>
        <button id="btn-LED" onclick="handleAction('LEDAction', 'btn-LED')">LED</button>
    </div>
</model-viewer>

<script>
    const mv = document.querySelector('#toilet');
    let actions = {}; // Store the animation clips here

    // This function runs once the model is fully loaded
    mv.addEventListener('load', () => {
        const symbol = Object.getOwnPropertySymbols(mv).find(s => s.description === 'scene');
        const scene = mv[symbol];
        
        // Access the Three.js mixer
        mv.mixer = new THREE.AnimationMixer(scene);
        
        // Load all animations into the mixer as independent clips
        mv.availableAnimations.forEach(name => {
            const clip = THREE.AnimationClip.findByName(mv.getAnimations(), name);
            if (clip) {
                const action = mv.mixer.clipAction(clip);
                action.setLoop(THREE.LoopOnce); // STOP LOOPING
                action.clampWhenFinished = true; // STAY AT END FRAME
                actions[name] = action;
            }
        });

        // Start the internal update loop
        const clock = new THREE.Clock();
        const animate = () => {
            requestAnimationFrame(animate);
            if (mv.mixer) mv.mixer.update(clock.getDelta());
        };
        animate();
    });

    function handleAction(name, id) {
        const btn = document.getElementById(id);
        const action = actions[name];

        if (!action) return;

        if (!btn.classList.contains('active')) {
            // OPENING
            btn.classList.add('active');
            action.paused = false;
            action.timeScale = 1; 
            action.play();
        } else {
            // CLOSING
            btn.classList.remove('active');
            action.paused = false;
            action.timeScale = -1; // Play backwards
            action.play();
        }
    }
</script>
</body>
</html>
