<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Smart Toilet | AR Experience</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h2 { margin: 15px 0; font-weight: 300; letter-spacing: 1px; }
    #container { width: 100vw; height: 65vh; cursor: grab; }
    #container:active { cursor: grabbing; }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      max-width: 600px;
    }
    button {
      padding: 14px 22px;
      font-size: 14px;
      border: none;
      border-radius: 12px;
      background: #2e2e2e;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    button:hover {
      background: #4CAF50;
      transform: translateY(-2px);
    }
    button:active { transform: translateY(0); }

    #arButton {
      background: #ffffff;
      color: #000;
      font-weight: bold;
    }
    #arButton:hover { background: #e0e0e0; }

    /* Hidden link for AR Quick Look */
    #ar-link { display: none; }
  </style>
</head>
<body>

<h2>Icon Smart Toilet</h2>
<div id="container"></div>

<div class="buttons">
  <button data-action="CoverAction">Cover</button>
  <button data-action="SeatAction">Seat</button>
  <button data-action="Bidet">Bidet</button>
  <button data-action="AirventAction">Air Vent</button>
  <button id="arButton">View in AR</button>
</div>

<a id="ar-link" rel="ar" href="https://raw.githubusercontent.com/khaled-ghareib/smart-toilet-ar/main/toilet_full_active.usdz">
  <img src="https://developer.apple.com/augmented-reality/quick-look/models/teapot/teapot_2x.png" alt="AR">
</a>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const container = document.getElementById('container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(1.8, 1.2, 2.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.toneMapping = THREE.ReinhardToneMapping;
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(5, 10, 7.5);
  scene.add(dirLight);

  const loader = new GLTFLoader();
  let mixer;
  const actions = {};

  // Load Model
  loader.load(
    'https://cdn.jsdelivr.net/gh/khaled-ghareib/smart-toilet-ar@main/toilet_web.glb',
    (gltf) => {
      scene.add(gltf.scene);
      
      // Auto-center the model
      const box = new THREE.Box3().setFromObject(gltf.scene);
      const center = box.getCenter(new THREE.Vector3());
      gltf.scene.position.sub(center);

      mixer = new THREE.AnimationMixer(gltf.scene);

      gltf.animations.forEach((clip) => {
        const action = mixer.clipAction(clip);
        action.setLoop(THREE.LoopOnce);      // Play once
        action.clampWhenFinished = true;    // Stay at the end frame
        actions[clip.name] = action;
      });
    }
  );

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    if (mixer) mixer.update(clock.getDelta());
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Button Listeners
  document.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!mixer) return;
      const actionName = btn.dataset.action;

      if (actionName === 'Bidet') {
        // Sequential animation: Cover then Wand
        if (actions['BidetCoverAction']) actions['BidetCoverAction'].stop().play();
        setTimeout(() => {
          if (actions['BidetAction']) actions['BidetAction'].stop().play();
        }, 500);
      } else {
        // Individual animation (Cover, Seat, or Vent)
        if (actions[actionName]) {
          actions[actionName].stop().play();
        }
      }
    });
  });

  // Native AR Button Logic
  document.getElementById('arButton').addEventListener('click', (e) => {
    e.preventDefault();
    const arLink = document.getElementById('ar-link');
    
    // Check if device supports AR Quick Look (iOS)
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    
    if (isIOS) {
      arLink.click();
    } else {
      alert("AR Quick Look is only supported on iOS devices (iPhone/iPad). On desktop or Android, you can view the 3D model here!");
    }
  });

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
</script>

</body>
</html>
