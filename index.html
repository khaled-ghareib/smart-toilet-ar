<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Smart Toilet - Pro AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: -apple-system, sans-serif; color: white; overflow: hidden; }
        
        /* Full screen viewer */
        model-viewer {
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
        }

        /* Modern Glassmorphism Controls */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 90%;
            max-width: 400px;
            z-index: 100;
            padding: 20px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        button {
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: rgba(60, 60, 60, 0.9);
            color: white;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button.active {
            background: #4CAF50; /* Green for "On" */
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
        }

        #reset {
            grid-column: span 2;
            background: #2196F3; /* Blue for Reset */
            margin-top: 5px;
        }

        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

<model-viewer id="toilet" 
    src="toilet_final.glb" 
    ios-src="toilet_final.usdz" 
    ar 
    ar-modes="webxr quick-look" 
    camera-controls 
    shadow-intensity="1.5" 
    shadow-softness="1"
    scale="0.25 0.25 0.25"
    environment-image="neutral">

    <div class="controls">
        <button id="btn-Cover" onclick="toggle('CoverAction', 'btn-Cover')">Cover</button>
        <button id="btn-Seat" onclick="toggle('SeatAction', 'btn-Seat')">Seat</button>
        <button id="btn-Bidet" onclick="toggle('BidetAction', 'btn-Bidet')">Bidet</button>
        <button id="btn-Air" onclick="toggle('AirventAction', 'btn-Air')">Air Vent</button>
        <button id="reset" onclick="location.reload()">Reset All</button>
    </div>

</model-viewer>

<script>
    const mv = document.querySelector('#toilet');
    const states = { CoverAction: false, SeatAction: false, BidetAction: false, AirventAction: false };

    function toggle(animName, btnId) {
        const btn = document.getElementById(btnId);
        states[animName] = !states[animName];

        // Trigger the specific NLA track from your Blender file
        mv.animationName = animName;
        
        // play({repetitions: 1}) ensures it plays once and stops
        mv.play({ repetitions: 1 });
        btn.classList.toggle('active', states[animName]);

        // MASTER CLOSE LOGIC: If the Cover is closed, the Seat must also close
        if (animName === 'CoverAction' && !states[animName]) {
            const seatBtn = document.getElementById('btn-Seat');
            if (states['SeatAction']) {
                // Short delay so they don't clip through each other
                setTimeout(() => toggle('SeatAction', 'btn-Seat'), 300);
            }
        }
    }

    // Stop the "intro" animation on load
    mv.addEventListener('load', () => {
        mv.pause();
    });
</script>

</body>
</html>
