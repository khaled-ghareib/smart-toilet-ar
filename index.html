<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Toilet Pro AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            color: white; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            --progress-bar-color: transparent;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 90%;
            max-width: 400px;
            z-index: 100;
            padding: 15px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        button {
            padding: 14px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(40, 40, 40, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.3px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        button:hover {
            background: rgba(60, 60, 60, 0.9);
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.95);
        }

        button.on {
            background: linear-gradient(135deg, #007bff, #0056cc);
            border-color: #007bff;
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        button.off {
            background: rgba(40, 40, 40, 0.9);
            border-color: rgba(255,255,255,0.1);
        }

        .ar-button {
            position: absolute !important;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9) !important;
            color: #000 !important;
            padding: 12px 24px !important;
            border-radius: 25px !important;
            font-weight: bold !important;
            border: none !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .ar-button:before {
            content: '👁️ ';
        }

        /* Status indicator */
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background: #ff4444;
            transition: background 0.3s;
        }

        button.on .status-indicator {
            background: #44ff44;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: repeat(2, 1fr);
                bottom: 20px;
                padding: 12px;
            }
            
            button {
                font-size: 12px;
                padding: 12px 8px;
                min-height: 45px;
            }
            
            .ar-button {
                top: 10px;
                right: 10px;
                padding: 10px 20px !important;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div id="loading" class="loading">
    <div class="loading-spinner"></div>
    <p>Loading Smart Toilet Pro...</p>
</div>

<model-viewer 
    id="toilet"
    src="toilet_final.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look"
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="2" 
    exposure="1"
    environment-image="neutral"
    auto-rotate
    camera-orbit="45deg 55deg 2.5m"
    field-of-view="30deg"
    min-field-of-view="20deg"
    max-field-of-view="45deg"
    interaction-prompt="none"
    ar-scale="auto"
    ar-placement="floor"
    xr-environment
    style="width: 100%; height: 100%;">

    <div class="instructions" slot="ar-button">
        <h2>Smart Toilet Pro AR</h2>
        <p>Tap AR button to place in your space</p>
    </div>

</model-viewer>

<div class="controls">
    <button id="btn-CoverAction" data-animation="CoverAction">
        <span class="status-indicator"></span>
        Cover
    </button>
    <button id="btn-SeatAction" data-animation="SeatAction">
        <span class="status-indicator"></span>
        Seat
    </button>
    <button id="btn-BidetCoverAction" data-animation="BidetCoverAction">
        <span class="status-indicator"></span>
        Bidet Lid
    </button>
    <button id="btn-BidetAction" data-animation="BidetAction">
        <span class="status-indicator"></span>
        Bidet Spray
    </button>
    <button id="btn-AirventAction" data-animation="AirventAction">
        <span class="status-indicator"></span>
        Air Vent
    </button>
    <button id="btn-Reset" style="grid-column: span 2;">
        Reset All
    </button>
</div>

<script type="module">
    const modelViewer = document.querySelector('#toilet');
    const loading = document.getElementById('loading');
    
    // Animation state management - tracks whether each part is open or closed
    const animationStates = {
        'CoverAction': { isOpen: false },
        'SeatAction': { isOpen: false },
        'BidetCoverAction': { isOpen: false },
        'BidetAction': { isOpen: false },
        'AirventAction': { isOpen: false }
    };
    
    // Store original animation names from model
    let availableAnimations = [];
    
    // Cache for animation start/end times
    const animationTimes = {
        'CoverAction': { start: 0, end: 1 },
        'SeatAction': { start: 0, end: 1 },
        'BidetCoverAction': { start: 0, end: 1 },
        'BidetAction': { start: 0, end: 1 },
        'AirventAction': { start: 0, end: 1 }
    };
    
    // Initialize model
    modelViewer.addEventListener('load', async () => {
        console.log('Model loaded successfully');
        
        // Get available animations
        availableAnimations = modelViewer.availableAnimations || [];
        console.log('Available animations:', availableAnimations);
        
        // Setup button handlers
        document.querySelectorAll('[data-animation]').forEach(button => {
            const animationName = button.getAttribute('data-animation');
            
            button.addEventListener('click', () => {
                toggleAnimationState(animationName);
            });
            
            // Initialize button state
            updateButtonVisual(button, animationName);
        });
        
        // Reset button
        document.getElementById('btn-Reset').addEventListener('click', resetAll);
        
        // Hide loading
        loading.style.display = 'none';
        
        // Test: Set all animations to stopped state initially
        availableAnimations.forEach(name => {
            modelViewer.animationName = name;
            modelViewer.pause();
        });
    });
    
    // Toggle animation state without affecting others
    async function toggleAnimationState(animationName) {
        const state = animationStates[animationName];
        const button = document.getElementById(`btn-${animationName}`);
        
        if (!state) {
            console.error(`No state found for ${animationName}`);
            return;
        }
        
        // Toggle the state
        state.isOpen = !state.isOpen;
        
        // Update button visual
        updateButtonVisual(button, animationName);
        
        // Apply the animation based on state
        await applyAnimationPose(animationName, state.isOpen);
        
        // Special logic: If cover is closing, close seat too
        if (animationName === 'CoverAction' && !state.isOpen) {
            // Only close seat if it's open
            if (animationStates.SeatAction.isOpen) {
                animationStates.SeatAction.isOpen = false;
                updateButtonVisual(document.getElementById('btn-SeatAction'), 'SeatAction');
                await applyAnimationPose('SeatAction', false);
            }
        }
    }
    
    // Apply animation pose without playing timeline
    async function applyAnimationPose(animationName, isOpen) {
        if (!availableAnimations.includes(animationName)) {
            console.warn(`Animation ${animationName} not found in model`);
            return;
        }
        
        try {
            // IMPORTANT: First stop ALL animations to prevent conflicts
            availableAnimations.forEach(name => {
                modelViewer.animationName = name;
                modelViewer.pause();
            });
            
            // Set the specific animation to the correct time
            modelViewer.animationName = animationName;
            
            // Set time to end (1) for open, start (0) for closed
            const targetTime = isOpen ? 1 : 0;
            modelViewer.time = targetTime;
            
            // Force update
            modelViewer.updateSize();
            
            console.log(`Set ${animationName} to ${isOpen ? 'open' : 'closed'} (time: ${targetTime})`);
            
        } catch (error) {
            console.error(`Error setting ${animationName}:`, error);
        }
    }
    
    // Update button appearance
    function updateButtonVisual(button, animationName) {
        const state = animationStates[animationName];
        const indicator = button.querySelector('.status-indicator');
        
        if (!state) return;
        
        // Update button class
        button.className = state.isOpen ? 'on' : 'off';
        
        // Update button text
        const actionName = animationName.replace('Action', '');
        button.innerHTML = `<span class="status-indicator"></span>${actionName} ${state.isOpen ? 'On' : 'Off'}`;
        
        // Update indicator color
        if (indicator) {
            indicator.style.background = state.isOpen ? '#44ff44' : '#ff4444';
        }
    }
    
    // Reset all animations
    function resetAll() {
        Object.keys(animationStates).forEach(name => {
            const state = animationStates[name];
            state.isOpen = false;
            
            // Apply closed pose
            if (availableAnimations.includes(name)) {
                modelViewer.animationName = name;
                modelViewer.time = 0;
                modelViewer.pause();
            }
            
            // Update button
            const button = document.getElementById(`btn-${name}`);
            if (button) updateButtonVisual(button, name);
        });
        
        // Visual feedback for reset button
        const resetBtn = document.getElementById('btn-Reset');
        resetBtn.style.background = '#28a745';
        setTimeout(() => {
            resetBtn.style.background = '';
        }, 300);
        
        console.log('All animations reset to closed position');
    }
    
    // Handle errors
    modelViewer.addEventListener('error', (event) => {
        console.error('Model viewer error:', event.detail);
        loading.innerHTML = `
            <div style="color: #ff6b6b; margin-bottom: 15px;">⚠️ Error loading model</div>
            <p style="font-size: 12px; opacity: 0.8;">Please check console for details</p>
            <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 20px; background: #007bff; border: none; border-radius: 8px; color: white; cursor: pointer;">
                Retry
            </button>
        `;
    });
    
    // Debug: Log animation times
    modelViewer.addEventListener('render', () => {
        // This can help debug animation timing
    });
</script>
</body>
</html>
