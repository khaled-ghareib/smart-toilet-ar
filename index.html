<script>
  const viewer = document.getElementById('toiletViewer');
  const buttons = document.querySelectorAll('.buttons button');

  // Track which animations have been played (and are "open")
  const activeAnimations = new Set();

  // Play a single animation once
  function playAnimationOnce(name) {
    viewer.animationName = name;
    viewer.play();
    
    // Listen for finish to mark it as active
    const onFinish = () => {
      activeAnimations.add(name);
      viewer.removeEventListener('finish', onFinish);
    };
    viewer.addEventListener('finish', onFinish);
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const anim = btn.getAttribute('data-animation');

      // Highlight clicked button
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // Bidet plays two animations in sequence
      if(anim === "BidetActionGroup") {
        if(!activeAnimations.has("BidetCoverAction")) playAnimationOnce("BidetCoverAction");
        setTimeout(() => {
          if(!activeAnimations.has("BidetAction")) playAnimationOnce("BidetAction");
        }, 500);
        return;
      }

      // Normal animations: only play if not already active
      if(!activeAnimations.has(anim)) playAnimationOnce(anim);
    });
  });
</script>
