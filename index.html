<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Smart Toilet</title>
    
    <!-- Remove preloads that might cause issues -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: -apple-system, sans-serif; 
            background: #000; 
            color: white; 
            height: 100vh; 
            position: relative;
        }
        
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        
        /* Simple Loading */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #4CAF50;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Controls */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 90%;
            max-width: 400px;
            padding: 15px;
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            z-index: 100;
            display: none;
        }
        
        button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        button.active {
            background: #4CAF50;
        }
        
        #resetBtn {
            grid-column: span 2;
            background: #2196F3;
        }
        
        /* AR Button */
        #arBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #FF9800;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            z-index: 100;
        }
        
        /* Error Message */
        .error {
            background: #f44336;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        
        /* Fallback Message */
        #fallback {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            display: none;
            z-index: 2000;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Loading toilet model...</div>
        <div class="error" id="errorMsg"></div>
    </div>
    
    <div id="fallback">
        <h2>⚠️ Model Load Error</h2>
        <p style="margin: 20px 0; color: #ccc;">The 3D model could not be loaded.</p>
        <div style="background: #222; padding: 15px; border-radius: 10px; margin: 10px 0;">
            <p>Please make sure:</p>
            <ul style="text-align: left; margin: 10px 0 10px 20px;">
                <li><code>toilet_final.glb</code> is in the same folder</li>
                <li>The file is not corrupted</li>
                <li>You have internet connection for Three.js</li>
            </ul>
        </div>
        <button id="retryBtn" style="
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
            cursor: pointer;
        ">Retry Loading</button>
    </div>
    
    <button id="arBtn">👁️ View in AR</button>
    
    <div class="controls" id="controls">
        <button id="coverBtn">Cover</button>
        <button id="seatBtn">Seat</button>
        <button id="bidetBtn">Bidet</button>
        <button id="airventBtn">Air Vent</button>
        <button id="resetBtn">Reset All</button>
    </div>

<script>
    // Simple global variables
    let scene, camera, renderer;
    let model = null;
    let isLoaded = false;
    
    // Track loading timeout
    let loadTimeout = null;
    
    // Initialize everything
    function init() {
        console.log('Initializing...');
        
        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        
        // Create camera
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 4);
        
        // Create renderer
        const canvas = document.getElementById('canvas');
        renderer = new THREE.WebGLRenderer({ 
            canvas: canvas,
            antialias: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        // Add basic lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);
        
        // Set loading timeout (10 seconds max)
        loadTimeout = setTimeout(() => {
            if (!isLoaded) {
                showError('Loading timeout. Check if toilet_final.glb exists.');
                showFallback();
            }
        }, 10000);
        
        // Load the model
        loadModel();
        
        // Setup UI event listeners
        setupUI();
        
        // Start animation loop
        animate();
        
        // Handle window resize
        window.addEventListener('resize', onWindowResize);
    }
    
    function loadModel() {
        console.log('Attempting to load model...');
        
        const loader = new THREE.GLTFLoader();
        
        // First, check if file exists
        fetch('toilet_final.glb')
            .then(response => {
                if (!response.ok) {
                    throw new Error('File not found');
                }
                return response;
            })
            .then(() => {
                // File exists, try to load it
                loader.load(
                    'toilet_final.glb',
                    // Success
                    (gltf) => {
                        console.log('✅ Model loaded successfully!');
                        clearTimeout(loadTimeout);
                        isLoaded = true;
                        
                        model = gltf.scene;
                        
                        // Make sure model is visible
                        model.traverse(child => {
                            if (child.isMesh) {
                                child.visible = true;
                            }
                        });
                        
                        // Add to scene
                        scene.add(model);
                        
                        // Center and scale
                        centerModel();
                        
                        // Show UI
                        showUIElements();
                        
                        // Check for AR support
                        checkARSupport();
                    },
                    // Progress
                    (xhr) => {
                        const percent = Math.round((xhr.loaded / xhr.total) * 100);
                        document.getElementById('loadingText').textContent = `Loading: ${percent}%`;
                    },
                    // Error
                    (error) => {
                        console.error('GLTF Load Error:', error);
                        showError('Failed to load model file. It may be corrupted.');
                        showFallback();
                        clearTimeout(loadTimeout);
                    }
                );
            })
            .catch(error => {
                console.error('Fetch Error:', error);
                showError('File "toilet_final.glb" not found in current folder.');
                showFallback();
                clearTimeout(loadTimeout);
            });
    }
    
    function centerModel() {
        if (!model) return;
        
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        
        // Center model
        model.position.x = -center.x;
        model.position.y = -center.y + (size.y / 2);
        model.position.z = -center.z;
        
        // Scale if too large
        const maxSize = Math.max(size.x, size.y, size.z);
        if (maxSize > 5) {
            const scale = 3 / maxSize;
            model.scale.setScalar(scale);
        }
        
        console.log('Model centered and scaled');
    }
    
    function showError(message) {
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.textContent = message;
        errorMsg.style.display = 'block';
    }
    
    function showFallback() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('fallback').style.display = 'flex';
    }
    
    function hideFallback() {
        document.getElementById('fallback').style.display = 'none';
    }
    
    function showUIElements() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('controls').style.display = 'grid';
        document.getElementById('arBtn').style.display = 'block';
    }
    
    function setupUI() {
        // Control buttons
        document.getElementById('coverBtn').addEventListener('click', () => {
            toggleButton('coverBtn');
        });
        
        document.getElementById('seatBtn').addEventListener('click', () => {
            toggleButton('seatBtn');
        });
        
        document.getElementById('bidetBtn').addEventListener('click', () => {
            toggleButton('bidetBtn');
        });
        
        document.getElementById('airventBtn').addEventListener('click', () => {
            toggleButton('airventBtn');
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            resetAllButtons();
        });
        
        // AR button
        document.getElementById('arBtn').addEventListener('click', launchAR);
        
        // Retry button
        document.getElementById('retryBtn').addEventListener('click', () => {
            hideFallback();
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('errorMsg').style.display = 'none';
            loadModel();
        });
    }
    
    function toggleButton(btnId) {
        const btn = document.getElementById(btnId);
        btn.classList.toggle('active');
        
        // For now, just toggle the button style
        // In a real implementation, this would animate the model part
        console.log('Toggle:', btnId.replace('Btn', ''));
    }
    
    function resetAllButtons() {
        const buttons = ['coverBtn', 'seatBtn', 'bidetBtn', 'airventBtn'];
        buttons.forEach(btnId => {
            const btn = document.getElementById(btnId);
            btn.classList.remove('active');
        });
        
        // Visual feedback
        const resetBtn = document.getElementById('resetBtn');
        resetBtn.style.transform = 'scale(0.95)';
        setTimeout(() => {
            resetBtn.style.transform = '';
        }, 200);
    }
    
    function checkARSupport() {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        
        if (isIOS) {
            // Check if USDZ exists
            fetch('toilet_final.usdz', { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        console.log('✅ USDZ file found');
                    } else {
                        document.getElementById('arBtn').textContent = '👁️ AR (Setup Required)';
                        document.getElementById('arBtn').style.background = '#666';
                        console.log('⚠️ USDZ file not found');
                    }
                })
                .catch(() => {
                    document.getElementById('arBtn').textContent = '👁️ AR (iPhone Only)';
                    document.getElementById('arBtn').style.background = '#666';
                });
        } else {
            document.getElementById('arBtn').textContent = '👁️ AR (iPhone Only)';
            document.getElementById('arBtn').style.background = '#666';
        }
    }
    
    function launchAR() {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        
        if (isIOS) {
            // Simple AR launch for iOS
            const arLink = document.createElement('a');
            arLink.href = 'toilet_final.usdz';
            arLink.setAttribute('rel', 'ar');
            
            // Add preview image (required)
            const img = document.createElement('img');
            img.src = 'data:image/svg+xml;base64,' + btoa(`
                <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100" height="100" fill="#FF9800"/>
                    <text x="50" y="50" font-family="Arial" font-size="14" fill="white" 
                          text-anchor="middle" dominant-baseline="middle">AR</text>
                </svg>
            `);
            img.alt = 'AR Preview';
            img.style.cssText = 'width:100px;height:100px;border-radius:10px;';
            
            arLink.appendChild(img);
            document.body.appendChild(arLink);
            
            // Trigger AR
            setTimeout(() => {
                arLink.click();
                setTimeout(() => {
                    if (arLink.parentNode) {
                        arLink.parentNode.removeChild(arLink);
                    }
                }, 100);
            }, 100);
        } else {
            alert('AR View is only available on iPhone/iPad with Safari browser.');
        }
    }
    
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    
    // Start everything when page loads
    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
