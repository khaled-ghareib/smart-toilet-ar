<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Smart Toilet</title>
    <!-- Use model-viewer for iOS compatibility -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            margin: 0; 
            font-family: -apple-system, sans-serif; 
            background: #000; 
            color: white; 
            height: 100vh;
            overflow: hidden;
        }
        
        model-viewer {
            width: 100vw;
            height: 100vh;
            background: #1a1a1a;
        }
        
        .controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 90%;
            max-width: 400px;
            z-index: 100;
            padding: 15px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        button {
            padding: 14px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(40, 40, 40, 0.9);
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            min-height: 50px;
            transition: all 0.2s;
        }
        
        button:hover {
            background: rgba(60, 60, 60, 0.9);
        }
        
        button.on {
            background: linear-gradient(135deg, #007bff, #0056cc);
            border-color: #007bff;
        }
        
        button.off {
            background: rgba(40, 40, 40, 0.9);
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background: #ff4444;
        }
        
        button.on .status-indicator {
            background: #44ff44;
        }
        
        .title-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 50;
            max-width: 90%;
        }
        
        .title-bar h1 {
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin: 0;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* AR button styled to match iOS */
        .ar-button {
            position: absolute !important;
            top: 20px !important;
            right: 20px !important;
            background: rgba(255, 255, 255, 0.9) !important;
            color: #000 !important;
            padding: 12px 24px !important;
            border-radius: 25px !important;
            font-weight: bold !important;
            border: none !important;
            backdrop-filter: blur(10px) !important;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2) !important;
            z-index: 1000 !important;
        }
        
        @media (max-width: 768px) {
            .controls {
                bottom: 20px;
                padding: 12px;
            }
            
            button {
                font-size: 12px;
                padding: 12px 8px;
                min-height: 45px;
            }
            
            .title-bar {
                top: 10px;
                padding: 10px 20px;
            }
            
            .title-bar h1 {
                font-size: 16px;
            }
            
            .ar-button {
                top: 10px !important;
                right: 10px !important;
                padding: 10px 20px !important;
                font-size: 14px !important;
            }
        }
    </style>
</head>
<body>

<model-viewer 
    id="toilet"
    src="toilet_final.glb"
    ar
    ar-modes="scene-viewer quick-look webxr"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="2"
    exposure="1"
    environment-image="neutral"
    auto-rotate
    camera-orbit="45deg 55deg 2.5m"
    ar-scale="fixed"
    ar-placement="floor"
    style="width: 100%; height: 100%;"
    
    <!-- iOS specific attributes -->
    ios-src="toilet_final.glb"
    xr-environment
>
    
    <!-- Title -->
    <div class="title-bar" slot="ar-button">
        <h1>Icon Smart Toilet</h1>
    </div>
    
    <!-- Loading overlay -->
    <div id="loading" slot="poster">
        <div class="loading-spinner"></div>
        <p>Loading Smart Toilet...</p>
    </div>
    
</model-viewer>

<!-- Controls overlay -->
<div class="controls">
    <button id="btn-CoverAction" data-animation="CoverAction">
        <span class="status-indicator"></span>Cover
    </button>
    <button id="btn-SeatAction" data-animation="SeatAction">
        <span class="status-indicator"></span>Seat
    </button>
    <button id="btn-BidetAction" data-animation="BidetAction">
        <span class="status-indicator"></span>Bidet
    </button>
    <button id="btn-AirventAction" data-animation="AirventAction">
        <span class="status-indicator"></span>Air Vent
    </button>
    <button id="btn-Reset" style="grid-column: span 2;">
        Reset All
    </button>
</div>

<script type="module">
    const modelViewer = document.querySelector('#toilet');
    const loading = document.getElementById('loading');
    
    // Animation states
    const animationStates = {
        'CoverAction': { isOpen: false },
        'SeatAction': { isOpen: false },
        'BidetAction': { isOpen: false },
        'AirventAction': { isOpen: false }
    };
    
    // Animation durations (you may need to adjust these)
    const animationDurations = {
        'CoverAction': 1000,
        'SeatAction': 800,
        'BidetAction': 1500, // Longer for bidet sequence
        'AirventAction': 1200
    };
    
    // Wait for model to load
    modelViewer.addEventListener('load', () => {
        console.log('Model loaded');
        loading.style.display = 'none';
        
        // Get available animations
        const animations = modelViewer.availableAnimations || [];
        console.log('Available animations:', animations);
        
        // Setup button listeners
        document.querySelectorAll('[data-animation]').forEach(button => {
            const animationName = button.getAttribute('data-animation');
            button.addEventListener('click', () => toggleAnimation(animationName));
        });
        
        // Reset button
        document.getElementById('btn-Reset').addEventListener('click', resetAll);
        
        // Initialize button states
        updateAllButtons();
    });
    
    // Handle errors
    modelViewer.addEventListener('error', (error) => {
        console.error('Model error:', error);
        loading.innerHTML = `
            <div style="color: #ff6b6b; margin-bottom: 15px;">⚠️ Error loading model</div>
            <p style="font-size: 12px;">Make sure toilet_final.glb is in the same folder</p>
        `;
    });
    
    // Toggle animation
    function toggleAnimation(animationName) {
        const state = animationStates[animationName];
        if (!state) return;
        
        // Toggle state
        state.isOpen = !state.isOpen;
        
        // Update button
        updateButton(animationName);
        
        // Play the animation
        playAnimation(animationName, state.isOpen);
        
        // Special logic: if closing cover, also close seat
        if (animationName === 'CoverAction' && !state.isOpen) {
            const seatState = animationStates.SeatAction;
            if (seatState.isOpen) {
                seatState.isOpen = false;
                updateButton('SeatAction');
                playAnimation('SeatAction', false);
            }
        }
    }
    
    // Play animation
    function playAnimation(animationName, playForward) {
        // For model-viewer, we need to set the animation name and play it
        modelViewer.animationName = animationName;
        
        if (playForward) {
            // Play forward
            modelViewer.play();
        } else {
            // Play in reverse (model-viewer doesn't directly support reverse,
            // so we'll play normally and update the state)
            modelViewer.play();
        }
        
        // After animation duration, stop it
        const duration = animationDurations[animationName] || 1000;
        setTimeout(() => {
            modelViewer.pause();
        }, duration);
    }
    
    // Update button appearance
    function updateButton(animationName) {
        const state = animationStates[animationName];
        const button = document.getElementById(`btn-${animationName}`);
        if (!button) return;
        
        const indicator = button.querySelector('.status-indicator');
        
        if (state.isOpen) {
            button.classList.add('on');
            button.classList.remove('off');
            if (indicator) indicator.style.background = '#44ff44';
            button.innerHTML = `<span class="status-indicator"></span>${animationName.replace('Action', '')} On`;
        } else {
            button.classList.add('off');
            button.classList.remove('on');
            if (indicator) indicator.style.background = '#ff4444';
            button.innerHTML = `<span class="status-indicator"></span>${animationName.replace('Action', '')}`;
        }
    }
    
    // Update all buttons
    function updateAllButtons() {
        Object.keys(animationStates).forEach(name => {
            updateButton(name);
        });
    }
    
    // Reset all animations
    function resetAll() {
        Object.keys(animationStates).forEach(name => {
            const state = animationStates[name];
            state.isOpen = false;
            updateButton(name);
        });
        
        // Reset model viewer
        modelViewer.time = 0;
        modelViewer.pause();
        
        // Visual feedback
        const resetBtn = document.getElementById('btn-Reset');
        resetBtn.style.background = '#28a745';
        setTimeout(() => {
            resetBtn.style.background = '';
        }, 300);
    }
    
    // Handle AR status
    modelViewer.addEventListener('ar-status', (event) => {
        console.log('AR status:', event.detail.status);
        
        if (event.detail.status === 'session-started') {
            // In AR mode, adjust controls
            document.querySelector('.controls').style.bottom = '20px';
        } else if (event.detail.status === 'session-ended') {
            document.querySelector('.controls').style.bottom = '40px';
        }
    });
    
    // iOS specific handling
    function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }
    
    // On iOS, we might need to handle AR differently
    if (isIOS()) {
        // iOS Safari works with model-viewer's AR
        console.log('iOS device detected - using model-viewer AR');
    }
</script>

</body>
</html>
