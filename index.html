<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Smart Toilet - Official AR Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; background-color: #121212; }

        /* Mobile-Friendly Control Panel */
        .controls {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            width: 90%; max-width: 400px; z-index: 100;
            padding: 20px; background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(20px); border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        button {
            padding: 16px 12px; border-radius: 12px; border: none;
            background: rgba(60, 60, 60, 0.9); color: white;
            font-weight: 700; font-size: 14px; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        button.active { background: #4CAF50; box-shadow: 0 0 15px rgba(76, 175, 80, 0.4); }
        #reset { grid-column: span 2; background: #2196F3; margin-top: 5px; }
        
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

<model-viewer id="toilet" 
    src="toilet_final.glb" 
    ios-src="toilet_final.usdz" 
    ar ar-modes="webxr quick-look" 
    camera-controls 
    shadow-intensity="1.5" 
    shadow-softness="1"
    scale="0.25 0.25 0.25"
    environment-image="neutral">

    <div class="controls">
        <button id="btn-Cover" onclick="handleToggle('CoverAction', 'btn-Cover')">Lid Open/Close</button>
        <button id="btn-Seat" onclick="handleToggle('SeatAction', 'btn-Seat')">Seat Open/Close</button>
        <button id="btn-Bidet" onclick="handleToggle('BidetAction', 'btn-Bidet')">Bidet Arm</button>
        <button id="btn-Air" onclick="handleToggle('AirventAction', 'btn-Air')">Air Vent</button>
        <button id="reset" onclick="location.reload()">Reset View</button>
    </div>
</model-viewer>

<script>
    const mv = document.querySelector('#toilet');
    const states = { CoverAction: false, SeatAction: false, BidetAction: false, AirventAction: false };

    function handleToggle(animName, btnId) {
        const btn = document.getElementById(btnId);
        
        // Target your specific NLA Tracks found in your Blender file
        mv.animationName = animName;
        
        // Repetitions: 1 ensures it plays once and holds position
        mv.play({ repetitions: 1 });
        btn.classList.toggle('active');

        // Smart Logic: If the outer Cover closes, automatically close the Seat
        if (animName === 'CoverAction' && !btn.classList.contains('active')) {
            const seatBtn = document.getElementById('btn-Seat');
            if (seatBtn.classList.contains('active')) {
                setTimeout(() => handleToggle('SeatAction', 'btn-Seat'), 250);
            }
        }
    }

    // Prevents the model from playing animations automatically when the page loads
    mv.addEventListener('load', () => {
        mv.pause();
    });
</script>

</body>
</html>
