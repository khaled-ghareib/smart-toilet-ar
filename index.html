<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Toilet Pro</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: -apple-system, sans-serif; color: white; }
        model-viewer { width: 100vw; height: 100vh; }
        .controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 90%;
        }
        button {
            padding: 16px; border-radius: 12px; border: 1px solid #444;
            background: rgba(30, 30, 30, 0.9); color: white; font-weight: bold;
            transition: all 0.2s;
        }
        button.active { background: #007bff; border-color: #007bff; }
    </style>
</head>
<body>

<model-viewer id="toilet" src="toilet_final.glb" ar camera-controls autoplay="false">
    <div class="controls">
        <button id="btn-CoverAction" onclick="handleAction('CoverAction')">Cover</button>
        <button id="btn-SeatAction" onclick="handleAction('SeatAction')">Seat</button>
        <button id="btn-BidetCoverAction" onclick="handleAction('BidetCoverAction')">Bidet Lid</button>
        <button id="btn-BidetAction" onclick="handleAction('BidetAction')">Bidet</button>
        <button id="btn-AirventAction" onclick="handleAction('AirventAction')">Air Vent</button>
        <button id="btn-LEDAction" onclick="handleAction('LEDAction')">LED</button>
    </div>
</model-viewer>

<script>
    const mv = document.querySelector('#toilet');
    let actions = {}; 
    let states = {
        CoverAction: false, SeatAction: false, BidetAction: false, 
        BidetCoverAction: false, AirventAction: false, LEDAction: false
    };

    // Initialize the Three.js Mixer to allow multiple animations at once
    mv.addEventListener('load', () => {
        const symbol = Object.getOwnPropertySymbols(mv).find(s => s.description === 'scene');
        const scene = mv[symbol];
        
        // Setup the mixer
        mv.mixer = new THREE.AnimationMixer(scene);
        
        // Map every animation found in your GLB file
        mv.getAnimations().forEach(clip => {
            const action = mv.mixer.clipAction(clip);
            action.setLoop(THREE.LoopOnce); // Kill infinite loops
            action.clampWhenFinished = true; // Hold final position
            actions[clip.name] = action;
        });

        // Run the internal update loop
        const clock = new THREE.Clock();
        const animate = () => {
            requestAnimationFrame(animate);
            if (mv.mixer) mv.mixer.update(clock.getDelta());
        };
        animate();
    });

    function handleAction(name) {
        const btn = document.getElementById(`btn-${name}`);
        const action = actions[name];
        if (!action) return;

        // Toggle the state
        states[name] = !states[name];

        if (states[name]) {
            // OPENING
            btn.classList.add('active');
            action.paused = false;
            action.timeScale = 1; 
            action.play();
        } else {
            // CLOSING
            btn.classList.remove('active');
            action.paused = false;
            action.timeScale = -1; // Play backwards
            action.play();

            // --- THE MASTER CLOSE FEATURE ---
            // If the Main Cover is closed, shut everything else too
            if (name === 'CoverAction') {
                Object.keys(states).forEach(key => {
                    if (key !== 'CoverAction' && states[key] === true) {
                        // Trigger the closing of each other active button
                        handleAction(key); 
                    }
                });
            }
        }
    }
</script>
</body>
</html>
