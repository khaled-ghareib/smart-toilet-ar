<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Icon Smart Toilet</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h2 { margin: 10px 0; }
    #container { width: 100%; max-width: 800px; height: 80vh; }
    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 15px;
    }
    button {
      padding: 16px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    button:hover {
      background: #2E7D32;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<h2>Icon Smart Toilet</h2>
<div id="container"></div>

<div class="buttons">
  <button data-action="CoverAction">Cover</button>
  <button data-action="SeatAction">Seat</button>
  <button data-action="Bidet">Bidet</button>
  <button data-action="AirventAction">Air Vent</button>
  <button id="arButton">View in AR</button>
</div>

<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';
  import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
  import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/controls/OrbitControls.js';

  const container = document.getElementById('container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(2, 2, 3);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  light.position.set(0, 5, 0);
  scene.add(light);

  const loader = new GLTFLoader();
  let mixer;
  let actions = {};

  loader.load(
    'https://cdn.jsdelivr.net/gh/khaled-ghareib/smart-toilet-ar@main/toilet_web.glb',
    (gltf) => {
      scene.add(gltf.scene);
      mixer = new THREE.AnimationMixer(gltf.scene);

      gltf.animations.forEach((clip) => {
        actions[clip.name] = mixer.clipAction(clip);
        actions[clip.name].clampWhenFinished = true;
        actions[clip.name].loop = THREE.LoopOnce;
      });

      animate();
    },
    undefined,
    (err) => { console.error('Error loading GLB:', err); }
  );

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    if (mixer) mixer.update(clock.getDelta());
    controls.update();
    renderer.render(scene, camera);
  }

  // Animation buttons
  const buttons = document.querySelectorAll('.buttons button[data-action]');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (!mixer) return;
      const actionName = btn.dataset.action;

      if (actionName === 'Bidet') {
        if (actions['BidetCoverAction']) actions['BidetCoverAction'].reset().play();
        setTimeout(() => {
          if (actions['BidetAction']) actions['BidetAction'].reset().play();
        }, 500);
      } else {
        if (actions[actionName]) actions[actionName].reset().play();
      }
    });
  });

  // AR button: iOS Quick Look / Android Scene Viewer
  const arButton = document.getElementById('arButton');
  arButton.addEventListener('click', () => {
    const ua = navigator.userAgent.toLowerCase();
    if (/iphone|ipad|ipod/.test(ua)) {
      // iOS Quick Look
      window.open(
        'https://www.arviewer.io/viewer/?file=https://raw.githubusercontent.com/khaled-ghareib/smart-toilet-ar/main/toilet_full_active.usdz',
        '_blank'
      );
    } else {
      // Android Scene Viewer
      window.location.href =
        'https://arvr.google.com/scene-viewer/1.0?file=https://cdn.jsdelivr.net/gh/khaled-ghareib/smart-toilet-ar@main/toilet_full_active.glb';
    }
  });

  // Handle resizing
  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
</script>

</body>
</html>
