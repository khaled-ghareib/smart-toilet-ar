<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Smart Toilet - AR with Current State</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Add GLTFExporter for exporting current state -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #000; 
            color: white; 
            height: 100vh; 
            position: relative;
        }
        
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #4CAF50;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #topBar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            display: none;
        }
        
        #title {
            font-size: 18px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 90%;
            max-width: 400px;
            padding: 15px;
            background: rgba(20,20,20,0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        
        .control-btn {
            padding: 16px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(40,40,40,0.9);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 55px;
        }
        
        .control-btn.on {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border-color: #4CAF50;
        }
        
        .control-btn.off {
            background: rgba(60,60,60,0.9);
        }
        
        .control-btn.reset {
            grid-column: span 2;
            background: linear-gradient(135deg, #2196F3, #0D47A1);
            border-color: #2196F3;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background: #f44336;
        }
        
        .control-btn.on .status-dot {
            background: #4CAF50;
        }
        
        #arButton {
            background: linear-gradient(135deg, #0a192f, #1a365d);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(10, 25, 47, 0.4);
            transition: all 0.2s ease;
        }
        
        #arButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(10, 25, 47, 0.6);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        #arLoading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        
        #arLoading .spinner {
            border-top-color: #0a192f;
        }
        
        .ar-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }
        
        .ar-modal-content {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        
        .ar-modal h2 {
            color: #0a192f;
            margin-bottom: 20px;
        }
        
        .ar-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        .ar-btn {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        
        .ar-btn.primary {
            background: linear-gradient(135deg, #0a192f, #1a365d);
            color: white;
        }
        
        .ar-btn.secondary {
            background: #666;
            color: white;
        }
        
        #arExportStatus {
            margin-top: 20px;
            font-size: 14px;
            color: #ccc;
        }
        
        @media (max-width: 768px) {
            #controls {
                bottom: 10px;
                padding: 12px;
                gap: 10px;
            }
            
            .control-btn {
                padding: 14px 10px;
                font-size: 13px;
                min-height: 50px;
            }
            
            #topBar {
                padding: 10px;
            }
            
            #title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div id="loading">
    <div class="spinner"></div>
    <div id="loadingText">Loading 3D Model...</div>
</div>

<div id="arLoading">
    <div class="spinner"></div>
    <div id="arExportStatus">Preparing AR with current state...</div>
</div>

<div class="ar-modal" id="arModal">
    <div class="ar-modal-content">
        <h2>Open in AR</h2>
        <p>The model will open in AR with the current positions:</p>
        
        <div style="background: rgba(10, 25, 47, 0.2); padding: 15px; border-radius: 10px; margin: 20px 0; text-align: left;">
            <div><strong>Current State:</strong></div>
            <div id="currentStateInfo">
                <div>Cover: <span id="coverState">Closed</span></div>
                <div>Seat: <span id="seatState">Closed</span></div>
                <div>Bidet: <span id="bidetState">Off</span></div>
                <div>Air Vent: <span id="airventState">Off</span></div>
            </div>
        </div>
        
        <div class="ar-buttons">
            <button class="ar-btn secondary" onclick="closeARModal()">Cancel</button>
            <button class="ar-btn primary" onclick="exportAndLaunchAR()">Open AR</button>
        </div>
    </div>
</div>

<div id="topBar">
    <div id="title">Icon Smart Toilet</div>
    <button id="arButton">
        <span>👁️</span>
        <span>View in AR</span>
    </button>
</div>

<div id="controls">
    <button class="control-btn off" data-animation="CoverAction" id="btnCover">
        <span class="status-dot"></span>
        <span>Cover</span>
    </button>
    <button class="control-btn off" data-animation="SeatAction" id="btnSeat">
        <span class="status-dot"></span>
        <span>Seat</span>
    </button>
    <button class="control-btn off" data-animation="BidetAction" id="btnBidet">
        <span class="status-dot"></span>
        <span>Bidet</span>
    </button>
    <button class="control-btn off" data-animation="AirventAction" id="btnAirvent">
        <span class="status-dot"></span>
        <span>Air Vent</span>
    </button>
    <button class="control-btn reset" id="btnReset">
        Reset All
    </button>
</div>

<!-- Hidden canvas for exporting -->
<canvas id="exportCanvas" style="display: none;"></canvas>

<script>
    let scene, camera, renderer, controls, mixer, model;
    let clock = new THREE.Clock();
    let exporter = new THREE.GLTFExporter();
    
    const animations = {
        CoverAction: { active: false, action: null, isAnimating: false },
        SeatAction: { active: false, action: null, isAnimating: false },
        BidetAction: { active: false, action: null, isAnimating: false },
        AirventAction: { active: false, action: null, isAnimating: false }
    };
    
    // Store the original GLB data for re-export
    let originalGLBData = null;
    
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 6);
        
        renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0.5, 0);
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);
        
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);
        
        loadModel();
        setupUI();
        animate();
        
        window.addEventListener('resize', onWindowResize);
    }
    
    async function loadModel() {
        try {
            // First, load the original GLB to store it
            const response = await fetch('toilet_final.glb');
            originalGLBData = await response.arrayBuffer();
            
            // Then load it into Three.js
            const loader = new THREE.GLTFLoader();
            loader.parse(originalGLBData, '', (gltf) => {
                console.log('✅ Model loaded successfully');
                model = gltf.scene;
                
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                model.position.x = -center.x;
                model.position.y = -box.min.y;
                model.position.z = -center.z;
                
                const maxSize = Math.max(size.x, size.y, size.z);
                if (maxSize > 5) {
                    const scale = 3 / maxSize;
                    model.scale.setScalar(scale);
                }
                
                scene.add(model);
                
                if (gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    
                    gltf.animations.forEach(animation => {
                        const action = mixer.clipAction(animation);
                        action.clampWhenFinished = true;
                        action.loop = THREE.LoopOnce;
                        
                        const animName = animation.name;
                        if (animations[animName]) {
                            animations[animName].action = action;
                            action.play();
                            action.paused = true;
                            action.time = 0;
                        }
                    });
                }
                
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('topBar').style.display = 'flex';
                    document.getElementById('controls').style.display = 'grid';
                    checkARSupport();
                }, 500);
            });
            
        } catch (error) {
            console.error('❌ Error loading model:', error);
            document.getElementById('loadingText').textContent = 'Error loading model';
            document.getElementById('loadingText').style.color = '#ff4444';
            
            setTimeout(() => {
                const retryBtn = document.createElement('button');
                retryBtn.textContent = 'Retry';
                retryBtn.style.cssText = `
                    margin-top: 20px;
                    padding: 10px 20px;
                    background: #4CAF50;
                    color: white;
                    border: none;
                    border-radius: 8px;
                    cursor: pointer;
                    font-weight: bold;
                `;
                retryBtn.onclick = () => location.reload();
                document.getElementById('loading').appendChild(retryBtn);
            }, 1000);
        }
    }
    
    function setupUI() {
        document.querySelectorAll('.control-btn[data-animation]').forEach(btn => {
            btn.addEventListener('click', function() {
                const animName = this.getAttribute('data-animation');
                toggleAnimation(animName);
            });
        });
        
        document.getElementById('btnReset').addEventListener('click', resetAllAnimations);
        document.getElementById('arButton').addEventListener('click', openARModal);
    }
    
    function toggleAnimation(animName) {
        const anim = animations[animName];
        if (!anim || !anim.action || anim.isAnimating) return;
        
        anim.active = !anim.active;
        const targetTime = anim.active ? anim.action.getClip().duration : 0;
        
        if (animName === 'CoverAction' && !anim.active && animations.SeatAction.active) {
            closeSeatBeforeCover(targetTime);
            return;
        }
        
        animateToTime(anim.action, targetTime, 0.5, () => {
            anim.isAnimating = false;
        });
        anim.isAnimating = true;
        
        updateButtonState(animName, anim.active);
        updateCurrentStateDisplay();
    }
    
    function closeSeatBeforeCover(coverTargetTime) {
        const seatAnim = animations.SeatAction;
        const coverAnim = animations.CoverAction;
        
        if (!seatAnim.action || !coverAnim.action) return;
        
        seatAnim.isAnimating = true;
        coverAnim.isAnimating = true;
        
        animateToTime(seatAnim.action, 0, 0.4, () => {
            seatAnim.active = false;
            seatAnim.isAnimating = false;
            updateButtonState('SeatAction', false);
            
            setTimeout(() => {
                animateToTime(coverAnim.action, coverTargetTime, 0.4, () => {
                    coverAnim.active = false;
                    coverAnim.isAnimating = false;
                    updateButtonState('CoverAction', false);
                    updateCurrentStateDisplay();
                });
            }, 100);
        });
    }
    
    function animateToTime(action, targetTime, duration, onComplete = null) {
        const startTime = action.time;
        const start = Date.now();
        
        function update() {
            const elapsed = (Date.now() - start) / 1000;
            const progress = Math.min(elapsed / duration, 1);
            
            const eased = progress < 0.5 
                ? 2 * progress * progress 
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            
            action.time = startTime + (targetTime - startTime) * eased;
            
            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                action.time = targetTime;
                action.paused = true;
                if (onComplete) onComplete();
            }
        }
        
        action.paused = false;
        update();
    }
    
    function updateButtonState(animName, isActive) {
        const btn = document.querySelector(`[data-animation="${animName}"]`);
        if (btn) {
            btn.classList.toggle('on', isActive);
            btn.classList.toggle('off', !isActive);
        }
    }
    
    function updateCurrentStateDisplay() {
        document.getElementById('coverState').textContent = animations.CoverAction.active ? 'Open' : 'Closed';
        document.getElementById('seatState').textContent = animations.SeatAction.active ? 'Open' : 'Closed';
        document.getElementById('bidetState').textContent = animations.BidetAction.active ? 'On' : 'Off';
        document.getElementById('airventState').textContent = animations.AirventAction.active ? 'On' : 'Off';
    }
    
    function resetAllAnimations() {
        let animationsToReset = [];
        
        if (animations.SeatAction.active && !animations.SeatAction.isAnimating) {
            animationsToReset.push('SeatAction');
        }
        
        if (animations.CoverAction.active && !animations.CoverAction.isAnimating) {
            animationsToReset.push('CoverAction');
        }
        
        ['BidetAction', 'AirventAction'].forEach(animName => {
            if (animations[animName].active && !animations[animName].isAnimating) {
                animationsToReset.push(animName);
            }
        });
        
        animationsToReset.forEach((animName, index) => {
            setTimeout(() => {
                const anim = animations[animName];
                if (anim && anim.action) {
                    anim.active = false;
                    animateToTime(anim.action, 0, 0.3, () => {
                        anim.isAnimating = false;
                    });
                    anim.isAnimating = true;
                    
                    updateButtonState(animName, false);
                }
            }, index * 150);
        });
        
        updateCurrentStateDisplay();
        
        const resetBtn = document.getElementById('btnReset');
        resetBtn.style.transform = 'scale(0.95)';
        setTimeout(() => {
            resetBtn.style.transform = '';
        }, 200);
    }
    
    function checkARSupport() {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        
        if (isIOS && isSafari) {
            fetch('toilet_final.glb', { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        document.getElementById('arButton').style.display = 'flex';
                    } else {
                        document.getElementById('arButton').style.display = 'flex';
                        document.getElementById('arButton').innerHTML = '<span>⚠️</span><span>Model File Missing</span>';
                        document.getElementById('arButton').style.background = 'linear-gradient(135deg, #f44336, #d32f2f)';
                    }
                })
                .catch(() => {
                    document.getElementById('arButton').style.display = 'flex';
                    document.getElementById('arButton').innerHTML = '<span>⚠️</span><span>Model File Missing</span>';
                    document.getElementById('arButton').style.background = 'linear-gradient(135deg, #f44336, #d32f2f)';
                });
        } else if (isIOS) {
            document.getElementById('arButton').style.display = 'flex';
            document.getElementById('arButton').innerHTML = '<span>⚠️</span><span>Use Safari for AR</span>';
            document.getElementById('arButton').style.background = 'linear-gradient(135deg, #f44336, #d32f2f)';
        } else {
            document.getElementById('arButton').style.display = 'flex';
            document.getElementById('arButton').innerHTML = '<span>❌</span><span>AR Not Supported</span>';
            document.getElementById('arButton').style.background = 'linear-gradient(135deg, #666, #333)';
        }
    }
    
    function openARModal() {
        updateCurrentStateDisplay();
        document.getElementById('arModal').style.display = 'flex';
    }
    
    function closeARModal() {
        document.getElementById('arModal').style.display = 'none';
    }
    
    async function exportAndLaunchAR() {
        closeARModal();
        document.getElementById('arLoading').style.display = 'flex';
        document.getElementById('arExportStatus').textContent = 'Exporting current state...';
        
        try {
            // Clone the scene to avoid affecting the displayed model
            const exportScene = scene.clone();
            
            // Find the model in the cloned scene
            exportScene.traverse((child) => {
                if (child.isMesh) {
                    child.updateMatrixWorld(true);
                }
            });
            
            // Export as GLB with current animation states baked in
            exporter.parse(exportScene, (glb) => {
                // Create a blob from the GLB
                const blob = new Blob([glb], { type: 'model/gltf-binary' });
                const url = URL.createObjectURL(blob);
                
                document.getElementById('arExportStatus').textContent = 'Opening AR...';
                
                // Create an anchor element to trigger AR Quick Look
                const arLink = document.createElement('a');
                arLink.href = url;
                arLink.setAttribute('rel', 'ar');
                arLink.setAttribute('download', 'toilet_current_state.glb');
                
                // Create AR badge image
                const img = document.createElement('img');
                img.src = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#0a192f"/><text x="50" y="55" font-family="Arial" font-size="20" fill="white" text-anchor="middle">AR</text></svg>');
                img.alt = 'AR';
                img.width = 100;
                img.height = 100;
                img.style.cssText = 'border-radius: 10px;';
                
                arLink.appendChild(img);
                document.body.appendChild(arLink);
                
                setTimeout(() => {
                    arLink.click();
                    
                    // Clean up
                    setTimeout(() => {
                        URL.revokeObjectURL(url);
                        if (arLink.parentNode) {
                            arLink.parentNode.removeChild(arLink);
                        }
                        document.getElementById('arLoading').style.display = 'none';
                    }, 3000);
                }, 100);
                
            }, { binary: true, animations: [] }); // Don't export animations, only current state
            
        } catch (error) {
            console.error('Error exporting model:', error);
            document.getElementById('arExportStatus').textContent = 'Error exporting model';
            
            // Fallback to original file
            setTimeout(() => {
                document.getElementById('arLoading').style.display = 'none';
                launchARWithOriginal();
            }, 2000);
        }
    }
    
    function launchARWithOriginal() {
        const arLink = document.createElement('a');
        arLink.href = 'toilet_final.usdz';
        arLink.setAttribute('rel', 'ar');
        
        const img = document.createElement('img');
        img.src = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#0a192f"/><text x="50" y="55" font-family="Arial" font-size="20" fill="white" text-anchor="middle">AR</text></svg>');
        img.alt = 'AR';
        img.width = 100;
        img.height = 100;
        img.style.cssText = 'border-radius: 10px;';
        
        arLink.appendChild(img);
        document.body.appendChild(arLink);
        
        setTimeout(() => {
            arLink.click();
            
            setTimeout(() => {
                if (arLink.parentNode) {
                    arLink.parentNode.removeChild(arLink);
                }
            }, 100);
        }, 100);
    }
    
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    function animate() {
        requestAnimationFrame(animate);
        
        const delta = clock.getDelta();
        
        if (mixer) {
            mixer.update(delta);
        }
        
        controls.update();
        renderer.render(scene, camera);
    }
    
    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
