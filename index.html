<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Smart Toilet | Interactive AR</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h2 { margin: 15px 0; font-weight: 300; letter-spacing: 1px; }
    #container { width: 100vw; height: 65vh; cursor: grab; }
    #container:active { cursor: grabbing; }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      max-width: 600px;
    }
    button {
      padding: 14px 22px;
      font-size: 14px;
      border: none;
      border-radius: 12px;
      background: #2e2e2e;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    /* Active Toggle State Color */
    button.active {
      background: #4CAF50;
      transform: translateY(-2px);
    }
    button:hover { background: #3d3d3d; }
    button.active:hover { background: #43A047; }

    #arButton {
      background: #ffffff;
      color: #000;
      font-weight: bold;
    }
    #arButton:hover { background: #e0e0e0; }
    #ar-link { display: none; }
  </style>
</head>
<body>

<h2>Icon Smart Toilet</h2>
<div id="container"></div>

<div class="buttons">
  <button id="btn-CoverAction" data-action="CoverAction">Cover</button>
  <button id="btn-SeatAction" data-action="SeatAction">Seat</button>
  <button id="btn-Bidet" data-action="Bidet">Bidet</button>
  <button id="btn-AirventAction" data-action="AirventAction">Air Vent</button>
  <button id="arButton">View in AR</button>
</div>

<a id="ar-link" rel="ar" href="https://raw.githubusercontent.com/khaled-ghareib/smart-toilet-ar/main/toilet_full_active.usdz">
  <img src="https://developer.apple.com/augmented-reality/quick-look/models/teapot/teapot_2x.png" alt="AR">
</a>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const container = document.getElementById('container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(1.8, 1.2, 2.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(5, 10, 7.5);
  scene.add(dirLight);

  const loader = new GLTFLoader();
  let mixer;
  const actions = {};
  const toggles = {
    CoverAction: false,
    SeatAction: false,
    Bidet: false,
    AirventAction: false
  };

  loader.load(
    'https://cdn.jsdelivr.net/gh/khaled-ghareib/smart-toilet-ar@main/toilet_web.glb',
    (gltf) => {
      scene.add(gltf.scene);
      
      // Auto-center (Optional if you already centered in Blender)
      const box = new THREE.Box3().setFromObject(gltf.scene);
      const center = box.getCenter(new THREE.Vector3());
      gltf.scene.position.sub(center);

      mixer = new THREE.AnimationMixer(gltf.scene);

      gltf.animations.forEach((clip) => {
        const action = mixer.clipAction(clip);
        action.setLoop(THREE.LoopOnce);
        action.clampWhenFinished = true;
        actions[clip.name] = action;
      });
    }
  );

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    if (mixer) mixer.update(clock.getDelta());
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Unified function to handle toggle logic
  function playToggleAnimation(name, forward) {
    const action = actions[name];
    if (!action) return;

    action.paused = false;
    if (forward) {
      action.timeScale = 1; // Play forward
      action.play();
    } else {
      action.timeScale = -1; // Play backward
      // If action finished forward, we must set time to duration to play back
      if (action.time === 0 && action.paused === false) action.time = action.getClip().duration;
      action.play();
    }
  }

  // Button Listeners
  document.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!mixer) return;
      const actionKey = btn.dataset.action;
      toggles[actionKey] = !toggles[actionKey];

      // Update UI Style
      btn.classList.toggle('active', toggles[actionKey]);

      if (actionKey === 'Bidet') {
        if (toggles.Bidet) {
          // OPEN: Cover then Wand
          playToggleAnimation('BidetCoverAction', true);
          setTimeout(() => playToggleAnimation('BidetAction', true), 500);
        } else {
          // CLOSE: Wand then Cover
          playToggleAnimation('BidetAction', false);
          setTimeout(() => playToggleAnimation('BidetCoverAction', false), 500);
        }
      } 
      else if (actionKey === 'CoverAction') {
        if (!toggles.CoverAction) {
          // If closing cover, check if seat is also open
          if (toggles.SeatAction) {
            toggles.SeatAction = false;
            const seatBtn = document.getElementById('btn-SeatAction');
            seatBtn.classList.remove('active');
            playToggleAnimation('SeatAction', false);
            
            // Delay cover close by 0.5s so seat closes first
            setTimeout(() => playToggleAnimation('CoverAction', false), 500);
          } else {
            playToggleAnimation('CoverAction', false);
          }
        } else {
          playToggleAnimation('CoverAction', true);
        }
      }
      else {
        // Generic toggle for Seat or Air Vent
        playToggleAnimation(actionKey, toggles[actionKey]);
      }
    });
  });

  // Native AR Button
  document.getElementById('arButton').addEventListener('click', (e) => {
    e.preventDefault();
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS) {
      document.getElementById('ar-link').click();
    } else {
      alert("AR Quick Look is for iOS. Use the web viewer on this device!");
    }
  });

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
</script>

</body>
</html>
