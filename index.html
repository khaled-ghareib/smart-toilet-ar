<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Icon Smart Toilet</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin:0; background:#111; color:white; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
    model-viewer { width: 100%; max-width: 600px; height: 80vh; }
    .buttons { display:flex; gap:10px; margin-top:10px; }
    button { padding:10px 16px; border:none; border-radius:6px; background:#4CAF50; color:white; cursor:pointer; }
    button:hover { background:#2E7D32; }
  </style>
</head>
<body>

<h2>Icon Smart Toilet</h2>

<model-viewer id="toiletViewer"
  src="toilet_web.glb"
  ar
  ar-modes="quick-look scene-viewer"
  camera-controls
  auto-rotate
  environment-image="neutral">
</model-viewer>

<div class="buttons">
  <button data-animation="CoverAction">Cover</button>
  <button data-animation="SeatAction">Seat</button>
  <button data-animation="BidetCoverAction,BidetAction">Bidet</button>
  <button data-animation="AirventAction">Air Vent</button>
</div>

<script>
  const viewer = document.getElementById('toiletViewer');
  const buttons = document.querySelectorAll('.buttons button');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const anims = btn.dataset.animation.split(',');
      anims.forEach((anim, i) => {
        setTimeout(() => {
          viewer.playAnimation(anim);
        }, i * 500); // 0.5s delay for chained animations like bidet
      });
    });
  });
</script>

</body>
</html>
