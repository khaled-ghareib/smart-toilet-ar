<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Smart Toilet - Three.js Viewer</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin: 16px 0;
      text-align: center;
    }
    #viewer {
      width: 100%;
      max-width: 800px;
      height: 80vh;
      background: #111;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }
    .buttons button {
      padding: 12px 18px;
      font-size: 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      transition: all 0.2s;
    }
    .buttons button:hover {
      transform: translateY(-2px);
    }
    .buttons button.active {
      background: #2E7D32;
    }
    .ar-button {
      margin-top: 20px;
      padding: 14px 24px;
      font-size: 16px;
      border-radius: 12px;
      background: #2196F3;
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ar-button:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<h1>Icon Smart Toilet</h1>
<div id="viewer"></div>

<div class="buttons">
  <button data-animation="CoverAction">Cover</button>
  <button data-animation="SeatAction">Seat</button>
  <button data-animation="BidetActionGroup">Bidet</button>
  <button data-animation="AirventAction">Air Vent</button>
</div>

<button class="ar-button" onclick="window.open('https://www.arviewer.io/view/0b08b77e-9fd8-473a-a65d-1ace5390b65b', '_blank')">
  View in AR
</button>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>
let scene, camera, renderer, controls, clock, mixer;
let animations = {}; // store animation actions
let activeAnimations = new Set();

init();
animate();

function init() {
  const container = document.getElementById('viewer');

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 100);
  camera.position.set(0, 1.5, 3);

  renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.8, 0);
  controls.update();

  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  light.position.set(0, 2, 0);
  scene.add(light);

  clock = new THREE.Clock();

  const loader = new THREE.GLTFLoader();
  loader.load(
    'https://raw.githubusercontent.com/khaled-ghareib/smart-toilet-ar/main/toilet_web.glb', 
    function(gltf) {
      const model = gltf.scene;
      scene.add(model);

      mixer = new THREE.AnimationMixer(model);

      gltf.animations.forEach((clip) => {
        const action = mixer.clipAction(clip);
        action.clampWhenFinished = true; // stops at final frame
        action.loop = THREE.LoopOnce;
        animations[clip.name] = action;
      });
    },
    undefined,
    function(error) {
      console.error("Error loading GLB:", error);
    }
  );

  window.addEventListener('resize', onWindowResize, false);

  const buttons = document.querySelectorAll('.buttons button');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const anim = btn.getAttribute('data-animation');

      // Update button highlight
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if(anim === "BidetActionGroup") {
        if(animations["BidetCoverAction"] && !activeAnimations.has("BidetCoverAction")) {
          animations["BidetCoverAction"].reset().play();
          activeAnimations.add("BidetCoverAction");
        }
        setTimeout(() => {
          if(animations["BidetAction"] && !activeAnimations.has("BidetAction")) {
            animations["BidetAction"].reset().play();
            activeAnimations.add("BidetAction");
          }
        }, 500);
        return;
      }

      if(animations[anim] && !activeAnimations.has(anim)) {
        animations[anim].reset().play();
        activeAnimations.add(anim);
      }
    });
  });
}

function onWindowResize() {
  const container = document.getElementById('viewer');
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if(mixer) mixer.update(delta);
  renderer.render(scene, camera);
}
</script>

</body>
</html>
