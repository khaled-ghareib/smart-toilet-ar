<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Icon Smart Toilet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
  }

  #title {
    position: absolute;
    top: 15px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 24px;
    z-index: 10;
  }

  #buttons {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 10px;
    z-index: 10;
    flex-wrap: wrap;
  }

  button {
    padding: 10px 16px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  #arBtn {
    background: #00c853;
    color: black;
    font-weight: bold;
  }
</style>
</head>

<body>

<div id="title">Icon Smart Toilet</div>

<div id="buttons">
  <button onclick="playCover()">Cover</button>
  <button onclick="playSeat()">Seat</button>
  <button onclick="playBidet()">Bidet</button>
  <button onclick="playAirvent()">Air Vent</button>
  <button id="arBtn" onclick="openAR()">View in AR</button>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js';

let scene, camera, renderer, mixer;
let actions = {};
let clock = new THREE.Clock();

init();
loadModel();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.5, 3);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const light1 = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  scene.add(light1);

  const light2 = new THREE.DirectionalLight(0xffffff, 1);
  light2.position.set(3, 5, 2);
  scene.add(light2);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function loadModel() {
  const loader = new GLTFLoader();

  loader.load(
    './toilet_web.glb',
    (gltf) => {
      scene.add(gltf.scene);

      mixer = new THREE.AnimationMixer(gltf.scene);

      gltf.animations.forEach(clip => {
        const action = mixer.clipAction(clip);
        action.setLoop(THREE.LoopOnce);
        action.clampWhenFinished = true;
        actions[clip.name] = action;
      });

      console.log('Loaded animations:', Object.keys(actions));
    },
    undefined,
    (error) => {
      console.error('GLB load error:', error);
    }
  );
}

function playOnce(name) {
  if (!actions[name]) return;
  actions[name].reset();
  actions[name].play();
}

window.playCover = () => playOnce('CoverAction');
window.playSeat = () => playOnce('SeatAction');
window.playAirvent = () => playOnce('AirventAction');

window.playBidet = () => {
  playOnce('BidetCoverAction');
  setTimeout(() => playOnce('BidetAction'), 500);
};

window.openAR = () => {
  window.location.href = 'https://www.arviewer.io/view/0b08b77e-9fd8-473a-a65d-1ace5390b65b';
};

function animate() {
  requestAnimationFrame(animate);
  if (mixer) mixer.update(clock.getDelta());
  renderer.render(scene, camera);
}
</script>

</body>
</html>
