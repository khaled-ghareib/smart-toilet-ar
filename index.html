<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Smart Toilet AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root { --accent: #007bff; }
        body { margin: 0; background: #111; font-family: -apple-system, sans-serif; color: white; overflow: hidden; }
        
        model-viewer {
            width: 100vw; height: 100vh;
            background-color: #1a1a1a;
            --poster-color: transparent;
        }

        /* Controls Container */
        .controls {
            position: absolute; bottom: 40px; left: 50%;
            transform: translateX(-50%);
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; width: 90%; max-width: 400px;
            z-index: 100; padding: 20px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        button {
            padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(50, 50, 50, 0.9); color: white;
            font-weight: 600; font-size: 13px; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
        }

        button.active {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.4);
        }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #ff4444; margin-right: 8px;
        }

        button.active .status-dot { background: #44ff44; }

        #btn-Reset { grid-column: span 2; background: rgba(255,255,255,0.1); }

        /* AR Button Style */
        #ar-button {
            position: absolute; top: 20px; right: 20px;
            padding: 12px 24px; background: white; color: black;
            border-radius: 30px; border: none; font-weight: bold;
        }
    </style>
</head>
<body>

<model-viewer id="toilet" 
    src="toilet_final.glb" 
    ios-src="toilet_final.usdz"
    ar ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1" 
    exposure="1">

    <div class="controls" id="ar-controls">
        <button id="btn-CoverAction" onclick="toggleAnim('CoverAction')">
            <div class="status-dot"></div> Cover
        </button>
        <button id="btn-SeatAction" onclick="toggleAnim('SeatAction')">
            <div class="status-dot"></div> Seat
        </button>
        <button id="btn-BidetAction" onclick="toggleAnim('BidetAction')">
            <div class="status-dot"></div> Bidet
        </button>
        <button id="btn-AirventAction" onclick="toggleAnim('AirventAction')">
            <div class="status-dot"></div> Air Vent
        </button>
        <button id="btn-Reset" onclick="resetAll()">Reset All Settings</button>
    </div>

</model-viewer>

<script>
    const mv = document.querySelector('#toilet');
    const states = {
        CoverAction: false,
        SeatAction: false,
        BidetAction: false,
        AirventAction: false
    };

    function toggleAnim(name) {
        const btn = document.getElementById(`btn-${name}`);
        states[name] = !states[name];

        if (states[name]) {
            btn.classList.add('active');
            // Play the animation
            mv.animationName = name;
            mv.play({ repetitions: 1 });
        } else {
            btn.classList.remove('active');
            // To "reverse", we set to the animation and pause at the start
            // Model-viewer doesn't native reverse, so we re-trigger or reset
            mv.animationName = name;
            mv.play({ repetitions: 1 }); 
        }

        // Logic: If Cover is closed, visually turn off other buttons
        if (name === 'CoverAction' && !states[name]) {
            resetAll();
        }
    }

    function resetAll() {
        Object.keys(states).forEach(key => {
            states[key] = false;
            const btn = document.getElementById(`btn-${key}`);
            if(btn) btn.classList.remove('active');
        });
        mv.pause();
    }

    // Stop auto-looping on load
    mv.addEventListener('load', () => {
        mv.pause();
    });
</script>

</body>
</html>
