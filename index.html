<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Smart Toilet</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      background: #111;
      color: white;
      font-family: sans-serif;
    }
    h1 {
      margin: 16px 0;
      text-align: center;
    }
    model-viewer {
      width: 100%;
      max-width: 800px;
      height: 80vh;
    }
  </style>
</head>
<body>

  <h1>Icon Smart Toilet</h1>

  <model-viewer
    id="toiletViewer"
    src="toilet_web.glb" 
    ios-src="https://www.arviewer.io/view/toilet_full_active.glb" 
    ar
    ar-modes="quick-look scene-viewer"
    camera-controls
    auto-rotate
    environment-image="neutral">
  </model-viewer>

</body>
</html>
