<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Smart Toilet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: white;
            height: 100vh;
            width: 100vw;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 90%;
            max-width: 400px;
            z-index: 100;
            padding: 15px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none;
        }

        button {
            padding: 14px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(40, 40, 40, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.3px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        button:hover {
            background: rgba(60, 60, 60, 0.9);
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.95);
        }

        button.on {
            background: linear-gradient(135deg, #007bff, #0056cc);
            border-color: #007bff;
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        button.off {
            background: rgba(40, 40, 40, 0.9);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background: #ff4444;
            transition: background 0.3s;
        }

        button.on .status-indicator {
            background: #44ff44;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* AR button for iPhone compatibility */
        #arButton {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            display: none;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
            transition: all 0.2s ease;
        }

        #arButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4);
        }

        #arButton:active {
            transform: scale(0.95);
        }

        /* iOS-specific styles */
        .ios-ar-link {
            display: none;
        }

        .title-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 50;
            max-width: 90%;
            display: none;
        }

        .title-bar h1 {
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin: 0;
        }

        /* Device detection */
        .device-info {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            color: #aaa;
            z-index: 90;
            display: none;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: repeat(2, 1fr);
                bottom: 20px;
                padding: 12px;
            }
            
            button {
                font-size: 12px;
                padding: 12px 8px;
                min-height: 45px;
            }
            
            #arButton {
                top: 10px;
                right: 10px;
                padding: 10px 20px;
                font-size: 14px;
            }
            
            .title-bar {
                top: 10px;
                padding: 10px 20px;
            }
            
            .title-bar h1 {
                font-size: 16px;
            }
            
            .device-info {
                top: 60px;
                right: 10px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

<a href="toilet_final.usdz" rel="ar" class="ios-ar-link">
    <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHZpZXdCb3g9IjAgMCAxNiAxNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTggMEMzLjYgMCAwIDMuNiAwIDhDMCAxMi40IDMuNiAxNiA4IDE2QzEyLjQgMTYgMTYgMTIuNCAxNiA4QzE2IDMuNiAxMi40IDAgOCAwWk04IDE0LjRDNC40IDE0LjQgMS41IDExLjUgMS41IDhDNS42IDEuNiAxMC40IDEuNiAxNC41IDhDMTQuNSAxMS41IDExLjYgMTQuNCA4IDE0LjRWMTQuNFpNOCAxMi44QzEwLjIgMTIuOCAxMiAxMSAxMiA4QzEyIDQuOCA5LjIgMiA4IDJDNi44IDIgNS42IDIuNyA0LjggMy45QzQuMSA1LjEgMy43IDYuNSAzLjcgOEMzLjcgMTEuMiA1LjggMTIuOCA4IDEyLjhWMTIuOFoiIGZpbGw9IndoaXRlIi8+Cjwvc3ZnPgo=" alt="">
    View in AR
</a>

<button id="arButton">View in AR 👁️</button>

<div class="title-bar">
    <h1>Icon Smart Toilet</h1>
</div>

<div class="device-info" id="deviceInfo"></div>

<div id="loading">
    <div class="loading-spinner"></div>
    <p>Loading Icon Smart Toilet...</p>
</div>

<div class="controls">
    <button id="btn-CoverAction" data-animation="CoverAction">
        <span class="status-indicator"></span>
        Cover
    </button>
    <button id="btn-SeatAction" data-animation="SeatAction">
        <span class="status-indicator"></span>
        Seat
    </button>
    <button id="btn-BidetAction" data-animation="BidetAction">
        <span class="status-indicator"></span>
        Bidet
    </button>
    <button id="btn-AirventAction" data-animation="AirventAction">
        <span class="status-indicator"></span>
        Air Vent
    </button>
    <button id="btn-Reset" style="grid-column: span 2;">
        Reset All
    </button>
</div>

<script>
    // Detect iOS device
    function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }
    
    // Detect Android device
    function isAndroid() {
        return /Android/.test(navigator.userAgent);
    }
    
    // Check if WebXR is supported
    function isWebXRSupported() {
        return 'xr' in navigator && navigator.xr && navigator.xr.isSessionSupported;
    }
    
    // Scene setup
    let scene, camera, renderer, controls;
    let mixer;
    let model;
    
    // Animation states
    const animationStates = {
        'CoverAction': { isOpen: false, action: null, clip: null },
        'SeatAction': { isOpen: false, action: null, clip: null },
        'BidetAction': { isOpen: false, action: null, clip: null },
        'AirventAction': { isOpen: false, action: null, clip: null }
    };
    
    // Initialize Three.js scene
    function init() {
        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        // Create camera
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 5);
        camera.lookAt(0, 0.5, 0);
        
        // Create renderer
        renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // Add orbit controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.rotateSpeed = 0.5;
        controls.zoomSpeed = 1.0;
        controls.panSpeed = 0.8;
        controls.minDistance = 0.5;
        controls.maxDistance = 20;
        controls.maxPolarAngle = Math.PI / 2;
        controls.minPolarAngle = 0;
        controls.target.set(0, 0.5, 0);
        
        // Add lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainLight.position.set(5, 8, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);
        
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        fillLight.position.set(-5, 3, -5);
        scene.add(fillLight);
        
        // Load the 3D model
        loadModel();
        
        // Handle window resize
        window.addEventListener('resize', onWindowResize);
        
        // Setup AR button based on device
        setupARButton();
        
        // Start animation loop
        animate();
    }
    
    // Load the GLB model
    function loadModel() {
        const loader = new THREE.GLTFLoader();
        
        loader.load(
            'toilet_final.glb',
            function(gltf) {
                model = gltf.scene;
                
                // Scale the model if needed
                model.scale.set(1, 1, 1);
                
                // Calculate bounding box
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                // Scale model if needed
                const maxSize = Math.max(size.x, size.y, size.z);
                if (maxSize > 5) {
                    const scale = 2 / maxSize;
                    model.scale.set(scale, scale, scale);
                } else if (maxSize < 0.5) {
                    const scale = 2 / maxSize;
                    model.scale.set(scale, scale, scale);
                }
                
                // Recalculate after scaling
                box.setFromObject(model);
                box.getCenter(center);
                box.getSize(size);
                
                // Center the model
                model.position.x = -center.x;
                model.position.y = -center.y + (size.y / 2);
                model.position.z = -center.z;
                
                scene.add(model);
                
                // Enable shadows
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                // Setup animations
                setupAnimations(gltf);
                
                // Adjust camera
                const modelHeight = size.y;
                const modelWidth = Math.max(size.x, size.z);
                const distance = Math.max(modelHeight, modelWidth) * 2;
                
                camera.position.set(distance, distance * 0.6, distance);
                controls.target.set(0, modelHeight * 0.5, 0);
                controls.update();
                
                // Hide loading screen
                document.getElementById('loading').style.display = 'none';
                
                // Show controls and title
                document.querySelector('.controls').style.display = 'grid';
                document.querySelector('.title-bar').style.display = 'block';
                
                console.log('Model loaded successfully!');
            },
            function(xhr) {
                const percent = (xhr.loaded / xhr.total * 100).toFixed(2);
                document.getElementById('loading').innerHTML = `
                    <div class="loading-spinner"></div>
                    <p>Loading: ${percent}%</p>
                `;
            },
            function(error) {
                console.error('Error loading model:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #ff6b6b; margin-bottom: 15px;">⚠️ Error loading model</div>
                    <p style="font-size: 12px; opacity: 0.8;">Make sure toilet_final.glb is in the same folder</p>
                    <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 20px; background: #007bff; border: none; border-radius: 8px; color: white; cursor: pointer;">
                        Retry
                    </button>
                `;
            }
        );
    }
    
    // Setup animations
    function setupAnimations(gltf) {
        if (!gltf.animations || gltf.animations.length === 0) {
            console.warn('No animations found in the model!');
            document.querySelectorAll('[data-animation]').forEach(btn => {
                if (btn.id !== 'btn-Reset') {
                    btn.disabled = true;
                    btn.innerHTML = '<span class="status-indicator"></span>No Anim';
                    btn.style.opacity = '0.5';
                }
            });
            return;
        }
        
        mixer = new THREE.AnimationMixer(model);
        
        // Store all available animations
        gltf.animations.forEach(clip => {
            const name = clip.name;
            if (animationStates[name]) {
                animationStates[name].clip = clip;
                animationStates[name].action = mixer.clipAction(clip);
                animationStates[name].action.setEffectiveTimeScale(0);
            }
        });
        
        // Initialize all animations to start (closed position)
        Object.keys(animationStates).forEach(name => {
            const state = animationStates[name];
            if (state.action) {
                state.action.play();
                state.action.paused = true;
                state.action.time = 0;
            } else {
                console.warn(`Animation "${name}" not found in model`);
                const button = document.getElementById(`btn-${name}`);
                if (button) {
                    button.disabled = true;
                    button.innerHTML = '<span class="status-indicator"></span>Missing';
                    button.style.opacity = '0.5';
                }
            }
        });
    }
    
    // Setup AR button based on device type
    function setupARButton() {
        const deviceInfo = document.getElementById('deviceInfo');
        const arButton = document.getElementById('arButton');
        
        if (isIOS()) {
            // iOS - Use Apple's Quick Look
            console.log('iOS device detected - Using Apple Quick Look AR');
            deviceInfo.textContent = 'iOS AR Ready';
            deviceInfo.style.display = 'block';
            deviceInfo.style.background = 'rgba(40, 167, 69, 0.3)';
            
            // Show AR button for iOS
            arButton.style.display = 'block';
            arButton.textContent = 'View in AR 👁️';
            arButton.onclick = launchIOSAR;
            
        } else if (isAndroid() && isWebXRSupported()) {
            // Android with WebXR support
            console.log('Android device with WebXR detected');
            deviceInfo.textContent = 'Android AR Ready';
            deviceInfo.style.display = 'block';
            deviceInfo.style.background = 'rgba(40, 167, 69, 0.3)';
            
            // Show AR button for Android WebXR
            arButton.style.display = 'block';
            arButton.textContent = 'View in AR 👁️';
            arButton.onclick = launchWebXRAR;
            
        } else if (isAndroid()) {
            // Android without WebXR
            console.log('Android device without WebXR');
            deviceInfo.textContent = 'Android - Use Chrome for AR';
            deviceInfo.style.display = 'block';
            deviceInfo.style.background = 'rgba(255, 193, 7, 0.3)';
            
            // Show disabled AR button
            arButton.style.display = 'block';
            arButton.textContent = 'AR (Use Chrome)';
            arButton.style.opacity = '0.6';
            arButton.style.cursor = 'not-allowed';
            arButton.onclick = () => {
                alert('Please use Chrome browser on Android for AR experience.');
            };
            
        } else {
            // Desktop or unsupported device
            console.log('Desktop or unsupported device');
            deviceInfo.textContent = 'Desktop Mode';
            deviceInfo.style.display = 'block';
            deviceInfo.style.background = 'rgba(108, 117, 125, 0.3)';
            
            // Show WebXR button if supported
            if (isWebXRSupported()) {
                arButton.style.display = 'block';
                arButton.textContent = 'View in AR 👁️';
                arButton.onclick = launchWebXRAR;
            } else {
                arButton.style.display = 'none';
            }
        }
    }
    
    // Launch AR for iOS (Quick Look)
    function launchIOSAR() {
        // Check if USDZ file exists
        const usdzFile = 'toilet_final.usdz';
        
        // Create a hidden anchor with the USDZ file
        const arLink = document.querySelector('.ios-ar-link');
        
        // For iOS, we need to trigger the download and AR view
        if (isIOS()) {
            // Show instructions for iOS
            alert('For AR on iPhone:\n\n1. Tap "View in AR" below\n2. Tap "Download"\n3. Open in Files app\n4. Tap the USDZ file\n5. Tap "AR" icon in top right\n\nOr use Safari on iOS 12+ to open directly.');
            
            // Create a temporary link to trigger download
            const tempLink = document.createElement('a');
            tempLink.href = usdzFile;
            tempLink.download = 'Icon_Smart_Toilet.usdz';
            tempLink.style.display = 'none';
            document.body.appendChild(tempLink);
            tempLink.click();
            document.body.removeChild(tempLink);
            
            // Also show the AR link
            arLink.style.display = 'block';
            arLink.click();
            setTimeout(() => {
                arLink.style.display = 'none';
            }, 100);
        }
    }
    
    // Launch AR for WebXR (Android/Desktop)
    async function launchWebXRAR() {
        if (!isWebXRSupported()) {
            alert('WebXR not supported on this device/browser.\n\nFor AR:\niOS: Use Safari on iOS 12+\nAndroid: Use Chrome 81+\nDesktop: Use Chrome with WebXR flag enabled');
            return;
        }
        
        try {
            // Check if AR is supported
            const supported = await navigator.xr.isSessionSupported('immersive-ar');
            
            if (!supported) {
                alert('AR not supported on this device.\n\nMake sure:\n1. You are using HTTPS\n2. Your device supports AR\n3. Camera permissions are granted');
                return;
            }
            
            // Request AR session
            const session = await navigator.xr.requestSession('immersive-ar', {
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            });
            
            console.log('WebXR AR session started');
            
            // Set up the renderer for XR
            renderer.xr.enabled = true;
            renderer.xr.setSession(session);
            
            // Hide UI elements
            document.getElementById('arButton').style.display = 'none';
            document.querySelector('.title-bar').style.display = 'none';
            document.querySelector('.controls').style.display = 'none';
            document.getElementById('deviceInfo').style.display = 'none';
            
            // Show exit button
            const exitButton = document.createElement('button');
            exitButton.id = 'exitWebXR';
            exitButton.textContent = 'Exit AR';
            exitButton.style.cssText = `
                position: absolute;
                top: 20px;
                left: 20px;
                background: rgba(255, 0, 0, 0.8);
                color: white;
                padding: 12px 24px;
                border-radius: 25px;
                border: none;
                font-weight: bold;
                cursor: pointer;
                z-index: 1000;
            `;
            exitButton.addEventListener('click', () => {
                session.end();
            });
            document.body.appendChild(exitButton);
            
            // Handle session end
            session.addEventListener('end', () => {
                console.log('WebXR AR session ended');
                
                // Clean up
                renderer.xr.enabled = false;
                
                // Remove exit button
                const exitBtn = document.getElementById('exitWebXR');
                if (exitBtn) exitBtn.remove();
                
                // Show UI elements again
                document.getElementById('arButton').style.display = 'block';
                document.querySelector('.title-bar').style.display = 'block';
                document.querySelector('.controls').style.display = 'grid';
                document.getElementById('deviceInfo').style.display = 'block';
                
                // Reset camera
                camera.position.set(3, 2, 5);
                camera.lookAt(0, 0.5, 0);
                controls.update();
            });
            
        } catch (error) {
            console.error('Error starting WebXR AR:', error);
            alert('Failed to start AR: ' + error.message + '\n\nRequirements:\n1. HTTPS connection required\n2. Camera permissions\n3. AR-capable device\n\nTry:\n• Chrome on Android\n• Safari on iOS 13+');
        }
    }
    
    // Toggle animation
    async function toggleAnimation(animationName) {
        const state = animationStates[animationName];
        if (!state || !state.action) {
            console.warn(`Animation "${animationName}" not found or not loaded`);
            return;
        }
        
        state.isOpen = !state.isOpen;
        updateButton(animationName);
        
        // For BidetAction, play both lid and spray in sequence
        if (animationName === 'BidetAction') {
            await playBidetAnimation(state.isOpen);
        } else {
            animateToState(animationName, state.isOpen ? 1 : 0);
        }
        
        // If cover is closing, also close seat
        if (animationName === 'CoverAction' && !state.isOpen) {
            const seatState = animationStates.SeatAction;
            if (seatState && seatState.action && seatState.isOpen) {
                seatState.isOpen = false;
                updateButton('SeatAction');
                animateToState('SeatAction', 0);
            }
        }
    }
    
    // Play bidet animation sequence
    async function playBidetAnimation(isOpening) {
        const state = animationStates.BidetAction;
        if (!state || !state.action) return;
        
        if (isOpening) {
            // Opening: play from 0 to 1 (both lid open and spray)
            await animateToStateSequence('BidetAction', 0, 1, 2.0);
        } else {
            // Closing: play from 1 to 0 (spray stops, then lid closes)
            await animateToStateSequence('BidetAction', 1, 0, 2.0);
        }
    }
    
    // Animate from start to end with duration
    async function animateToStateSequence(animationName, startProgress, endProgress, duration) {
        return new Promise((resolve) => {
            const state = animationStates[animationName];
            if (!state || !state.action) {
                resolve();
                return;
            }
            
            const clipDuration = state.clip ? state.clip.duration : 1;
            const startTime = startProgress * clipDuration;
            const endTime = endProgress * clipDuration;
            
            state.action.paused = false;
            state.action.time = startTime;
            state.action.setEffectiveTimeScale(1);
            
            // Calculate speed for desired duration
            const timeDiff = endTime - startTime;
            const speed = timeDiff / duration;
            
            state.action.timeScale = speed;
            
            // When animation reaches target, pause it
            setTimeout(() => {
                state.action.paused = true;
                state.action.time = endTime;
                state.action.timeScale = 0;
                resolve();
            }, duration * 1000);
        });
    }
    
    // Animate to specific time
    function animateToState(animationName, targetProgress) {
        const state = animationStates[animationName];
        if (!state || !state.action) return;
        
        const clipDuration = state.clip ? state.clip.duration : 1;
        const targetTime = targetProgress * clipDuration;
        
        state.action.paused = false;
        state.action.setEffectiveTimeScale(1);
        
        const currentTime = state.action.time;
        const timeDiff = targetTime - currentTime;
        const speed = Math.abs(timeDiff) / 0.5;
        
        state.action.timeScale = timeDiff >= 0 ? speed : -speed;
        
        setTimeout(() => {
            state.action.paused = true;
            state.action.time = targetTime;
            state.action.timeScale = 0;
        }, 500);
    }
    
    // Update button appearance
    function updateButton(animationName) {
        const state = animationStates[animationName];
        const button = document.getElementById(`btn-${animationName}`);
        if (!button) return;
        
        const indicator = button.querySelector('.status-indicator');
        
        if (state.isOpen) {
            button.classList.add('on');
            button.classList.remove('off');
            if (indicator) indicator.style.background = '#44ff44';
            button.innerHTML = `<span class="status-indicator"></span>${animationName.replace('Action', '')} On`;
        } else {
            button.classList.add('off');
            button.classList.remove('on');
            if (indicator) indicator.style.background = '#ff4444';
            button.innerHTML = `<span class="status-indicator"></span>${animationName.replace('Action', '')}`;
        }
    }
    
    // Reset all animations
    function resetAll() {
        Object.keys(animationStates).forEach(name => {
            const state = animationStates[name];
            state.isOpen = false;
            
            if (state.action) {
                animateToState(name, 0);
            }
            
            updateButton(name);
        });
        
        const resetBtn = document.getElementById('btn-Reset');
        const originalBg = resetBtn.style.background;
        resetBtn.style.background = '#28a745';
        setTimeout(() => {
            resetBtn.style.background = originalBg;
        }, 300);
    }
    
    // Handle window resize
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // Animation loop
    let clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        
        const delta = clock.getDelta();
        
        if (mixer) {
            mixer.update(delta);
        }
        
        controls.update();
        renderer.render(scene, camera);
    }
    
    // Initialize the app
    window.addEventListener('DOMContentLoaded', () => {
        // Setup button event listeners
        document.querySelectorAll('[data-animation]').forEach(button => {
            if (button.id !== 'btn-Reset') {
                const animationName = button.getAttribute('data-animation');
                button.addEventListener('click', () => toggleAnimation(animationName));
            }
        });
        
        document.getElementById('btn-Reset').addEventListener('click', resetAll);
        
        // Show device info
        const deviceInfo = document.getElementById('deviceInfo');
        if (isIOS()) {
            deviceInfo.innerHTML = '📱 iOS Ready';
        } else if (isAndroid()) {
            deviceInfo.innerHTML = '📱 Android Ready';
        } else {
            deviceInfo.innerHTML = '💻 Desktop Mode';
        }
        
        // Initialize Three.js
        init();
    });
</script>
</body>
