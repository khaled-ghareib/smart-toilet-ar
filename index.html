<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';
  import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
  import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/controls/OrbitControls.js';

  const container = document.getElementById('container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(2, 2, 3);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
  light.position.set(0, 5, 0);
  scene.add(light);

  const loader = new GLTFLoader();
  let mixer;
  let actions = {};

  loader.load(
    'https://cdn.jsdelivr.net/gh/khaled-ghareib/smart-toilet-ar@main/toilet_web.glb',
    (gltf) => {
      scene.add(gltf.scene);
      mixer = new THREE.AnimationMixer(gltf.scene);

      gltf.animations.forEach((clip) => {
        const action = mixer.clipAction(clip);
        
        // GLOBAL SETTINGS FOR ALL ANIMATIONS
        action.setLoop(THREE.LoopOnce);      // Play once, no infinite looping
        action.clampWhenFinished = true;    // Stay at the last frame
        action.enabled = true;              // Keep the action active in the mixer
        
        actions[clip.name] = action;
      });

      animate();
    },
    undefined,
    (err) => { console.error('Error loading GLB:', err); }
  );

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    if (mixer) mixer.update(clock.getDelta());
    controls.update();
    renderer.render(scene, camera);
  }

  // Animation logic
  const buttons = document.querySelectorAll('.buttons button[data-action]');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (!mixer) return;
      const actionName = btn.dataset.action;

      if (actionName === 'Bidet') {
        // Play Bidet Cover first
        if (actions['BidetCoverAction']) {
            actions['BidetCoverAction'].stop(); // Reset to start if clicked again
            actions['BidetCoverAction'].play();
        }
        
        // Delay Bidet Wand movement by 0.5s
        setTimeout(() => {
          if (actions['BidetAction']) {
            actions['BidetAction'].stop();
            actions['BidetAction'].play();
          }
        }, 500);

      } else {
        // General logic for Cover, Seat, and AirVent
        if (actions[actionName]) {
          // .stop() is used instead of .reset() here to allow 
          // a clean replay from the start if the user clicks again.
          actions[actionName].stop().play();
        }
      }
    });
  });

  // AR button
  const arButton = document.getElementById('arButton');
  arButton.addEventListener('click', () => {
    window.open(
      'https://www.arviewer.io/viewer/?file=https://raw.githubusercontent.com/khaled-ghareib/smart-toilet-ar/main/toilet_full_active.usdz',
      '_blank'
    );
  });

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
</script>
