<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Toilet Pro AR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/WebXR.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: white;
            height: 100vh;
            width: 100vw;
        }

        #arButton {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            border: none;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            cursor: pointer;
            display: none;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 90%;
            max-width: 400px;
            z-index: 100;
            padding: 15px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        button {
            padding: 14px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(40, 40, 40, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.3px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        button:hover {
            background: rgba(60, 60, 60, 0.9);
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.95);
        }

        button.on {
            background: linear-gradient(135deg, #007bff, #0056cc);
            border-color: #007bff;
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        button.off {
            background: rgba(40, 40, 40, 0.9);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background: #ff4444;
            transition: background 0.3s;
        }

        button.on .status-indicator {
            background: #44ff44;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #enterVR, #enterAR {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
        }

        #enterAR {
            bottom: 70px;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: repeat(2, 1fr);
                bottom: 20px;
                padding: 12px;
            }
            
            button {
                font-size: 12px;
                padding: 12px 8px;
                min-height: 45px;
            }
            
            #arButton, #enterVR, #enterAR {
                padding: 10px 20px;
                font-size: 14px;
            }
            
            #enterVR {
                bottom: 10px;
                left: 10px;
            }
            
            #enterAR {
                bottom: 60px;
                left: 10px;
            }
        }
    </style>
</head>
<body>

<button id="arButton">Start AR 👁️</button>
<button id="enterVR" style="display: none;">Enter VR</button>
<button id="enterAR" style="display: none;">Enter AR</button>

<div id="loading">
    <div class="loading-spinner"></div>
    <p>Loading Smart Toilet Pro...</p>
</div>

<div class="controls">
    <button id="btn-CoverAction" data-animation="CoverAction">
        <span class="status-indicator"></span>
        Cover
    </button>
    <button id="btn-SeatAction" data-animation="SeatAction">
        <span class="status-indicator"></span>
        Seat
    </button>
    <button id="btn-BidetCoverAction" data-animation="BidetCoverAction">
        <span class="status-indicator"></span>
        Bidet Lid
    </button>
    <button id="btn-BidetAction" data-animation="BidetAction">
        <span class="status-indicator"></span>
        Bidet Spray
    </button>
    <button id="btn-AirventAction" data-animation="AirventAction">
        <span class="status-indicator"></span>
        Air Vent
    </button>
    <button id="btn-Reset" style="grid-column: span 2;">
        Reset All
    </button>
</div>

<script>
    // Scene setup
    let scene, camera, renderer, controls;
    let mixer;
    let model;
    let isAr = false;
    
    // Animation states
    const animationStates = {
        'CoverAction': { isOpen: false, action: null, clip: null },
        'SeatAction': { isOpen: false, action: null, clip: null },
        'BidetCoverAction': { isOpen: false, action: null, clip: null },
        'BidetAction': { isOpen: false, action: null, clip: null },
        'AirventAction': { isOpen: false, action: null, clip: null }
    };
    
    // Initialize Three.js scene
    function init() {
        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        // Create camera
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 2, 4);
        
        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Add orbit controls for desktop
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 1;
        controls.maxDistance = 10;
        controls.maxPolarAngle = Math.PI;
        
        // Add lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);
        
        // Load the 3D model
        loadModel();
        
        // Handle window resize
        window.addEventListener('resize', onWindowResize);
        
        // Setup XR buttons
        setupXR();
        
        // Start animation loop
        animate();
    }
    
    // Load the GLB model
    function loadModel() {
        const loader = new THREE.GLTFLoader();
        
        loader.load(
            'toilet_final.glb',
            function(gltf) {
                model = gltf.scene;
                scene.add(model);
                
                // Center the model
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center);
                
                // Setup animations
                setupAnimations(gltf);
                
                // Hide loading screen
                document.getElementById('loading').style.display = 'none';
                
                // Show controls
                document.querySelector('.controls').style.display = 'grid';
                
                console.log('Model loaded successfully!');
                console.log('Animations available:', gltf.animations.map(a => a.name));
            },
            function(xhr) {
                // Progress
                const percent = (xhr.loaded / xhr.total * 100).toFixed(2);
                console.log(`Loading: ${percent}%`);
            },
            function(error) {
                console.error('Error loading model:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #ff6b6b; margin-bottom: 15px;">⚠️ Error loading model</div>
                    <p style="font-size: 12px; opacity: 0.8;">Make sure toilet_final.glb is in the same folder</p>
                    <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 20px; background: #007bff; border: none; border-radius: 8px; color: white; cursor: pointer;">
                        Retry
                    </button>
                `;
            }
        );
    }
    
    // Setup animations
    function setupAnimations(gltf) {
        mixer = new THREE.AnimationMixer(model);
        
        // Find and store each animation clip
        gltf.animations.forEach(clip => {
            const name = clip.name;
            if (animationStates[name]) {
                animationStates[name].clip = clip;
                animationStates[name].action = mixer.clipAction(clip);
                animationStates[name].action.setEffectiveTimeScale(0); // Stop animation initially
            }
        });
        
        // Initialize all animations to start (closed position)
        Object.keys(animationStates).forEach(name => {
            const state = animationStates[name];
            if (state.action) {
                state.action.play();
                state.action.paused = true;
                state.action.time = 0; // Start at beginning
            }
        });
    }
    
    // Toggle animation
    function toggleAnimation(animationName) {
        const state = animationStates[animationName];
        if (!state || !state.action) {
            console.warn(`Animation "${animationName}" not found in model`);
            return;
        }
        
        // Toggle state
        state.isOpen = !state.isOpen;
        
        // Update button
        updateButton(animationName);
        
        // Animate to target state
        animateToState(animationName, state.isOpen ? 1 : 0);
        
        // Special logic: if cover is closing, close seat too
        if (animationName === 'CoverAction' && !state.isOpen) {
            const seatState = animationStates.SeatAction;
            if (seatState && seatState.isOpen) {
                seatState.isOpen = false;
                updateButton('SeatAction');
                animateToState('SeatAction', 0);
            }
        }
    }
    
    // Animate to specific time (0 = start, 1 = end)
    function animateToState(animationName, targetProgress) {
        const state = animationStates[animationName];
        if (!state || !state.action) return;
        
        const clipDuration = state.clip.duration;
        const targetTime = targetProgress * clipDuration;
        
        // Smooth transition
        state.action.paused = false;
        state.action.setEffectiveTimeScale(1);
        
        // Animate to target time
        const currentTime = state.action.time;
        const timeDiff = targetTime - currentTime;
        const speed = Math.abs(timeDiff) / 0.5; // 0.5 seconds duration
        
        state.action.timeScale = timeDiff >= 0 ? speed : -speed;
        
        // When animation reaches target, pause it
        setTimeout(() => {
            state.action.paused = true;
            state.action.time = targetTime;
        }, 500);
    }
    
    // Update button appearance
    function updateButton(animationName) {
        const state = animationStates[animationName];
        const button = document.getElementById(`btn-${animationName}`);
        const indicator = button.querySelector('.status-indicator');
        
        if (state.isOpen) {
            button.classList.add('on');
            button.classList.remove('off');
            indicator.style.background = '#44ff44';
            
            // Update button text
            const actionName = animationName.replace('Action', '');
            button.innerHTML = `<span class="status-indicator"></span>${actionName} On`;
        } else {
            button.classList.add('off');
            button.classList.remove('on');
            indicator.style.background = '#ff4444';
            
            // Update button text
            const actionName = animationName.replace('Action', '');
            button.innerHTML = `<span class="status-indicator"></span>${actionName} Off`;
        }
    }
    
    // Reset all animations
    function resetAll() {
        Object.keys(animationStates).forEach(name => {
            const state = animationStates[name];
            state.isOpen = false;
            
            // Animate to start
            if (state.action) {
                animateToState(name, 0);
            }
            
            // Update button
            updateButton(name);
        });
        
        // Visual feedback
        const resetBtn = document.getElementById('btn-Reset');
        resetBtn.style.background = '#28a745';
        setTimeout(() => {
            resetBtn.style.background = '';
        }, 300);
    }
    
    // Setup XR/AR
    function setupXR() {
        if ('xr' in navigator) {
            navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                if (supported) {
                    document.getElementById('enterAR').style.display = 'block';
                    document.getElementById('enterAR').addEventListener('click', enterAR);
                }
            });
            
            navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                if (supported) {
                    document.getElementById('enterVR').style.display = 'block';
                    document.getElementById('enterVR').addEventListener('click', enterVR);
                }
            });
        }
    }
    
    // Enter AR mode
    function enterAR() {
        const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
        
        navigator.xr.requestSession('immersive-ar', sessionInit).then((session) => {
            isAr = true;
            renderer.xr.setReferenceSpaceType('local');
            renderer.xr.setSession(session);
            
            // Hide buttons in AR mode
            document.getElementById('enterAR').style.display = 'none';
            document.getElementById('enterVR').style.display = 'none';
            
            // Show exit button
            const exitButton = document.createElement('button');
            exitButton.id = 'exitXR';
            exitButton.textContent = 'Exit AR';
            exitButton.style.cssText = `
                position: absolute;
                top: 20px;
                left: 20px;
                background: rgba(255, 255, 255, 0.9);
                color: #000;
                padding: 10px 20px;
                border-radius: 20px;
                border: none;
                font-weight: bold;
                cursor: pointer;
                z-index: 1000;
            `;
            exitButton.addEventListener('click', () => {
                session.end();
            });
            document.body.appendChild(exitButton);
            
            session.addEventListener('end', () => {
                isAr = false;
                document.getElementById('exitXR').remove();
                document.getElementById('enterAR').style.display = 'block';
                document.getElementById('enterVR').style.display = 'block';
                controls.enabled = true;
            });
            
            controls.enabled = false;
        }).catch(console.error);
    }
    
    // Enter VR mode
    function enterVR() {
        const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor'] };
        
        navigator.xr.requestSession('immersive-vr', sessionInit).then((session) => {
            renderer.xr.setReferenceSpaceType('local');
            renderer.xr.setSession(session);
            
            // Hide buttons in VR mode
            document.getElementById('enterAR').style.display = 'none';
            document.getElementById('enterVR').style.display = 'none';
            
            session.addEventListener('end', () => {
                document.getElementById('enterAR').style.display = 'block';
                document.getElementById('enterVR').style.display = 'block';
            });
        }).catch(console.error);
    }
    
    // Handle window resize
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // Animation loop
    function animate() {
        requestAnimationFrame(animate);
        
        if (mixer) {
            mixer.update(0.016); // Update animations (60fps)
        }
        
        if (!isAr) {
            controls.update();
        }
        
        renderer.render(scene, camera);
    }
    
    // Initialize the app when page loads
    window.addEventListener('DOMContentLoaded', () => {
        // Setup button event listeners
        document.querySelectorAll('[data-animation]').forEach(button => {
            if (button.id !== 'btn-Reset') {
                const animationName = button.getAttribute('data-animation');
                button.addEventListener('click', () => toggleAnimation(animationName));
            }
        });
        
        document.getElementById('btn-Reset').addEventListener('click', resetAll);
        
        // Initialize Three.js
        init();
    });
</script>
</body>
</html>
