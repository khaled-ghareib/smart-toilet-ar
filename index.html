<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Smart Toilet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: #000; color: white; height: 100vh; }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 15px; }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #007bff; animation: spin 1s ease-in-out infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .controls { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 90%; max-width: 400px; z-index: 100; padding: 15px; background: rgba(20,20,20,0.7); backdrop-filter: blur(20px); border-radius: 20px; display: none; }
        
        button { padding: 14px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(40,40,40,0.9); color: white; font-weight: 600; font-size: 13px; cursor: pointer; min-height: 50px; }
        button.on { background: linear-gradient(135deg, #007bff, #0056cc); border-color: #007bff; }
        button.off { background: rgba(40,40,40,0.9); }
        
        .status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: #ff4444; }
        button.on .status-indicator { background: #44ff44; }
        
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #arButton { position: absolute; top: 20px; right: 20px; background: linear-gradient(135deg, #28a745, #20c997); color: white; padding: 12px 24px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; z-index: 100; display: none; }
        
        .title-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 12px 24px; border-radius: 12px; text-align: center; z-index: 50; max-width: 90%; display: none; }
        .title-bar h1 { font-size: 18px; font-weight: 600; color: white; margin: 0; }
        
        /* Simple AR modal for iOS */
        #arModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .ar-modal-content { background: #1a1a1a; padding: 30px; border-radius: 20px; max-width: 90%; text-align: center; }
        
        @media (max-width: 768px) {
            .controls { bottom: 20px; padding: 12px; }
            button { font-size: 12px; padding: 12px 8px; min-height: 45px; }
            #arButton, .title-bar { top: 10px; padding: 10px 20px; }
            .title-bar h1 { font-size: 16px; }
            #arButton { right: 10px; font-size: 14px; }
        }
    </style>
</head>
<body>

<!-- AR Modal -->
<div id="arModal">
    <div class="ar-modal-content">
        <h2>AR Experience</h2>
        <p style="margin: 15px 0;">For the best AR experience:</p>
        
        <div style="text-align: left; margin: 20px 0; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px;">
            <p style="margin: 10px 0;"><strong>iPhone/iPad:</strong></p>
            <p style="margin: 5px 0; font-size: 14px; color: #aaa;">Use the 3D viewer below</p>
            <p style="margin: 5px 0; font-size: 14px; color: #aaa;">Full animation control</p>
            <p style="margin: 5px 0; font-size: 14px; color: #aaa;">Orbit around the model</p>
            
            <p style="margin: 20px 0 10px 0;"><strong>For True AR:</strong></p>
            <p style="margin: 5px 0; font-size: 14px; color: #aaa;">Export your model from Blender as USDZ</p>
            <p style="margin: 5px 0; font-size: 14px; color: #aaa;">Place in same folder as toilet_final.usdz</p>
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: center;">
            <button onclick="closeARModal()" style="background: #007bff;">Use 3D Viewer</button>
            <button onclick="window.location.reload()" style="background: #6c757d;">Refresh</button>
        </div>
    </div>
</div>

<button id="arButton">View in AR 👁️</button>

<div class="title-bar">
    <h1>Icon Smart Toilet</h1>
</div>

<div id="loading">
    <div class="loading-spinner"></div>
    <p>Loading Icon Smart Toilet...</p>
</div>

<div class="controls">
    <button id="btn-CoverAction" data-animation="CoverAction">
        <span class="status-indicator"></span>Cover
    </button>
    <button id="btn-SeatAction" data-animation="SeatAction">
        <span class="status-indicator"></span>Seat
    </button>
    <button id="btn-BidetAction" data-animation="BidetAction">
        <span class="status-indicator"></span>Bidet
    </button>
    <button id="btn-AirventAction" data-animation="AirventAction">
        <span class="status-indicator"></span>Air Vent
    </button>
    <button id="btn-Reset" style="grid-column: span 2;">
        Reset All
    </button>
</div>

<script>
    // Simple device detection
    function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }
    
    // Scene setup
    let scene, camera, renderer, controls, mixer, model;
    let isAnimating = false;
    let currentAnimation = null;
    
    // Animation states - FIXED to prevent looping
    const animationStates = {
        'CoverAction': { isOpen: false, action: null, isPlaying: false },
        'SeatAction': { isOpen: false, action: null, isPlaying: false },
        'BidetAction': { isOpen: false, action: null, isPlaying: false },
        'AirventAction': { isOpen: false, action: null, isPlaying: false }
    };
    
    function init() {
        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        // Create camera
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 5);
        
        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        // Add orbit controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0.5, 0);
        
        // Add lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainLight.position.set(5, 8, 5);
        scene.add(mainLight);
        
        // Load the 3D model
        loadModel();
        
        // Setup AR button
        setupARButton();
        
        // Start animation loop
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }
    
    function loadModel() {
        const loader = new THREE.GLTFLoader();
        
        console.log('Loading model...');
        
        loader.load(
            'toilet_final.glb',
            (gltf) => {
                console.log('Model loaded successfully');
                model = gltf.scene;
                
                // Center the model
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                model.position.x = -center.x;
                model.position.y = -center.y + (size.y / 2);
                model.position.z = -center.z;
                
                scene.add(model);
                
                // Setup animations if available
                if (gltf.animations && gltf.animations.length > 0) {
                    console.log('Animations found:', gltf.animations.map(a => a.name));
                    
                    mixer = new THREE.AnimationMixer(model);
                    
                    gltf.animations.forEach(clip => {
                        const name = clip.name;
                        if (animationStates[name]) {
                            // Create action and configure it properly
                            const action = mixer.clipAction(clip);
                            action.clampWhenFinished = true; // Stop at end
                            action.loop = THREE.LoopOnce; // Play once
                            action.timeScale = 0; // Start stopped
                            
                            animationStates[name].action = action;
                            animationStates[name].clip = clip;
                            
                            // Play but immediately pause at start
                            action.play();
                            action.paused = true;
                            action.time = 0;
                        }
                    });
                } else {
                    console.warn('No animations found in model');
                }
                
                // Hide loading, show UI
                document.getElementById('loading').style.display = 'none';
                document.querySelector('.controls').style.display = 'grid';
                document.querySelector('.title-bar').style.display = 'block';
                
                console.log('Setup complete');
            },
            (xhr) => {
                // Loading progress
                const percent = (xhr.loaded / xhr.total * 100).toFixed(2);
                document.getElementById('loading').querySelector('p').textContent = `Loading: ${percent}%`;
            },
            (error) => {
                console.error('Error loading model:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #ff6b6b; margin-bottom: 15px;">⚠️ Error loading model</div>
                    <p style="font-size: 12px;">Make sure toilet_final.glb is in the same folder</p>
                `;
            }
        );
    }
    
    function setupARButton() {
        const arButton = document.getElementById('arButton');
        const isIOSDevice = isIOS();
        
        // For now, just show AR button with modal
        arButton.style.display = 'block';
        
        if (isIOSDevice) {
            arButton.onclick = showARModal;
        } else {
            arButton.onclick = showARModal;
        }
    }
    
    function showARModal() {
        document.getElementById('arModal').style.display = 'flex';
    }
    
    function closeARModal() {
        document.getElementById('arModal').style.display = 'none';
    }
    
    // FIXED: Proper animation control without looping
    function toggleAnimation(animationName) {
        const state = animationStates[animationName];
        if (!state || !state.action) {
            console.warn(`Animation "${animationName}" not available`);
            return;
        }
        
        // If currently playing, don't do anything
        if (state.isPlaying) {
            console.log('Animation already playing, waiting...');
            return;
        }
        
        // Stop any currently playing animation
        stopAllAnimations();
        
        // Toggle state
        state.isOpen = !state.isOpen;
        state.isPlaying = true;
        currentAnimation = animationName;
        
        // Update button immediately
        updateButton(animationName);
        
        // Play animation
        playAnimation(animationName, state.isOpen);
        
        // Special logic: if closing cover, also close seat
        if (animationName === 'CoverAction' && !state.isOpen) {
            const seatState = animationStates.SeatAction;
            if (seatState && seatState.isOpen) {
                setTimeout(() => {
                    seatState.isOpen = false;
                    seatState.isPlaying = true;
                    updateButton('SeatAction');
                    playAnimation('SeatAction', false);
                }, 300); // Slight delay
            }
        }
    }
    
    function playAnimation(animationName, playForward) {
        const state = animationStates[animationName];
        if (!state || !state.action) return;
        
        const clip = state.clip;
        const action = state.action;
        
        // Configure action
        action.reset(); // Reset to beginning
        action.clampWhenFinished = true;
        action.loop = THREE.LoopOnce;
        action.paused = false;
        
        if (playForward) {
            // Play forward from start to end
            action.time = 0;
            action.timeScale = 1.0;
        } else {
            // Play in reverse from end to start
            action.time = clip.duration;
            action.timeScale = -1.0;
        }
        
        console.log(`Playing ${animationName} ${playForward ? 'forward' : 'backward'}`);
        
        // Calculate animation duration
        const duration = clip.duration * 1000; // Convert to milliseconds
        
        // Set timeout to mark as finished
        setTimeout(() => {
            state.isPlaying = false;
            currentAnimation = null;
            
            // Ensure it stays at the end/start position
            if (playForward) {
                action.time = clip.duration;
            } else {
                action.time = 0;
            }
            action.paused = true;
            
            console.log(`Finished ${animationName}`);
        }, duration);
    }
    
    function stopAllAnimations() {
        Object.keys(animationStates).forEach(name => {
            const state = animationStates[name];
            if (state.action) {
                state.action.paused = true;
                state.isPlaying = false;
            }
        });
        currentAnimation = null;
    }
    
    function updateButton(animationName) {
        const state = animationStates[animationName];
        const button = document.getElementById(`btn-${animationName}`);
        if (!button) return;
        
        const indicator = button.querySelector('.status-indicator');
        
        if (state.isOpen) {
            button.classList.add('on');
            button.classList.remove('off');
            if (indicator) indicator.style.background = '#44ff44';
            button.innerHTML = `<span class="status-indicator"></span>${animationName.replace('Action', '')} On`;
        } else {
            button.classList.add('off');
            button.classList.remove('on');
            if (indicator) indicator.style.background = '#ff4444';
            button.innerHTML = `<span class="status-indicator"></span>${animationName.replace('Action', '')}`;
        }
    }
    
    function resetAll() {
        // Stop all animations
        stopAllAnimations();
        
        // Reset all states to closed
        Object.keys(animationStates).forEach(name => {
            const state = animationStates[name];
            state.isOpen = false;
            state.isPlaying = false;
            
            // Reset animation to start
            if (state.action && state.clip) {
                state.action.paused = true;
                state.action.time = 0;
            }
            
            updateButton(name);
        });
        
        // Visual feedback
        const resetBtn = document.getElementById('btn-Reset');
        resetBtn.style.background = '#28a745';
        setTimeout(() => {
            resetBtn.style.background = '';
        }, 300);
    }
    
    let clock = new THREE.Clock();
    
    function animate() {
        requestAnimationFrame(animate);
        
        const delta = clock.getDelta();
        
        // Update mixer if it exists
        if (mixer) {
            mixer.update(delta);
        }
        
        // Update controls
        controls.update();
        
        // Render scene
        renderer.render(scene, camera);
    }
    
    // Initialize when page loads
    window.addEventListener('DOMContentLoaded', () => {
        console.log('Page loaded, initializing...');
        
        // Setup button listeners
        document.querySelectorAll('[data-animation]').forEach(button => {
            if (button.id !== 'btn-Reset') {
                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    const animationName = button.getAttribute('data-animation');
                    console.log(`Button clicked: ${animationName}`);
                    toggleAnimation(animationName);
                });
            }
        });
        
        document.getElementById('btn-Reset').addEventListener('click', resetAll);
        
        // Initialize the app
        init();
    });
</script>
</body>
</html>
