<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Toilet AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; color: white; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; }
        .controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 90%; z-index: 10;
        }
        button {
            padding: 16px; border-radius: 12px; border: 1px solid #444;
            background: rgba(30, 30, 30, 0.9); color: white; font-weight: bold;
        }
        button.active { background: #007bff; border-color: #007bff; }
    </style>
</head>
<body>

<model-viewer id="toilet" src="toilet_final.glb" ar camera-controls autoplay="false" interaction-prompt="none">
    <div class="controls">
        <button id="btn-Cover" onclick="run('CoverAction', 'btn-Cover')">Cover</button>
        <button id="btn-Seat" onclick="run('SeatAction', 'btn-Seat')">Seat</button>
        <button id="btn-BidetCover" onclick="run('BidetCoverAction', 'btn-BidetCover')">Bidet Lid</button>
        <button id="btn-Bidet" onclick="run('BidetAction', 'btn-Bidet')">Bidet</button>
        <button id="btn-Airvent" onclick="run('AirventAction', 'btn-Airvent')">Air Vent</button>
        <button id="btn-LED" onclick="run('LEDAction', 'btn-LED')">LED</button>
    </div>
</model-viewer>

<script>
    const mv = document.querySelector('#toilet');
    let states = {}; 

    function run(name, id) {
        const btn = document.getElementById(id);
        
        // --- LOGIC RULES ---
        if ((name === 'SeatAction' || name === 'BidetCoverAction') && !states['CoverAction']) {
            alert("Open the Cover first!");
            return;
        }

        // --- TOGGLE STATE ---
        states[name] = !states[name];
        mv.animationName = name;

        if (states[name]) {
            // OPENING: Play forward and FREEZE at end
            btn.classList.add('active');
            mv.timeScale = 1; 
            mv.play({repetitions: 1});

            // This listener kills the loop and holds the position
            const clampOpen = () => {
                if (states[name] && mv.animationName === name) {
                    mv.pause(); // Stop the loop
                }
                mv.removeEventListener('finished', clampOpen);
            };
            mv.addEventListener('finished', clampOpen);

        } else {
            // CLOSING: Play in reverse and FREEZE at start
            btn.classList.remove('active');
            mv.timeScale = -1; 
            mv.play({repetitions: 1});

            const clampClosed = () => {
                if (!states[name] && mv.animationName === name) {
                    mv.pause();
                    mv.currentTime = 0; // Ensure it's back to base pose
                }
                mv.removeEventListener('finished', clampClosed);
            };
            mv.addEventListener('finished', clampClosed);
        }
    }
</script>
</body>
</html>
