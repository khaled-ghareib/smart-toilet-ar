<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Toilet Pro AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: white; overflow: hidden; }
        
        /* The viewer takes up the full screen */
        model-viewer {
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
        }

        /* Modern Glassmorphism Controls */
        .controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 90%;
            max-width: 400px;
            z-index: 100;
        }

        button {
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(40, 40, 40, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.95);
            background: #007bff;
        }

        button.active {
            background: #007bff;
            border-color: #007bff;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.4);
        }

        /* Custom AR Button Styling */
        #ar-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fff;
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            border: none;
        }
    </style>
</head>
<body>

<model-viewer id="toilet" 
    src="toilet_final.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    poster="poster.webp" 
    shadow-intensity="2" 
    exposure="1"
    environment-image="neutral">

    <div class="controls">
        <button id="btn-CoverAction" onclick="toggleAnimation('CoverAction')">Toggle Cover</button>
        <button id="btn-SeatAction" onclick="toggleAnimation('SeatAction')">Toggle Seat</button>
        <button id="btn-BidetCoverAction" onclick="toggleAnimation('BidetCoverAction')">Bidet Lid</button>
        <button id="btn-BidetAction" onclick="toggleAnimation('BidetAction')">Bidet Spray</button>
        <button id="btn-AirventAction" onclick="toggleAnimation('AirventAction')">Air Vent</button>
        <button id="btn-LEDAction" onclick="toggleAnimation('LEDAction')">LED Cycle</button>
    </div>

</model-viewer>

<script>
    const modelViewer = document.querySelector('#toilet');
    const states = {}; // Keeps track of which animations are "open" or "closed"

    function toggleAnimation(name) {
        const btn = document.getElementById(`btn-${name}`);
        
        // If it's the first time clicking, assume it's currently closed (false)
        if (states[name] === undefined) states[name] = false;

        // Toggle state
        states[name] = !states[name];

        if (states[name]) {
            // PLAY FORWARD
            btn.classList.add('active');
            modelViewer.animationName = name;
            modelViewer.play({ repetitions: 1 });
        } else {
            // PLAY BACKWARD
            // Note: Native <model-viewer> doesn't support easy reverse play via API.
            // This will restart the animation for now. 
            btn.classList.remove('active');
            modelViewer.animationName = name;
            modelViewer.play({ repetitions: 1 });
        }

        // Master Logic: If Cover is closed, reset other buttons visually
        if (name === 'CoverAction' && states[name] === false) {
            Object.keys(states).forEach(key => {
                if (key !== 'CoverAction') {
                    states[key] = false;
                    document.getElementById(`btn-${key}`).classList.remove('active');
                }
            });
        }
    }

    // Prevent auto-playing on start
    modelViewer.addEventListener('load', () => {
        modelViewer.pause();
    });
</script>

</body>
</html>
