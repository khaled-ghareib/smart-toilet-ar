<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Smart Toilet</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h2 { margin: 15px 0; font-weight: 300; }
    #container { width: 100%; max-width: 800px; height: 70vh; background: #1a1a1a; cursor: grab; }
    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
      padding: 10px;
    }
    button {
      padding: 16px 24px;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      background: #2e2e2e; /* Grey */
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { background: #444; }
    button.active { background: #4CAF50; } /* Green Toggle */
    
    #arButton {
      background: #ffffff;
      color: #000;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>Icon Smart Toilet</h2>
<div id="container"></div>

<div class="buttons">
  <button id="btn-CoverAction" data-action="CoverAction">Cover</button>
  <button id="btn-SeatAction" data-action="SeatAction">Seat</button>
  <button id="btn-Bidet" data-action="Bidet">Bidet</button>
  <button id="btn-AirventAction" data-action="AirventAction">Air Vent</button>
  <button id="arButton">View in AR</button>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const container = document.getElementById('container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(0, 0.8, 2); 

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
  scene.add(light);

  const loader = new GLTFLoader();
  let mixer, actions = {};
  const states = { CoverAction: false, SeatAction: false, Bidet: false, AirventAction: false };

  loader.load(
    'https://cdn.jsdelivr.net/gh/khaled-ghareib/smart-toilet-ar@main/toilet_web.glb',
    (gltf) => {
      const model = gltf.scene;
      
      // FORCED CENTERING LOGIC
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center); // Move model so its center is at 0,0,0
      
      scene.add(model);
      
      // Update controls to look at the new center
      controls.target.set(0, 0, 0);
      
      mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach((clip) => {
        const action = mixer.clipAction(clip);
        action.setLoop(THREE.LoopOnce);
        action.clampWhenFinished = true;
        actions[clip.name] = action;
      });
      animate();
    }
  );

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    if (mixer) mixer.update(clock.getDelta());
    controls.update();
    renderer.render(scene, camera);
  }

  function toggleAnim(name, open) {
    const action = actions[name];
    if (!action) return;
    action.paused = false;
    if (open) {
      action.timeScale = 1;
      action.play();
    } else {
      action.timeScale = -1;
      if (action.time === 0) action.time = action.getClip().duration;
      action.play();
    }
  }

  document.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!mixer) return;
      const key = btn.dataset.action;
      states[key] = !states[key];
      btn.classList.toggle('active', states[key]);

      if (key === 'Bidet') {
        if (states.Bidet) {
          toggleAnim('BidetCoverAction', true);
          setTimeout(() => toggleAnim('BidetAction', true), 500);
        } else {
          toggleAnim('BidetAction', false);
          setTimeout(() => toggleAnim('BidetCoverAction', false), 500);
        }
      } else if (key === 'CoverAction') {
        if (!states.CoverAction && states.SeatAction) {
          states.SeatAction = false;
          document.getElementById('btn-SeatAction').classList.remove('active');
          toggleAnim('SeatAction', false);
          setTimeout(() => toggleAnim('CoverAction', false), 500);
        } else {
          toggleAnim('CoverAction', states[key]);
        }
      } else {
        toggleAnim(key, states[key]);
      }
    });
  });

  // AR TRIGGER LOGIC
  document.getElementById('arButton').addEventListener('click', () => {
    const iosUrl = 'https://raw.githubusercontent.com/khaled-ghareib/smart-toilet-ar/main/toilet_full_active.usdz';
    const androidUrl = 'https://raw.githubusercontent.com/khaled-ghareib/smart-toilet-ar/main/toilet_full_active.glb';
    
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

    if (isIOS) {
      // Apple Quick Look
      const anchor = document.createElement('a');
      anchor.setAttribute('rel', 'ar');
      anchor.setAttribute('href', iosUrl);
      anchor.click();
    } else {
      // Google Scene Viewer
      const sceneViewerIntent = `intent://arvr.google.com/scene-viewer/1.0?file=${androidUrl}&mode=ar_only#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=https://developers.google.com/ar;end;`;
      window.location.href = sceneViewerIntent;
    }
  });

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
</script>

</body>
</html>
