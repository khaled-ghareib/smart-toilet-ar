<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Smart Toilet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: #000; color: white; height: 100vh; }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 15px; }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #007bff; animation: spin 1s ease-in-out infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .controls { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 90%; max-width: 400px; z-index: 100; padding: 15px; background: rgba(20,20,20,0.7); backdrop-filter: blur(20px); border-radius: 20px; display: none; }
        
        button { padding: 14px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(40,40,40,0.9); color: white; font-weight: 600; font-size: 13px; cursor: pointer; min-height: 50px; }
        button.on { background: linear-gradient(135deg, #007bff, #0056cc); border-color: #007bff; }
        button.off { background: rgba(40,40,40,0.9); }
        
        .status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: #ff4444; }
        button.on .status-indicator { background: #44ff44; }
        
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #arButton { position: absolute; top: 20px; right: 20px; background: linear-gradient(135deg, #28a745, #20c997); color: white; padding: 12px 24px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; z-index: 100; display: none; }
        
        .title-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 12px 24px; border-radius: 12px; text-align: center; z-index: 50; max-width: 90%; display: none; }
        .title-bar h1 { font-size: 18px; font-weight: 600; color: white; margin: 0; }
        
        /* iOS AR Modal */
        #iosARModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 20px; max-width: 90%; text-align: center; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
        
        @media (max-width: 768px) {
            .controls { bottom: 20px; padding: 12px; }
            button { font-size: 12px; padding: 12px 8px; min-height: 45px; }
            #arButton, .title-bar { top: 10px; padding: 10px 20px; }
            .title-bar h1 { font-size: 16px; }
            #arButton { right: 10px; font-size: 14px; }
        }
    </style>
</head>
<body>

<!-- iOS AR Modal -->
<div id="iosARModal">
    <div class="modal-content">
        <h2>AR on iPhone</h2>
        <p style="margin: 15px 0; line-height: 1.5;">To view in AR on iPhone:</p>
        
        <div style="text-align: left; margin: 20px 0; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px;">
            <p style="margin: 10px 0;"><strong>Option 1: Direct AR (Recommended)</strong></p>
            <p style="margin: 5px 0; font-size: 14px; color: #aaa;">Click the AR button below to open directly in AR</p>
            
            <p style="margin: 20px 0 10px 0;"><strong>Option 2: Download First</strong></p>
            <p style="margin: 5px 0; font-size: 14px; color: #aaa;">1. Download USDZ file</p>
            <p style="margin: 5px 0; font-size: 14px; color: #aaa;">2. Open in Files app</p>
            <p style="margin: 5px 0; font-size: 14px; color: #aaa;">3. Tap AR button in Files</p>
        </div>
        
        <div class="modal-buttons">
            <button id="openDirectAR" style="background: #28a745;">Open AR Now</button>
            <button id="downloadUSDZ" style="background: #007bff;">Download USDZ</button>
            <button id="closeModal" style="background: #6c757d;">Cancel</button>
        </div>
    </div>
</div>

<button id="arButton">View in AR 👁️</button>

<div class="title-bar">
    <h1>Icon Smart Toilet</h1>
</div>

<div id="loading">
    <div class="loading-spinner"></div>
    <p>Loading Icon Smart Toilet...</p>
</div>

<div class="controls">
    <button id="btn-CoverAction" data-animation="CoverAction">
        <span class="status-indicator"></span>Cover
    </button>
    <button id="btn-SeatAction" data-animation="SeatAction">
        <span class="status-indicator"></span>Seat
    </button>
    <button id="btn-BidetAction" data-animation="BidetAction">
        <span class="status-indicator"></span>Bidet
    </button>
    <button id="btn-AirventAction" data-animation="AirventAction">
        <span class="status-indicator"></span>Air Vent
    </button>
    <button id="btn-Reset" style="grid-column: span 2;">
        Reset All
    </button>
</div>

<script>
    // Simple device detection
    function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }
    
    // Simple scene setup
    let scene, camera, renderer, controls, mixer, model;
    
    const animationStates = {
        'CoverAction': { isOpen: false, action: null },
        'SeatAction': { isOpen: false, action: null },
        'BidetAction': { isOpen: false, action: null },
        'AirventAction': { isOpen: false, action: null }
    };
    
    function init() {
        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        // Create camera
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 5);
        
        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        // Add orbit controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0.5, 0);
        
        // Add lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainLight.position.set(5, 8, 5);
        scene.add(mainLight);
        
        // Load the 3D model
        loadModel();
        
        // Setup AR button
        setupARButton();
        
        // Start animation loop
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }
    
    function loadModel() {
        const loader = new THREE.GLTFLoader();
        
        // Try different paths for the GLB file
        const possiblePaths = [
            'toilet_final.glb',
            './toilet_final.glb',
            'models/toilet_final.glb',
            './models/toilet_final.glb'
        ];
        
        let currentPathIndex = 0;
        
        function tryLoad(path) {
            console.log('Trying to load from:', path);
            
            loader.load(
                path,
                (gltf) => {
                    model = gltf.scene;
                    
                    // Center the model
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    model.position.x = -center.x;
                    model.position.y = -center.y + (size.y / 2);
                    model.position.z = -center.z;
                    
                    scene.add(model);
                    
                    // Setup animations if available
                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(model);
                        
                        gltf.animations.forEach(clip => {
                            const name = clip.name;
                            if (animationStates[name]) {
                                animationStates[name].action = mixer.clipAction(clip);
                                animationStates[name].action.play();
                                animationStates[name].action.paused = true;
                                animationStates[name].action.time = 0;
                            }
                        });
                    }
                    
                    // Hide loading, show UI
                    document.getElementById('loading').style.display = 'none';
                    document.querySelector('.controls').style.display = 'grid';
                    document.querySelector('.title-bar').style.display = 'block';
                    
                    console.log('Model loaded successfully from:', path);
                },
                (xhr) => {
                    // Loading progress
                    const percent = (xhr.loaded / xhr.total * 100).toFixed(2);
                    document.getElementById('loading').querySelector('p').textContent = `Loading: ${percent}%`;
                },
                (error) => {
                    console.error('Error loading from', path, ':', error);
                    
                    // Try next path
                    currentPathIndex++;
                    if (currentPathIndex < possiblePaths.length) {
                        tryLoad(possiblePaths[currentPathIndex]);
                    } else {
                        // All paths failed
                        document.getElementById('loading').innerHTML = `
                            <div style="color: #ff6b6b; margin-bottom: 15px;">⚠️ Error loading model</div>
                            <p style="font-size: 12px; margin-bottom: 10px;">Tried paths: ${possiblePaths.join(', ')}</p>
                            <p style="font-size: 12px;">Make sure toilet_final.glb is in the same folder as this HTML file</p>
                        `;
                    }
                }
            );
        }
        
        // Start trying to load
        tryLoad(possiblePaths[0]);
    }
    
    function setupARButton() {
        const arButton = document.getElementById('arButton');
        const isIOSDevice = isIOS();
        
        // Show AR button for iOS and other devices with WebXR
        if (isIOSDevice || ('xr' in navigator)) {
            arButton.style.display = 'block';
            
            if (isIOSDevice) {
                // iOS - show modal with options
                arButton.onclick = showIOSARModal;
            } else {
                // Non-iOS devices
                if ('xr' in navigator) {
                    navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                        if (supported) {
                            arButton.onclick = () => {
                                alert('For WebXR AR (Android/Desktop):\n\n1. Use Chrome browser\n2. Visit via HTTPS (not file://)\n3. Grant camera permissions\n\nURL must start with https://');
                            };
                        } else {
                            arButton.onclick = () => {
                                alert('WebXR AR not supported on this device.\n\nFor iPhone: Use Safari with USDZ file');
                            };
                        }
                    });
                }
            }
        }
    }
    
    function showIOSARModal() {
        const modal = document.getElementById('iosARModal');
        modal.style.display = 'flex';
        
        // Setup modal buttons
        document.getElementById('openDirectAR').onclick = () => {
            openDirectAR();
            modal.style.display = 'none';
        };
        
        document.getElementById('downloadUSDZ').onclick = () => {
            downloadUSDZ();
            modal.style.display = 'none';
        };
        
        document.getElementById('closeModal').onclick = () => {
            modal.style.display = 'none';
        };
    }
    
    function openDirectAR() {
        // Create a proper AR link with all necessary attributes
        const arLink = document.createElement('a');
        
        // Try different paths for USDZ file
        const usdzPaths = [
            'toilet_final.usdz',
            './toilet_final.usdz',
            'models/toilet_final.usdz',
            './models/toilet_final.usdz'
        ];
        
        // Create a temporary div to test which file exists
        let foundPath = null;
        for (const path of usdzPaths) {
            const testLink = document.createElement('a');
            testLink.href = path;
            testLink.onerror = () => console.log('Path not found:', path);
            // We'll assume first path is correct for now
            foundPath = path;
            break;
        }
        
        if (foundPath) {
            arLink.href = foundPath;
            arLink.setAttribute('rel', 'ar');
            arLink.setAttribute('alt', 'Icon Smart Toilet AR');
            
            // Add AR badge image (required for iOS)
            const img = document.createElement('img');
            img.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHZpZXdCb3g9IjAgMCA2NCA2NCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTIiIGZpbGw9IiMyOGE3NDUiLz4KPHBhdGggZD0iTTMyIDQ4QzI0LjggNDggMTkgNDIuMiAxOSAzNUMxOSAyNy44IDI0LjggMjIgMzIgMjJDMzkuMiAyMiA0NSAyNy44IDQ1IDM1QzQ1IDQyLjIgMzkuMiA0OCAzMiA0OFoiIGZpbGw9IndoaXRlIi8+CjxwYXRoIGQ9Ik0zNi41IDM1QzM2LjUgMzcuNSAzNC41IDM5LjUgMzIgMzkuNUMyOS41IDM5LjUgMjcuNSAzNy41IDI3LjUgMzVDMjcuNSAzMi41IDI5LjUgMzAuNSAzMiAzMC41QzM0LjUgMzAuNSAzNi41IDMyLjUgMzYuNSAzNVoiIGZpbGw9IiMyOGE3NDUiLz4KPC9zdmc+Cg==';
            img.style.width = '64px';
            img.style.height = '64px';
            img.alt = 'AR';
            
            arLink.appendChild(img);
            arLink.style.display = 'none';
            
            document.body.appendChild(arLink);
            
            // Try to trigger AR
            arLink.click();
            
            // Show message if nothing happens after 1 second
            setTimeout(() => {
                alert('If AR didn\'t open:\n\n1. Make sure toilet_final.usdz is in the same folder\n2. Try downloading the USDZ file first\n3. Open the downloaded file in Files app\n4. Tap the AR button in Files');
            }, 1000);
            
            // Clean up
            setTimeout(() => {
                document.body.removeChild(arLink);
            }, 2000);
        } else {
            alert('USDZ file not found.\n\nPlease make sure toilet_final.usdz is in the same folder as this HTML file.');
        }
    }
    
    function downloadUSDZ() {
        // Create download link for USDZ
        const downloadLink = document.createElement('a');
        downloadLink.href = 'toilet_final.usdz';
        downloadLink.download = 'Icon_Smart_Toilet.usdz';
        downloadLink.style.display = 'none';
        document.body.appendChild(downloadLink);
        
        // Trigger download
        downloadLink.click();
        
        // Clean up
        setTimeout(() => {
            document.body.removeChild(downloadLink);
        }, 100);
        
        // Show instructions
        alert('USDZ file downloading...\n\nAfter download:\n1. Open Files app\n2. Find "Icon_Smart_Toilet.usdz"\n3. Tap the file\n4. Tap the AR button (cube icon) in top right');
    }
    
    function toggleAnimation(animationName) {
        const state = animationStates[animationName];
        if (!state || !state.action) {
            console.warn(`Animation "${animationName}" not found`);
            return;
        }
        
        state.isOpen = !state.isOpen;
        updateButton(animationName);
        
        // Play animation forward or backward
        state.action.paused = false;
        state.action.timeScale = state.isOpen ? 1 : -1;
        state.action.clampWhenFinished = true;
        state.action.loop = THREE.LoopOnce;
        
        // Pause after animation completes
        setTimeout(() => {
            state.action.paused = true;
        }, 500);
        
        // If closing cover, also close seat
        if (animationName === 'CoverAction' && !state.isOpen) {
            const seatState = animationStates.SeatAction;
            if (seatState && seatState.isOpen) {
                seatState.isOpen = false;
                updateButton('SeatAction');
                seatState.action.paused = false;
                seatState.action.timeScale = -1;
                setTimeout(() => {
                    seatState.action.paused = true;
                }, 500);
            }
        }
    }
    
    function updateButton(animationName) {
        const state = animationStates[animationName];
        const button = document.getElementById(`btn-${animationName}`);
        if (!button) return;
        
        const indicator = button.querySelector('.status-indicator');
        
        if (state.isOpen) {
            button.classList.add('on');
            button.classList.remove('off');
            if (indicator) indicator.style.background = '#44ff44';
            button.innerHTML = `<span class="status-indicator"></span>${animationName.replace('Action', '')} On`;
        } else {
            button.classList.add('off');
            button.classList.remove('on');
            if (indicator) indicator.style.background = '#ff4444';
            button.innerHTML = `<span class="status-indicator"></span>${animationName.replace('Action', '')}`;
        }
    }
    
    function resetAll() {
        Object.keys(animationStates).forEach(name => {
            const state = animationStates[name];
            state.isOpen = false;
            if (state.action) {
                state.action.paused = true;
                state.action.time = 0;
            }
            updateButton(name);
        });
    }
    
    function animate() {
        requestAnimationFrame(animate);
        if (mixer) mixer.update(0.016);
        controls.update();
        renderer.render(scene, camera);
    }
    
    // Initialize when page loads
    window.addEventListener('DOMContentLoaded', () => {
        // Setup button listeners
        document.querySelectorAll('[data-animation]').forEach(button => {
            if (button.id !== 'btn-Reset') {
                button.addEventListener('click', () => {
                    toggleAnimation(button.getAttribute('data-animation'));
                });
            }
        });
        
        document.getElementById('btn-Reset').addEventListener('click', resetAll);
        
        // Initialize the app
        init();
    });
</script>
</body>
</html>
