<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Smart Toilet - DEBUG MODE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: #000; color: white; height: 100vh; }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 15px; }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #007bff; animation: spin 1s ease-in-out infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .controls { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 90%; max-width: 400px; z-index: 100; padding: 15px; background: rgba(20,20,20,0.7); backdrop-filter: blur(20px); border-radius: 20px; }
        
        button { padding: 14px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(40,40,40,0.9); color: white; font-weight: 600; font-size: 13px; cursor: pointer; min-height: 50px; }
        button.on { background: linear-gradient(135deg, #007bff, #0056cc); border-color: #007bff; }
        button.off { background: rgba(40,40,40,0.9); }
        
        .status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: #ff4444; }
        button.on .status-indicator { background: #44ff44; }
        
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #arButton { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: linear-gradient(135deg, #28a745, #20c997); 
            color: white; 
            padding: 12px 24px; 
            border-radius: 25px; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            z-index: 100; 
        }
        
        .title-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 12px 24px; border-radius: 12px; text-align: center; z-index: 50; max-width: 90%; }
        .title-bar h1 { font-size: 18px; font-weight: 600; color: white; margin: 0; }
        
        /* Debug Panel */
        #debugPanel {
            position: absolute;
            top: 70px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            max-width: 300px;
            display: none;
            border-left: 4px solid #ff4444;
        }
        
        .debug-toggle {
            position: absolute;
            top: 70px;
            right: 120px;
            background: #ff4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            z-index: 100;
        }
        
        .debug-item {
            margin: 5px 0;
            padding: 5px;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
        }
        
        .error { color: #ff4444; }
        .success { color: #44ff44; }
        .warning { color: #ffaa00; }
        
        /* Quick AR Test */
        #quickAR {
            position: absolute;
            bottom: 120px;
            right: 20px;
            background: #ff9800;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            z-index: 100;
            display: none;
        }
        
        @media (max-width: 768px) {
            .controls { bottom: 20px; padding: 12px; }
            button { font-size: 12px; padding: 12px 8px; min-height: 45px; }
            #arButton, .title-bar { top: 10px; padding: 10px 20px; }
            .title-bar h1 { font-size: 16px; }
            #arButton { right: 10px; font-size: 14px; }
            .debug-toggle { top: 60px; right: 100px; }
            #debugPanel { top: 60px; left: 10px; max-width: 200px; }
        }
    </style>
</head>
<body>

<button class="debug-toggle" onclick="toggleDebug()">DEBUG</button>
<button id="quickAR" onclick="testARDirect()">TEST AR</button>
<button id="arButton">AR 👁️</button>

<div class="title-bar">
    <h1>Icon Smart Toilet</h1>
</div>

<div id="debugPanel">
    <div class="debug-item"><strong>DEBUG CONSOLE:</strong></div>
    <div id="debugLog"></div>
</div>

<div id="loading">
    <div class="loading-spinner"></div>
    <p id="loadingText">Loading toilet_final.glb...</p>
</div>

<div class="controls">
    <button id="btnCover" class="off">
        <span class="status-indicator"></span>Cover
    </button>
    <button id="btnSeat" class="off">
        <span class="status-indicator"></span>Seat
    </button>
    <button id="btnBidet" class="off">
        <span class="status-indicator"></span>Bidet
    </button>
    <button id="btnAirvent" class="off">
        <span class="status-indicator"></span>Air Vent
    </button>
    <button id="btnReset" style="grid-column: span 2;">
        Reset All
    </button>
</div>

<script>
    // ===== DEBUG SYSTEM =====
    let debugEnabled = false;
    const debugLog = [];
    
    function logDebug(message, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        const logEntry = { time: timestamp, message, type };
        debugLog.push(logEntry);
        
        if (debugEnabled) {
            const debugElement = document.getElementById('debugLog');
            const color = type === 'error' ? '#ff4444' : 
                         type === 'success' ? '#44ff44' : 
                         type === 'warning' ? '#ffaa00' : '#ffffff';
            
            debugElement.innerHTML += `
                <div class="debug-item" style="color: ${color};">
                    [${timestamp}] ${message}
                </div>
            `;
            debugElement.scrollTop = debugElement.scrollHeight;
        }
        
        console.log(`[${type.toUpperCase()}] ${message}`);
    }
    
    function toggleDebug() {
        debugEnabled = !debugEnabled;
        document.getElementById('debugPanel').style.display = debugEnabled ? 'block' : 'none';
        document.querySelector('.debug-toggle').textContent = debugEnabled ? 'HIDE DEBUG' : 'DEBUG';
        document.querySelector('.debug-toggle').style.background = debugEnabled ? '#44ff44' : '#ff4444';
        
        if (debugEnabled) {
            // Show recent logs
            document.getElementById('debugLog').innerHTML = debugLog.map(log => 
                `<div class="debug-item" style="color: ${log.type === 'error' ? '#ff4444' : log.type === 'success' ? '#44ff44' : log.type === 'warning' ? '#ffaa00' : '#ffffff'}">
                    [${log.time}] ${log.message}
                </div>`
            ).join('');
        }
    }
    
    // ===== MAIN APPLICATION =====
    let scene, camera, renderer, controls;
    let toilet = null;
    let toiletParts = {
        cover: { mesh: null, open: false, rotation: 0 },
        seat: { mesh: null, open: false, rotation: 0 },
        bidet: { mesh: null, open: false, position: 0 },
        airvent: { mesh: null, open: false, position: 0 }
    };
    
    // Initialize
    init();
    
    function init() {
        logDebug('Initializing application...', 'info');
        
        try {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 5);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);
            
            // Add controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 0.5, 0);
            
            // Add lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
            mainLight.position.set(5, 8, 5);
            scene.add(mainLight);
            
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
            fillLight.position.set(-5, 3, -5);
            scene.add(fillLight);
            
            logDebug('Three.js initialized successfully', 'success');
            
            // Setup event listeners
            setupEventListeners();
            
            // Load model
            loadModel();
            
            // Start animation loop
            animate();
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
            
        } catch (error) {
            logDebug(`Initialization error: ${error.message}`, 'error');
            showErrorMessage(`Three.js Error: ${error.message}`);
        }
    }
    
    function setupEventListeners() {
        logDebug('Setting up event listeners...', 'info');
        
        // Control buttons
        document.getElementById('btnCover').addEventListener('click', () => togglePart('cover'));
        document.getElementById('btnSeat').addEventListener('click', () => togglePart('seat'));
        document.getElementById('btnBidet').addEventListener('click', () => togglePart('bidet'));
        document.getElementById('btnAirvent').addEventListener('click', () => togglePart('airvent'));
        document.getElementById('btnReset').addEventListener('click', resetAll);
        
        // AR button
        document.getElementById('arButton').addEventListener('click', launchAR);
        
        logDebug('Event listeners setup complete', 'success');
    }
    
    function loadModel() {
        logDebug('Attempting to load toilet_final.glb...', 'info');
        
        // First, check if file exists
        fetch('toilet_final.glb')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: File not found or inaccessible`);
                }
                logDebug('GLB file found, loading...', 'success');
                return response;
            })
            .then(() => {
                const loader = new THREE.GLTFLoader();
                
                loader.load(
                    'toilet_final.glb',
                    // Success
                    (gltf) => {
                        logDebug('GLB file loaded successfully', 'success');
                        processLoadedModel(gltf);
                    },
                    // Progress
                    (xhr) => {
                        const percent = Math.round((xhr.loaded / xhr.total) * 100);
                        document.getElementById('loadingText').textContent = `Loading: ${percent}%`;
                        logDebug(`Loading progress: ${percent}%`, 'info');
                    },
                    // Error
                    (error) => {
                        logDebug(`GLTF Loader error: ${error.message}`, 'error');
                        createFallbackModel();
                    }
                );
            })
            .catch(error => {
                logDebug(`File check error: ${error.message}`, 'error');
                createFallbackModel();
            });
    }
    
    function processLoadedModel(gltf) {
        try {
            toilet = gltf.scene;
            
            // Analyze model structure
            logDebug('Analyzing model structure...', 'info');
            
            let meshCount = 0;
            let identifiedParts = [];
            
            toilet.traverse((child) => {
                if (child.isMesh) {
                    meshCount++;
                    
                    // Try to identify parts
                    const name = child.name.toLowerCase();
                    if (name.includes('cover') || name.includes('lid')) {
                        toiletParts.cover.mesh = child;
                        identifiedParts.push('cover');
                        logDebug(`Found cover mesh: ${child.name}`, 'success');
                    }
                    else if (name.includes('seat')) {
                        toiletParts.seat.mesh = child;
                        identifiedParts.push('seat');
                        logDebug(`Found seat mesh: ${child.name}`, 'success');
                    }
                    else if (name.includes('bidet') || name.includes('nozzle')) {
                        toiletParts.bidet.mesh = child;
                        identifiedParts.push('bidet');
                        logDebug(`Found bidet mesh: ${child.name}`, 'success');
                    }
                    else if (name.includes('air') || name.includes('vent')) {
                        toiletParts.airvent.mesh = child;
                        identifiedParts.push('airvent');
                        logDebug(`Found airvent mesh: ${child.name}`, 'success');
                    }
                }
            });
            
            logDebug(`Total meshes found: ${meshCount}`, 'info');
            logDebug(`Identified parts: ${identifiedParts.join(', ')}`, identifiedParts.length > 0 ? 'success' : 'warning');
            
            // Check if model is grouped properly
            const bbox = new THREE.Box3().setFromObject(toilet);
            const size = bbox.getSize(new THREE.Vector3());
            logDebug(`Model bounding box size: ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}`, 'info');
            
            // Position model
            const center = bbox.getCenter(new THREE.Vector3());
            toilet.position.x = -center.x;
            toilet.position.y = -center.y + (size.y / 2);
            toilet.position.z = -center.z;
            
            // Scale if too large
            const maxSize = Math.max(size.x, size.y, size.z);
            if (maxSize > 5) {
                const scale = 3 / maxSize;
                toilet.scale.setScalar(scale);
                logDebug(`Scaled model by ${scale.toFixed(2)}`, 'warning');
            }
            
            scene.add(toilet);
            
            // Hide loading, show UI
            document.getElementById('loading').style.display = 'none';
            document.getElementById('quickAR').style.display = 'block';
            
            logDebug('Model processing complete', 'success');
            
        } catch (error) {
            logDebug(`Error processing model: ${error.message}`, 'error');
            createFallbackModel();
        }
    }
    
    function createFallbackModel() {
        logDebug('Creating fallback model...', 'warning');
        
        toilet = new THREE.Group();
        toilet.name = 'Toilet_Fallback';
        
        // Create simple toilet
        const baseGeo = new THREE.CylinderGeometry(0.5, 0.6, 0.4, 32);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = 0.2;
        toilet.add(base);
        
        // Seat
        const seatGeo = new THREE.TorusGeometry(0.4, 0.05, 16, 100, Math.PI);
        const seatMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
        const seat = new THREE.Mesh(seatGeo, seatMat);
        seat.rotation.x = Math.PI / 2;
        seat.position.y = 0.42;
        toiletParts.seat.mesh = seat;
        toilet.add(seat);
        
        // Cover
        const coverGeo = new THREE.TorusGeometry(0.39, 0.04, 16, 100, Math.PI);
        const coverMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
        const cover = new THREE.Mesh(coverGeo, coverMat);
        cover.rotation.x = Math.PI / 2;
        cover.position.y = 0.47;
        toiletParts.cover.mesh = cover;
        toilet.add(cover);
        
        scene.add(toilet);
        toilet.position.y = 0.5;
        
        // Hide loading
        document.getElementById('loading').style.display = 'none';
        document.getElementById('quickAR').style.display = 'block';
        
        logDebug('Fallback model created', 'success');
    }
    
    function togglePart(partName) {
        logDebug(`Toggling ${partName}...`, 'info');
        
        const part = toiletParts[partName];
        if (!part) {
            logDebug(`Part "${partName}" not found`, 'error');
            return;
        }
        
        part.open = !part.open;
        const button = document.getElementById(`btn${partName.charAt(0).toUpperCase() + partName.slice(1)}`);
        
        // Update button
        button.classList.toggle('on', part.open);
        button.classList.toggle('off', !part.open);
        const indicator = button.querySelector('.status-indicator');
        if (indicator) {
            indicator.style.background = part.open ? '#44ff44' : '#ff4444';
        }
        
        // Animate the part
        animatePart(partName, part.open);
        
        logDebug(`${partName} is now ${part.open ? 'open' : 'closed'}`, 'success');
        
        // If closing cover, also close seat
        if (partName === 'cover' && !part.open && toiletParts.seat.open) {
            setTimeout(() => togglePart('seat'), 300);
        }
    }
    
    function animatePart(partName, open) {
        const part = toiletParts[partName];
        if (!part || !part.mesh) return;
        
        let targetValue;
        let property;
        
        switch(partName) {
            case 'cover':
            case 'seat':
                // Rotate around X axis (hinge at back)
                property = 'rotation';
                targetValue = open ? { x: Math.PI / 3 } : { x: 0 };
                break;
            case 'bidet':
            case 'airvent':
                // Move forward/back
                property = 'position';
                targetValue = open ? { z: 0.1 } : { z: 0 };
                break;
        }
        
        if (!targetValue) return;
        
        // Simple animation
        const startValue = {};
        const startTime = Date.now();
        const duration = 500;
        
        if (property === 'rotation') {
            startValue.x = part.mesh.rotation.x;
        } else if (property === 'position') {
            startValue.z = part.mesh.position.z;
        }
        
        function updateAnimation() {
            const elapsed = Date.now() - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            // Easing
            const eased = progress < 0.5 
                ? 2 * progress * progress 
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            
            if (property === 'rotation') {
                part.mesh.rotation.x = startValue.x + (targetValue.x - startValue.x) * eased;
            } else if (property === 'position') {
                part.mesh.position.z = startValue.z + (targetValue.z - startValue.z) * eased;
            }
            
            if (progress < 1) {
                requestAnimationFrame(updateAnimation);
            }
        }
        
        updateAnimation();
    }
    
    function resetAll() {
        logDebug('Resetting all parts...', 'info');
        
        Object.keys(toiletParts).forEach(partName => {
            const part = toiletParts[partName];
            if (part && part.open) {
                togglePart(partName);
            }
        });
        
        // Button feedback
        const resetBtn = document.getElementById('btnReset');
        resetBtn.style.background = '#28a745';
        setTimeout(() => {
            resetBtn.style.background = '';
        }, 300);
        
        logDebug('All parts reset', 'success');
    }
    
    function launchAR() {
        logDebug('Launching AR...', 'info');
        
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        
        if (!isIOS || !isSafari) {
            alert('AR requires Safari browser on iPhone/iPad');
            logDebug('AR failed: Wrong browser/device', 'warning');
            return;
        }
        
        // Create AR link
        const arLink = document.createElement('a');
        arLink.href = 'toilet_final.usdz';
        arLink.setAttribute('rel', 'ar');
        arLink.setAttribute('id', 'arLink');
        
        // Add preview image (required)
        const img = document.createElement('img');
        img.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjEwMCIgaGVpZ2h0PSIxMDAiIGZpbGw9IiMyOGE3NDUiLz48dGV4dCB4PSI1MCIgeT0iNTAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiPkFSPC90ZXh0Pjwvc3ZnPg==';
        img.alt = 'AR Preview';
        img.style.cssText = 'width:100px;height:100px;border-radius:10px;';
        
        arLink.appendChild(img);
        document.body.appendChild(arLink);
        
        // Trigger AR
        setTimeout(() => {
            arLink.click();
            logDebug('AR link clicked', 'success');
            
            // Clean up
            setTimeout(() => {
                if (arLink.parentNode) {
                    arLink.parentNode.removeChild(arLink);
                }
            }, 100);
        }, 100);
        
        // Log AR status
        setTimeout(() => {
            logDebug('AR launch attempted', 'info');
        }, 2000);
    }
    
    function testARDirect() {
        logDebug('Testing AR file directly...', 'info');
        
        // Check if USDZ exists
        fetch('toilet_final.usdz', { method: 'HEAD' })
            .then(response => {
                if (response.ok) {
                    logDebug('USDZ file found and accessible', 'success');
                    launchAR();
                } else {
                    logDebug(`USDZ file error: HTTP ${response.status}`, 'error');
                    alert('USDZ file not found or inaccessible. Please make sure toilet_final.usdz is in the same folder.');
                }
            })
            .catch(error => {
                logDebug(`USDZ fetch error: ${error.message}`, 'error');
                alert('Cannot access USDZ file. Check file permissions and location.');
            });
    }
    
    function showErrorMessage(message) {
        document.getElementById('loading').innerHTML = `
            <div style="color: #ff4444; margin-bottom: 15px;">❌ ERROR</div>
            <p style="margin-bottom: 10px;">${message}</p>
            <button onclick="location.reload()" style="
                background: #007bff;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 8px;
                cursor: pointer;
                margin-top: 10px;
            ">Reload Page</button>
        `;
    }
    
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    
    // Auto-start debug after 2 seconds
    setTimeout(() => {
        if (debugLog.some(log => log.type === 'error')) {
            toggleDebug();
        }
    }, 2000);
</script>
</body>
</html>
