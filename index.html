<script>
  const viewer = document.getElementById('toiletViewer');
  const buttons = document.querySelectorAll('.buttons button');

  // Keep track of which animations are currently applied
  const activeAnimations = new Set();

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const anim = btn.getAttribute('data-animation');

      // Highlight clicked button
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // If Bidet, play both animations in sequence
      if(anim === "BidetActionGroup") {
        if(!activeAnimations.has("BidetCoverAction")) {
          activeAnimations.add("BidetCoverAction");
          viewer.animationName = "BidetCoverAction";
          viewer.play({ loop: false });
        }
        setTimeout(() => {
          if(!activeAnimations.has("BidetAction")) {
            activeAnimations.add("BidetAction");
            viewer.animationName = "BidetAction";
            viewer.play({ loop: false });
          }
        }, 500);
        return;
      }

      // Only play animation if it’s not already active
      if(!activeAnimations.has(anim)) {
        activeAnimations.add(anim);
        viewer.animationName = anim;
        viewer.play({ loop: false });
      }
    });
  });

  // Optional: remove animations from active set when they finish
  viewer.addEventListener('finish', (event) => {
    const name = viewer.animationName;
    if(name) activeAnimations.add(name); // keep it active visually, or remove if you want
  });
</script>
