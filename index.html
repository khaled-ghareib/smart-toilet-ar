<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Smart Toilet - Instant AR</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #000; 
            color: white; 
            height: 100vh; 
            position: relative;
        }
        
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #4CAF50;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #topBar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            display: none;
        }
        
        #title {
            font-size: 18px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 90%;
            max-width: 400px;
            padding: 15px;
            background: rgba(20,20,20,0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        
        .control-btn {
            padding: 16px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(40,40,40,0.9);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 55px;
        }
        
        .control-btn.on {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border-color: #4CAF50;
        }
        
        .control-btn.off {
            background: rgba(60,60,60,0.9);
        }
        
        .control-btn.reset {
            grid-column: span 2;
            background: linear-gradient(135deg, #2196F3, #0D47A1);
            border-color: #2196F3;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background: #f44336;
        }
        
        .control-btn.on .status-dot {
            background: #4CAF50;
        }
        
        #arButton {
            background: linear-gradient(135deg, #0a192f, #1a365d);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(10, 25, 47, 0.4);
            transition: all 0.2s ease;
        }
        
        #arButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(10, 25, 47, 0.6);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        /* Simple AR loading */
        #arLoading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        
        #arLoading .spinner {
            border-top-color: #0a192f;
        }
        
        @media (max-width: 768px) {
            #controls {
                bottom: 10px;
                padding: 12px;
                gap: 10px;
            }
            
            .control-btn {
                padding: 14px 10px;
                font-size: 13px;
                min-height: 50px;
            }
            
            #topBar {
                padding: 10px;
            }
            
            #title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div id="loading">
    <div class="spinner"></div>
    <div id="loadingText">Loading 3D Model...</div>
</div>

<div id="arLoading" style="display: none;">
    <div class="spinner"></div>
    <div style="margin-top: 20px;">Opening AR...</div>
</div>

<div id="topBar">
    <div id="title">Icon Smart Toilet</div>
    <button id="arButton">
        <span>👁️</span>
        <span>View in AR</span>
    </button>
</div>

<div id="controls">
    <button class="control-btn off" data-animation="CoverAction" id="btnCover">
        <span class="status-dot"></span>
        <span>Cover</span>
    </button>
    <button class="control-btn off" data-animation="SeatAction" id="btnSeat">
        <span class="status-dot"></span>
        <span>Seat</span>
    </button>
    <button class="control-btn off" data-animation="BidetAction" id="btnBidet">
        <span class="status-dot"></span>
        <span>Bidet</span>
    </button>
    <button class="control-btn off" data-animation="AirventAction" id="btnAirvent">
        <span class="status-dot"></span>
        <span>Air Vent</span>
    </button>
    <button class="control-btn reset" id="btnReset">
        Reset All
    </button>
</div>

<script>
    let scene, camera, renderer, controls, mixer, model;
    let clock = new THREE.Clock();
    
    const animations = {
        CoverAction: { active: false, action: null, isAnimating: false },
        SeatAction: { active: false, action: null, isAnimating: false },
        BidetAction: { active: false, action: null, isAnimating: false },
        AirventAction: { active: false, action: null, isAnimating: false }
    };
    
    // Store all possible USDZ files for different states
    const stateToUSDZ = {
        '0000': 'toilet_final.usdz', // all closed/off
        '1000': 'toilet_cover.usdz', // cover open
        '0100': 'toilet_seat.usdz', // seat open
        '0010': 'toilet_bidet.usdz', // bidet on
        '0001': 'toilet_airvent.usdz', // airvent on
        '1100': 'toilet_cover_seat.usdz', // cover and seat open
        '1010': 'toilet_cover_bidet.usdz', // cover open, bidet on
        '1001': 'toilet_cover_airvent.usdz', // cover open, airvent on
        '0110': 'toilet_seat_bidet.usdz', // seat open, bidet on
        '0101': 'toilet_seat_airvent.usdz', // seat open, airvent on
        '0011': 'toilet_bidet_airvent.usdz', // bidet and airvent on
        '1110': 'toilet_cover_seat_bidet.usdz', // cover, seat, bidet
        '1101': 'toilet_cover_seat_airvent.usdz', // cover, seat, airvent
        '1011': 'toilet_cover_bidet_airvent.usdz', // cover, bidet, airvent
        '0111': 'toilet_seat_bidet_airvent.usdz', // seat, bidet, airvent
        '1111': 'toilet_all.usdz' // all open/on
    };
    
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 6);
        
        renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0.5, 0);
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);
        
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);
        
        loadModel();
        setupUI();
        animate();
        
        window.addEventListener('resize', onWindowResize);
    }
    
    function loadModel() {
        const loader = new THREE.GLTFLoader();
        
        loader.load(
            'toilet_final.glb',
            function(gltf) {
                console.log('✅ Model loaded successfully');
                model = gltf.scene;
                
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                model.position.x = -center.x;
                model.position.y = -box.min.y;
                model.position.z = -center.z;
                
                const maxSize = Math.max(size.x, size.y, size.z);
                if (maxSize > 5) {
                    const scale = 3 / maxSize;
                    model.scale.setScalar(scale);
                }
                
                scene.add(model);
                
                if (gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    
                    gltf.animations.forEach(animation => {
                        const action = mixer.clipAction(animation);
                        action.clampWhenFinished = true;
                        action.loop = THREE.LoopOnce;
                        
                        const animName = animation.name;
                        if (animations[animName]) {
                            animations[animName].action = action;
                            action.play();
                            action.paused = true;
                            action.time = 0;
                        }
                    });
                }
                
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('topBar').style.display = 'flex';
                    document.getElementById('controls').style.display = 'grid';
                    checkARSupport();
                }, 500);
            },
            function(xhr) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('loadingText').textContent = `Loading: ${percent}%`;
            },
            function(error) {
                console.error('❌ Error loading model:', error);
                document.getElementById('loadingText').textContent = 'Error loading model';
                document.getElementById('loadingText').style.color = '#ff4444';
                
                setTimeout(() => {
                    const retryBtn = document.createElement('button');
                    retryBtn.textContent = 'Retry';
                    retryBtn.style.cssText = `
                        margin-top: 20px;
                        padding: 10px 20px;
                        background: #4CAF50;
                        color: white;
                        border: none;
                        border-radius: 8px;
                        cursor: pointer;
                        font-weight: bold;
                    `;
                    retryBtn.onclick = () => location.reload();
                    document.getElementById('loading').appendChild(retryBtn);
                }, 1000);
            }
        );
    }
    
    function setupUI() {
        document.querySelectorAll('.control-btn[data-animation]').forEach(btn => {
            btn.addEventListener('click', function() {
                const animName = this.getAttribute('data-animation');
                toggleAnimation(animName);
            });
        });
        
        document.getElementById('btnReset').addEventListener('click', resetAllAnimations);
        
        // AR button - Instant open
        document.getElementById('arButton').addEventListener('click', function() {
            launchARNow();
        });
    }
    
    function toggleAnimation(animName) {
        const anim = animations[animName];
        if (!anim || !anim.action || anim.isAnimating) return;
        
        anim.active = !anim.active;
        const targetTime = anim.active ? anim.action.getClip().duration : 0;
        
        if (animName === 'CoverAction' && !anim.active && animations.SeatAction.active) {
            closeSeatBeforeCover(targetTime);
            return;
        }
        
        animateToTime(anim.action, targetTime, 0.5, () => {
            anim.isAnimating = false;
        });
        anim.isAnimating = true;
        
        updateButtonState(animName, anim.active);
    }
    
    function closeSeatBeforeCover(coverTargetTime) {
        const seatAnim = animations.SeatAction;
        const coverAnim = animations.CoverAction;
        
        if (!seatAnim.action || !coverAnim.action) return;
        
        seatAnim.isAnimating = true;
        coverAnim.isAnimating = true;
        
        animateToTime(seatAnim.action, 0, 0.4, () => {
            seatAnim.active = false;
            seatAnim.isAnimating = false;
            updateButtonState('SeatAction', false);
            
            setTimeout(() => {
                animateToTime(coverAnim.action, coverTargetTime, 0.4, () => {
                    coverAnim.active = false;
                    coverAnim.isAnimating = false;
                    updateButtonState('CoverAction', false);
                });
            }, 100);
        });
    }
    
    function animateToTime(action, targetTime, duration, onComplete = null) {
        const startTime = action.time;
        const start = Date.now();
        
        function update() {
            const elapsed = (Date.now() - start) / 1000;
            const progress = Math.min(elapsed / duration, 1);
            
            const eased = progress < 0.5 
                ? 2 * progress * progress 
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            
            action.time = startTime + (targetTime - startTime) * eased;
            
            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                action.time = targetTime;
                action.paused = true;
                if (onComplete) onComplete();
            }
        }
        
        action.paused = false;
        update();
    }
    
    function updateButtonState(animName, isActive) {
        const btn = document.querySelector(`[data-animation="${animName}"]`);
        if (btn) {
            btn.classList.toggle('on', isActive);
            btn.classList.toggle('off', !isActive);
        }
    }
    
    function resetAllAnimations() {
        let animationsToReset = [];
        
        if (animations.SeatAction.active && !animations.SeatAction.isAnimating) {
            animationsToReset.push('SeatAction');
        }
        
        if (animations.CoverAction.active && !animations.CoverAction.isAnimating) {
            animationsToReset.push('CoverAction');
        }
        
        ['BidetAction', 'AirventAction'].forEach(animName => {
            if (animations[animName].active && !animations[animName].isAnimating) {
                animationsToReset.push(animName);
            }
        });
        
        animationsToReset.forEach((animName, index) => {
            setTimeout(() => {
                const anim = animations[animName];
                if (anim && anim.action) {
                    anim.active = false;
                    animateToTime(anim.action, 0, 0.3, () => {
                        anim.isAnimating = false;
                    });
                    anim.isAnimating = true;
                    
                    updateButtonState(animName, false);
                }
            }, index * 150);
        });
        
        const resetBtn = document.getElementById('btnReset');
        resetBtn.style.transform = 'scale(0.95)';
        setTimeout(() => {
            resetBtn.style.transform = '';
        }, 200);
    }
    
    function checkARSupport() {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        
        if (isIOS && isSafari) {
            fetch('toilet_final.usdz', { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        document.getElementById('arButton').style.display = 'flex';
                    } else {
                        document.getElementById('arButton').style.display = 'flex';
                        document.getElementById('arButton').innerHTML = '<span>⚠️</span><span>AR Not Available</span>';
                        document.getElementById('arButton').style.background = 'linear-gradient(135deg, #f44336, #d32f2f)';
                        document.getElementById('arButton').style.cursor = 'not-allowed';
                    }
                })
                .catch(() => {
                    document.getElementById('arButton').style.display = 'flex';
                    document.getElementById('arButton').innerHTML = '<span>⚠️</span><span>AR Not Available</span>';
                    document.getElementById('arButton').style.background = 'linear-gradient(135deg, #f44336, #d32f2f)';
                    document.getElementById('arButton').style.cursor = 'not-allowed';
                });
        } else if (isIOS) {
            document.getElementById('arButton').style.display = 'flex';
            document.getElementById('arButton').innerHTML = '<span>⚠️</span><span>Use Safari for AR</span>';
            document.getElementById('arButton').style.background = 'linear-gradient(135deg, #f44336, #d32f2f)';
        } else {
            document.getElementById('arButton').style.display = 'flex';
            document.getElementById('arButton').innerHTML = '<span>❌</span><span>AR Not Supported</span>';
            document.getElementById('arButton').style.background = 'linear-gradient(135deg, #666, #333)';
            document.getElementById('arButton').style.cursor = 'not-allowed';
        }
    }
    
    function getCurrentStateCode() {
        // Create a 4-digit binary code for the current state
        // Order: Cover, Seat, Bidet, Airvent
        const cover = animations.CoverAction.active ? '1' : '0';
        const seat = animations.SeatAction.active ? '1' : '0';
        const bidet = animations.BidetAction.active ? '1' : '0';
        const airvent = animations.AirventAction.active ? '1' : '0';
        
        return cover + seat + bidet + airvent;
    }
    
    function launchARNow() {
        // Show brief loading indicator
        document.getElementById('arLoading').style.display = 'flex';
        
        // Get current state
        const stateCode = getCurrentStateCode();
        console.log('Current state code:', stateCode);
        
        // Determine which USDZ file to use
        let usdzFile = stateToUSDZ[stateCode] || 'toilet_final.usdz';
        
        // For simplicity, we'll use the main file
        // In a real implementation, you'd need all 16 USDZ files pre-created
        usdzFile = 'toilet_final.usdz';
        
        // Create and trigger AR link
        const arLink = document.createElement('a');
        arLink.href = usdzFile;
        arLink.setAttribute('rel', 'ar');
        
        // Required AR badge image
        const img = document.createElement('img');
        img.src = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#0a192f"/><text x="50" y="55" font-family="Arial" font-size="20" fill="white" text-anchor="middle">AR</text></svg>');
        img.alt = 'AR';
        img.width = 100;
        img.height = 100;
        img.style.cssText = 'position: absolute; opacity: 0; pointer-events: none;';
        
        arLink.appendChild(img);
        document.body.appendChild(arLink);
        
        // Brief delay to ensure DOM is ready
        setTimeout(() => {
            // Trigger AR
            arLink.click();
            
            // Hide loading after 1 second
            setTimeout(() => {
                document.getElementById('arLoading').style.display = 'none';
                
                // Clean up
                if (arLink.parentNode) {
                    arLink.parentNode.removeChild(arLink);
                }
            }, 1000);
            
            // If AR doesn't open in 3 seconds, show error
            setTimeout(() => {
                if (document.visibilityState === 'visible') {
                    console.log('AR may have failed to open');
                    document.getElementById('arLoading').style.display = 'none';
                }
            }, 3000);
            
        }, 100);
    }
    
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    function animate() {
        requestAnimationFrame(animate);
        
        const delta = clock.getDelta();
        
        if (mixer) {
            mixer.update(delta);
        }
        
        controls.update();
        renderer.render(scene, camera);
    }
    
    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
