<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Icon Smart Toilet</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h2 { margin: 10px 0; z-index: 10; }
    #container { width: 100vw; height: 70vh; background: #1a1a1a; }
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }
    button {
      padding: 12px 20px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #388E3C; }
    #arButton { background: #2196F3; }
  </style>
</head>
<body>

<h2>Icon Smart Toilet</h2>
<div id="container"></div>

<div class="buttons">
  <button data-action="CoverAction">Cover</button>
  <button data-action="SeatAction">Seat</button>
  <button data-action="Bidet">Bidet</button>
  <button data-action="AirventAction">Air Vent</button>
  <button id="arButton">View in AR</button>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const container = document.getElementById('container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(1.5, 1.5, 2.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(5, 5, 5);
  scene.add(dirLight);

  const loader = new GLTFLoader();
  let mixer;
  const actions = {};

  // Using jsDelivr to avoid GitHub CORS issues
  const modelUrl = 'https://cdn.jsdelivr.net/gh/khaled-ghareib/smart-toilet-ar@main/toilet_web.glb';

  loader.load(modelUrl, (gltf) => {
    scene.add(gltf.scene);
    
    // Center the model
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    gltf.scene.position.sub(center);

    mixer = new THREE.AnimationMixer(gltf.scene);

    gltf.animations.forEach((clip) => {
      const action = mixer.clipAction(clip);
      action.setLoop(THREE.LoopOnce);
      action.clampWhenFinished = true;
      actions[clip.name] = action;
    });

    console.log("Animations loaded:", Object.keys(actions));
  }, 
  (xhr) => { console.log((xhr.loaded / xhr.total * 100) + '% loaded'); },
  (error) => { console.error('Error loading GLB:', error); });

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    if (mixer) mixer.update(delta);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Animation logic
  document.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!mixer) return;
      const actionName = btn.dataset.action;

      if (actionName === 'Bidet') {
        // Run sequence
        if (actions['BidetCoverAction']) actions['BidetCoverAction'].reset().play();
        setTimeout(() => {
          if (actions['BidetAction']) actions['BidetAction'].reset().play();
        }, 500);
      } else {
        // Run individual
        if (actions[actionName]) {
          actions[actionName].reset().play();
        } else {
          console.warn(`Action ${actionName} not found in model.`);
        }
      }
    });
  });

  // AR Logic
  document.getElementById('arButton').addEventListener('click', () => {
    const usdzUrl = 'https://raw.githubusercontent.com/khaled-ghareib/smart-toilet-ar/main/toilet_full_active.usdz';
    window.open(`https://www.arviewer.io/viewer/?file=${encodeURIComponent(usdzUrl)}`, '_blank');
  });

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
</script>
</body>
</html>
