<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Toilet Pro</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: -apple-system, sans-serif; color: white; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; --poster-color: transparent; }
        .controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 90%;
            max-width: 400px; z-index: 10;
        }
        button {
            padding: 12px; border-radius: 8px; border: 1px solid #444;
            background: rgba(30, 30, 30, 0.9); color: white; font-size: 14px;
            transition: all 0.2s; cursor: pointer;
        }
        button.active { background: #007bff; border-color: #007bff; }
    </style>
</head>
<body>

<model-viewer id="toilet" src="toilet_final.glb" ar camera-controls touch-action="pan-y">
    <div class="controls">
        <button id="btn-CoverAction" onclick="handleAction('CoverAction')">Cover</button>
        <button id="btn-SeatAction" onclick="handleAction('SeatAction')">Seat</button>
        <button id="btn-BidetCoverAction" onclick="handleAction('BidetCoverAction')">Bidet Lid</button>
        <button id="btn-BidetAction" onclick="handleAction('BidetAction')">Bidet</button>
        <button id="btn-AirventAction" onclick="handleAction('AirventAction')">Air Vent</button>
        <button id="btn-LEDAction" onclick="handleAction('LEDAction')">LED</button>
    </div>
</model-viewer>

<script>
    const mv = document.querySelector('#toilet');
    let mixer, actions = {}, states = {};

    mv.addEventListener('load', () => {
        // 1. Access the internal Three.js scene and the Three object itself
        const sceneSymbol = Object.getOwnPropertySymbols(mv).find(s => s.description === 'scene');
        const scene = mv[sceneSymbol];
        
        // Model-viewer uses a bundled version of Three.js. 
        // We need the constructor for AnimationMixer and LoopOnce.
        const THREE = window.THREE || mv.constructor.THREE; 

        if (!THREE || !scene) return;

        mixer = new THREE.AnimationMixer(scene);
        
        // 2. Load animations into the mixer
        mv.availableAnimations.forEach(clipName => {
            const clip = scene.animations.find(a => a.name === clipName);
            if (clip) {
                const action = mixer.clipAction(clip);
                action.setLoop(THREE.LoopOnce);
                action.clampWhenFinished = true;
                actions[clipName] = action;
                states[clipName] = false;
            }
        });

        // 3. Start the animation loop
        const clock = new THREE.Clock();
        const animate = () => {
            requestAnimationFrame(animate);
            if (mixer) mixer.update(clock.getDelta());
        };
        animate();
    });

    function handleAction(name) {
        const action = actions[name];
        const btn = document.getElementById(`btn-${name}`);
        if (!action) return;

        states[name] = !states[name];

        if (states[name]) {
            // OPENING: Play forward
            btn.classList.add('active');
            action.paused = false;
            action.timeScale = 1;
            action.play();
        } else {
            // CLOSING: Play backward
            btn.classList.remove('active');
            action.paused = false;
            action.timeScale = -1;
            // If the animation finished forward, we must set time to end to play back
            if (action.time === 0) action.time = action.getClip().duration;
            action.play();

            // Master Close Logic
            if (name === 'CoverAction') {
                Object.keys(states).forEach(key => {
                    if (key !== 'CoverAction' && states[key] === true) {
                        handleAction(key); 
                    }
                });
            }
        }
    }
</script>
</body>
</html>
