<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Toilet Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #ui {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    button {
      padding: 10px 16px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
    }

    button:hover {
      background: #ddd;
    }
  </style>
</head>
<body>

<div id="ui">
  <button id="coverBtn">Cover</button>
  <button id="seatBtn">Seat</button>
  <button id="bidetBtn">Bidet</button>
  <button id="airBtn">Air Vent</button>
</div>

<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
  import { GLTFLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
  import { OrbitControls } from 'https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js';

  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeeeeee);

  // Camera
  const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(0, 1.5, 3);

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  // Controls
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.8, 0);
  controls.update();

  // Lights
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  // Animation system
  let mixer;
  const actions = {};
  const activeStates = {}; // track open/closed states

  const loader = new GLTFLoader();
  loader.load(
    './toilet_web.glb',
    (gltf) => {
      const model = gltf.scene;
      scene.add(model);

      mixer = new THREE.AnimationMixer(model);

      gltf.animations.forEach((clip) => {
        const action = mixer.clipAction(clip);
        action.loop = THREE.LoopOnce;
        action.clampWhenFinished = true;
        actions[clip.name] = action;
        activeStates[clip.name] = false;
      });

      console.log('Animations loaded:', Object.keys(actions));
    },
    undefined,
    (error) => {
      console.error('GLB load error:', error);
    }
  );

  // Helper: play animation ONLY forward, never reset others
  function playAction(name) {
    const action = actions[name];
    if (!action || activeStates[name]) return;

    action.reset();
    action.play();
    activeStates[name] = true;
  }

  // Buttons
  document.getElementById('coverBtn').onclick = () => {
    playAction('CoverAction');
  };

  document.getElementById('seatBtn').onclick = () => {
    playAction('SeatAction');
  };

  document.getElementById('airBtn').onclick = () => {
    playAction('AirventAction');
  };

  document.getElementById('bidetBtn').onclick = () => {
    if (!activeStates['BidetCoverAction']) {
      playAction('BidetCoverAction');
      setTimeout(() => {
        playAction('BidetAction');
      }, 500);
    }
  };

  // Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Render loop
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    if (mixer) mixer.update(clock.getDelta());
    renderer.render(scene, camera);
  }
  animate();
</script>

</body>
</html>
