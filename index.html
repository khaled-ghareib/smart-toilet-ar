<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Smart Toilet - AR Optimized</title>
    
    <!-- Essential AR Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="supported-device-families" content="iphone, ipad">
    <meta name="apple-ar-content-mode" content="object">
    
    <!-- AR Quick Look specific meta tags -->
    <meta property="og:image" content="ar-preview.jpg">
    <meta property="og:title" content="Icon Smart Toilet">
    <meta property="og:description" content="View in AR">
    
    <!-- Apple specific AR tags -->
    <meta name="apple-ar-is-low-poly" content="false">
    <meta name="apple-ar-scaling-enabled" content="true">
    <meta name="apple-ar-canvas-enabled" content="true">
    <meta name="apple-ar-modes" content="object">
    
    <!-- Preload AR assets -->
    <link rel="preload" href="toilet_final.usdz" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="toilet_final.glb" as="fetch" crossorigin="anonymous">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #000; 
            color: white; 
            height: 100vh; 
            position: relative;
        }
        
        /* Canvas */
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        
        /* Loading Screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #4CAF50;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Top Bar */
        #topBar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            display: none;
        }
        
        #title {
            font-size: 18px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        /* Control Buttons */
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 90%;
            max-width: 400px;
            padding: 15px;
            background: rgba(20,20,20,0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        
        .control-btn {
            padding: 16px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(40,40,40,0.9);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 55px;
        }
        
        .control-btn.on {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border-color: #4CAF50;
        }
        
        .control-btn.off {
            background: rgba(60,60,60,0.9);
        }
        
        .control-btn.reset {
            grid-column: span 2;
            background: linear-gradient(135deg, #2196F3, #0D47A1);
            border-color: #2196F3;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background: #f44336;
        }
        
        .control-btn.on .status-dot {
            background: #4CAF50;
        }
        
        /* AR Button */
        #arButton {
            background: linear-gradient(135deg, #0a192f, #1a365d);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(10, 25, 47, 0.4);
            transition: all 0.2s ease;
        }
        
        #arButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(10, 25, 47, 0.6);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        #arButton:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(10, 25, 47, 0.3);
        }
        
        /* AR Loading Indicator */
        #arLoading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        
        #arLoading .spinner {
            border-top-color: #0a192f;
        }
        
        /* Media Queries */
        @media (max-width: 768px) {
            #controls {
                bottom: 10px;
                padding: 12px;
                gap: 10px;
            }
            
            .control-btn {
                padding: 14px 10px;
                font-size: 13px;
                min-height: 50px;
            }
            
            #topBar {
                padding: 10px;
            }
            
            #title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading">
    <div class="spinner"></div>
    <div id="loadingText">Loading 3D Model...</div>
</div>

<!-- AR Loading -->
<div id="arLoading">
    <div class="spinner"></div>
    <div style="margin-top: 20px; font-size: 16px;">Preparing AR Experience...</div>
    <div style="margin-top: 10px; font-size: 14px; color: #888;">This may take a moment</div>
</div>

<!-- Top Bar -->
<div id="topBar">
    <div id="title">Icon Smart Toilet</div>
    <button id="arButton">
        <span>👁️</span>
        <span>View in AR</span>
    </button>
</div>

<!-- Controls -->
<div id="controls">
    <button class="control-btn off" data-animation="CoverAction" id="btnCover">
        <span class="status-dot"></span>
        <span>Cover</span>
    </button>
    <button class="control-btn off" data-animation="SeatAction" id="btnSeat">
        <span class="status-dot"></span>
        <span>Seat</span>
    </button>
    <button class="control-btn off" data-animation="BidetAction" id="btnBidet">
        <span class="status-dot"></span>
        <span>Bidet</span>
    </button>
    <button class="control-btn off" data-animation="AirventAction" id="btnAirvent">
        <span class="status-dot"></span>
        <span>Air Vent</span>
    </button>
    <button class="control-btn reset" id="btnReset">
        Reset All
    </button>
</div>

<script>
    // Scene variables
    let scene, camera, renderer, controls, mixer, model;
    let clock = new THREE.Clock();
    
    // Animation states
    const animations = {
        CoverAction: { active: false, action: null, isAnimating: false },
        SeatAction: { active: false, action: null, isAnimating: false },
        BidetAction: { active: false, action: null, isAnimating: false },
        AirventAction: { active: false, action: null, isAnimating: false }
    };
    
    // USDZ file size info (for optimization)
    let usdzFileSize = 0;
    
    // Initialize the scene
    function init() {
        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        
        // Create camera
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 6);
        
        // Create renderer
        renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        // Add orbit controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0.5, 0);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);
        
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);
        
        // Load the model
        loadModel();
        
        // Setup UI
        setupUI();
        
        // Start animation loop
        animate();
        
        // Handle resize
        window.addEventListener('resize', onWindowResize);
        
        // Check AR file size and cache
        preloadARAssets();
    }
    
    function loadModel() {
        const loader = new THREE.GLTFLoader();
        
        // Show loading progress
        loader.load(
            'toilet_final.glb',
            function(gltf) {
                console.log('✅ Model loaded successfully');
                model = gltf.scene;
                
                // Center and scale the model
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                // Center the model
                model.position.x = -center.x;
                model.position.y = -box.min.y;
                model.position.z = -center.z;
                
                // Scale down if too large
                const maxSize = Math.max(size.x, size.y, size.z);
                if (maxSize > 5) {
                    const scale = 3 / maxSize;
                    model.scale.setScalar(scale);
                }
                
                scene.add(model);
                
                // Setup animations
                if (gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    
                    gltf.animations.forEach(animation => {
                        const action = mixer.clipAction(animation);
                        action.clampWhenFinished = true;
                        action.loop = THREE.LoopOnce;
                        
                        const animName = animation.name;
                        if (animations[animName]) {
                            animations[animName].action = action;
                            action.play();
                            action.paused = true;
                            action.time = 0;
                        }
                    });
                    
                    console.log('✅ Animations loaded:', gltf.animations.map(a => a.name));
                }
                
                // Hide loading, show UI
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('topBar').style.display = 'flex';
                    document.getElementById('controls').style.display = 'grid';
                    
                    // Check AR compatibility
                    checkARSupport();
                }, 500);
            },
            function(xhr) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('loadingText').textContent = `Loading 3D: ${percent}%`;
            },
            function(error) {
                console.error('❌ Error loading model:', error);
                document.getElementById('loadingText').textContent = 'Error loading model';
                document.getElementById('loadingText').style.color = '#ff4444';
                
                // Show retry button
                setTimeout(() => {
                    const retryBtn = document.createElement('button');
                    retryBtn.textContent = 'Retry';
                    retryBtn.style.cssText = `
                        margin-top: 20px;
                        padding: 10px 20px;
                        background: #4CAF50;
                        color: white;
                        border: none;
                        border-radius: 8px;
                        cursor: pointer;
                        font-weight: bold;
                    `;
                    retryBtn.onclick = () => location.reload();
                    document.getElementById('loading').appendChild(retryBtn);
                }, 1000);
            }
        );
    }
    
    function preloadARAssets() {
        // Get USDZ file size and pre-cache
        fetch('toilet_final.usdz', { method: 'HEAD' })
            .then(response => {
                if (response.ok) {
                    usdzFileSize = parseInt(response.headers.get('content-length') || '0');
                    console.log(`USDZ file size: ${(usdzFileSize / (1024 * 1024)).toFixed(2)} MB`);
                    
                    // Pre-cache the file for faster loading
                    if (usdzFileSize < 10 * 1024 * 1024) { // Only pre-cache if < 10MB
                        const preloadLink = document.createElement('link');
                        preloadLink.rel = 'preload';
                        preloadLink.href = 'toilet_final.usdz';
                        preloadLink.as = 'fetch';
                        preloadLink.crossOrigin = 'anonymous';
                        document.head.appendChild(preloadLink);
                    }
                }
            })
            .catch(console.warn);
    }
    
    function setupUI() {
        // Animation button handlers
        document.querySelectorAll('.control-btn[data-animation]').forEach(btn => {
            btn.addEventListener('click', function() {
                const animName = this.getAttribute('data-animation');
                toggleAnimation(animName);
            });
        });
        
        // Reset button
        document.getElementById('btnReset').addEventListener('click', resetAllAnimations);
        
        // AR button - Direct AR launch (no modal)
        document.getElementById('arButton').addEventListener('click', launchARNow);
    }
    
    function toggleAnimation(animName) {
        const anim = animations[animName];
        if (!anim || !anim.action || anim.isAnimating) return;
        
        anim.active = !anim.active;
        const targetTime = anim.active ? anim.action.getClip().duration : 0;
        
        // If closing cover and seat is open, close seat first
        if (animName === 'CoverAction' && !anim.active && animations.SeatAction.active) {
            closeSeatBeforeCover(targetTime);
            return;
        }
        
        // Normal animation
        animateToTime(anim.action, targetTime, 0.5, () => {
            anim.isAnimating = false;
        });
        anim.isAnimating = true;
        
        // Update button state
        updateButtonState(animName, anim.active);
    }
    
    function closeSeatBeforeCover(coverTargetTime) {
        const seatAnim = animations.SeatAction;
        const coverAnim = animations.CoverAction;
        
        if (!seatAnim.action || !coverAnim.action) return;
        
        // Set both to animating
        seatAnim.isAnimating = true;
        coverAnim.isAnimating = true;
        
        // Close seat first (to time 0)
        animateToTime(seatAnim.action, 0, 0.4, () => {
            // Seat animation complete, update its state
            seatAnim.active = false;
            seatAnim.isAnimating = false;
            updateButtonState('SeatAction', false);
            
            // Now close cover
            setTimeout(() => {
                animateToTime(coverAnim.action, coverTargetTime, 0.4, () => {
                    coverAnim.active = false;
                    coverAnim.isAnimating = false;
                    updateButtonState('CoverAction', false);
                });
            }, 100); // Small delay between animations
        });
    }
    
    function animateToTime(action, targetTime, duration, onComplete = null) {
        const startTime = action.time;
        const start = Date.now();
        
        function update() {
            const elapsed = (Date.now() - start) / 1000;
            const progress = Math.min(elapsed / duration, 1);
            
            // Smooth easing
            const eased = progress < 0.5 
                ? 2 * progress * progress 
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            
            action.time = startTime + (targetTime - startTime) * eased;
            
            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                action.time = targetTime;
                action.paused = true;
                if (onComplete) onComplete();
            }
        }
        
        action.paused = false;
        update();
    }
    
    function updateButtonState(animName, isActive) {
        const btn = document.querySelector(`[data-animation="${animName}"]`);
        if (btn) {
            btn.classList.toggle('on', isActive);
            btn.classList.toggle('off', !isActive);
        }
    }
    
    function resetAllAnimations() {
        // Create animation sequence: close seat first if open, then cover
        let animationsToReset = [];
        
        // Check if seat is open
        if (animations.SeatAction.active && !animations.SeatAction.isAnimating) {
            animationsToReset.push('SeatAction');
        }
        
        // Check if cover is open
        if (animations.CoverAction.active && !animations.CoverAction.isAnimating) {
            animationsToReset.push('CoverAction');
        }
        
        // Add other animations
        ['BidetAction', 'AirventAction'].forEach(animName => {
            if (animations[animName].active && !animations[animName].isAnimating) {
                animationsToReset.push(animName);
            }
        });
        
        // Reset each animation
        animationsToReset.forEach((animName, index) => {
            setTimeout(() => {
                const anim = animations[animName];
                if (anim && anim.action) {
                    anim.active = false;
                    animateToTime(anim.action, 0, 0.3, () => {
                        anim.isAnimating = false;
                    });
                    anim.isAnimating = true;
                    
                    updateButtonState(animName, false);
                }
            }, index * 150); // Stagger the animations
        });
        
        // Visual feedback for reset button
        const resetBtn = document.getElementById('btnReset');
        resetBtn.style.transform = 'scale(0.95)';
        setTimeout(() => {
            resetBtn.style.transform = '';
        }, 200);
    }
    
    // AR Functions
    function checkARSupport() {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        
        if (isIOS && isSafari) {
            // Check if USDZ file exists
            fetch('toilet_final.usdz', { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        document.getElementById('arButton').style.display = 'flex';
                        console.log('✅ USDZ file found - AR ready');
                        
                        // Show file size warning if too large
                        const fileSize = parseInt(response.headers.get('content-length') || '0');
                        if (fileSize > 20 * 1024 * 1024) { // > 20MB
                            console.warn(`⚠️ USDZ file is large: ${(fileSize / (1024 * 1024)).toFixed(2)}MB - AR may load slowly`);
                        }
                    } else {
                        document.getElementById('arButton').style.display = 'flex';
                        document.getElementById('arButton').innerHTML = '<span>⚠️</span><span>AR File Missing</span>';
                        document.getElementById('arButton').style.background = 'linear-gradient(135deg, #f44336, #d32f2f)';
                        console.warn('❌ USDZ file not found');
                    }
                })
                .catch(() => {
                    document.getElementById('arButton').style.display = 'flex';
                    document.getElementById('arButton').innerHTML = '<span>⚠️</span><span>AR File Missing</span>';
                    document.getElementById('arButton').style.background = 'linear-gradient(135deg, #f44336, #d32f2f)';
                    console.warn('❌ Error checking USDZ file');
                });
        } else if (isIOS) {
            // iOS but not Safari
            document.getElementById('arButton').style.display = 'flex';
            document.getElementById('arButton').innerHTML = '<span>⚠️</span><span>Use Safari for AR</span>';
            document.getElementById('arButton').style.background = 'linear-gradient(135deg, #f44336, #d32f2f)';
        } else {
            document.getElementById('arButton').style.display = 'flex';
            document.getElementById('arButton').innerHTML = '<span>❌</span><span>AR Not Supported</span>';
            document.getElementById('arButton').style.background = 'linear-gradient(135deg, #666, #333)';
        }
    }
    
    function launchARNow() {
        console.log('Launching AR Quick Look...');
        
        // Show loading indicator
        document.getElementById('arLoading').style.display = 'flex';
        
        // Create a direct link to the USDZ file
        const arAnchor = document.createElement('a');
        arAnchor.href = 'toilet_final.usdz';
        
        // Add AR attributes for iOS Safari
        arAnchor.setAttribute('rel', 'ar');
        arAnchor.setAttribute('download', 'toilet_final.usdz');
        
        // Create a tiny placeholder image (required by iOS)
        const img = document.createElement('img');
        img.src = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1"></svg>');
        img.alt = 'AR';
        img.width = 1;
        img.height = 1;
        img.style.position = 'absolute';
        img.style.opacity = '0';
        
        arAnchor.appendChild(img);
        document.body.appendChild(arAnchor);
        
        // Pre-load the file first to cache it
        fetch('toilet_final.usdz', { cache: 'force-cache' })
            .then(response => response.blob())
            .then(blob => {
                console.log('USDZ file loaded into cache, launching AR...');
                
                // Create object URL for faster access
                const objectUrl = URL.createObjectURL(blob);
                arAnchor.href = objectUrl;
                
                // Trigger click after a short delay
                setTimeout(() => {
                    const clickEvent = new MouseEvent('click', {
                        view: window,
                        bubbles: true,
                        cancelable: true
                    });
                    
                    arAnchor.dispatchEvent(clickEvent);
                    
                    // Hide loading indicator
                    document.getElementById('arLoading').style.display = 'none';
                    
                    // Clean up
                    setTimeout(() => {
                        URL.revokeObjectURL(objectUrl);
                        if (arAnchor.parentNode) {
                            arAnchor.parentNode.removeChild(arAnchor);
                        }
                    }, 1000);
                    
                }, 300); // Small delay to ensure iOS is ready
            })
            .catch(error => {
                console.error('Error preloading USDZ:', error);
                
                // Fallback: try direct launch without preloading
                setTimeout(() => {
                    const clickEvent = new MouseEvent('click', {
                        view: window,
                        bubbles: true,
                        cancelable: true
                    });
                    
                    arAnchor.dispatchEvent(clickEvent);
                    document.getElementById('arLoading').style.display = 'none';
                    
                    // Clean up
                    setTimeout(() => {
                        if (arAnchor.parentNode) {
                            arAnchor.parentNode.removeChild(arAnchor);
                        }
                    }, 1000);
                }, 300);
            });
        
        // Fallback timeout in case AR doesn't launch
        setTimeout(() => {
            document.getElementById('arLoading').style.display = 'none';
            
            // Check if we're still on the page
            if (document.visibilityState === 'visible') {
                console.log('AR may have failed to launch or was canceled');
                
                // Show a simple message (optional)
                if (usdzFileSize > 50 * 1024 * 1024) { // > 50MB
                    alert('AR model is large (' + (usdzFileSize / (1024 * 1024)).toFixed(1) + 'MB). It may take longer to load. Please wait or try again.');
                }
            }
        }, 5000); // 5 second timeout
    }
    
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    function animate() {
        requestAnimationFrame(animate);
        
        const delta = clock.getDelta();
        
        if (mixer) {
            mixer.update(delta);
        }
        
        controls.update();
        renderer.render(scene, camera);
    }
    
    // Initialize on load
    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
