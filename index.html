<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Toilet Pro AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            color: white; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            --progress-bar-color: transparent;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 90%;
            max-width: 450px;
            z-index: 100;
            padding: 15px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        button {
            padding: 14px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(40, 40, 40, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.3px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        button:hover {
            background: rgba(60, 60, 60, 0.9);
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.95);
        }

        button.on {
            background: linear-gradient(135deg, #007bff, #0056cc);
            border-color: #007bff;
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        button.off {
            background: linear-gradient(135deg, #6c757d, #495057);
            border-color: #6c757d;
        }

        .ar-button {
            position: absolute !important;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9) !important;
            color: #000 !important;
            padding: 12px 24px !important;
            border-radius: 25px !important;
            font-weight: bold !important;
            border: none !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .ar-button:before {
            content: '👁️ ';
        }

        /* LED color indicator */
        .led-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
            display: inline-block;
            transition: background-color 0.3s;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: repeat(2, 1fr);
                bottom: 20px;
                padding: 12px;
            }
            
            button {
                font-size: 11px;
                padding: 12px 8px;
                min-height: 45px;
            }
            
            .ar-button {
                top: 10px;
                right: 10px;
                padding: 10px 20px !important;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div id="loading" class="loading">
    <div class="loading-spinner"></div>
    <p>Loading Smart Toilet Pro...</p>
</div>

<model-viewer 
    id="toilet"
    src="toilet_final.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look"
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="2" 
    exposure="1"
    environment-image="neutral"
    auto-rotate
    camera-orbit="45deg 55deg 2.5m"
    field-of-view="30deg"
    min-field-of-view="20deg"
    max-field-of-view="45deg"
    interaction-prompt="none"
    ar-scale="auto"
    ar-placement="floor"
    xr-environment
    style="width: 100%; height: 100%;">

    <div class="instructions" slot="ar-button">
        <h2>Smart Toilet Pro AR</h2>
        <p>Tap AR button to place in your space</p>
    </div>

</model-viewer>

<div class="controls">
    <button id="btn-CoverAction" data-animation="CoverAction" data-type="toggle">
        <span class="led-indicator"></span>
        Cover
    </button>
    <button id="btn-SeatAction" data-animation="SeatAction" data-type="toggle">
        <span class="led-indicator"></span>
        Seat
    </button>
    <button id="btn-BidetCoverAction" data-animation="BidetCoverAction" data-type="toggle">
        <span class="led-indicator"></span>
        Bidet Lid
    </button>
    <button id="btn-BidetAction" data-animation="BidetAction" data-type="toggle">
        <span class="led-indicator"></span>
        Bidet Spray
    </button>
    <button id="btn-AirventAction" data-animation="AirventAction" data-type="toggle">
        <span class="led-indicator"></span>
        Air Vent
    </button>
    <button id="btn-LEDAction" data-animation="LEDAction" data-type="cycle">
        <span class="led-indicator"></span>
        LED
    </button>
    <button id="btn-Reset" style="grid-column: span 2;">
        Reset All
    </button>
</div>

<script type="module">
    const modelViewer = document.querySelector('#toilet');
    const loading = document.getElementById('loading');
    
    // Animation state management - stores current state of each part
    const animationStates = {
        'CoverAction': { isOpen: false, progress: 0 },
        'SeatAction': { isOpen: false, progress: 0 },
        'BidetCoverAction': { isOpen: false, progress: 0 },
        'BidetAction': { isOpen: false, progress: 0 },
        'AirventAction': { isOpen: false, progress: 0 },
        'LEDAction': { mode: 0, progress: 0 } // 0=off, 1=white, 2=blue, 3=warm
    };
    
    // Animation blending configuration
    const animationConfig = {
        duration: 1000, // ms for animation
        easing: 'cubic-bezier(0.4, 0, 0.2, 1)'
    };
    
    // Store animation names from the model
    let availableAnimations = [];
    
    // Initialize model
    modelViewer.addEventListener('load', async () => {
        console.log('Model loaded successfully');
        loading.style.display = 'none';
        
        // Get available animations
        availableAnimations = modelViewer.availableAnimations || [];
        console.log('Available animations:', availableAnimations);
        
        // Setup button handlers
        document.querySelectorAll('[data-animation]').forEach(button => {
            const animationName = button.getAttribute('data-animation');
            const type = button.getAttribute('data-type');
            
            button.addEventListener('click', () => {
                if (type === 'cycle') {
                    cycleAnimation(animationName);
                } else {
                    toggleAnimation(animationName);
                }
            });
            
            // Initialize button state
            updateButtonState(button, animationName);
        });
        
        // Reset button
        document.getElementById('btn-Reset').addEventListener('click', resetAll);
        
        // Hide loading
        loading.style.display = 'none';
        
        // Stop auto-rotate in AR mode
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                modelViewer.autoRotate = false;
            } else {
                modelViewer.autoRotate = true;
            }
        });
    });
    
    // Toggle animations without resetting others
    async function toggleAnimation(animationName) {
        const state = animationStates[animationName];
        const button = document.getElementById(`btn-${animationName}`);
        
        if (!state) {
            console.error(`No state found for ${animationName}`);
            return;
        }
        
        // Toggle state
        state.isOpen = !state.isOpen;
        
        // Update UI immediately
        updateButtonState(button, animationName);
        
        // Get the animation duration
        const duration = animationConfig.duration;
        
        try {
            // Play the animation to its target state
            await playAnimationToState(animationName, state.isOpen, duration);
            
            // If cover is closing, also close seat and bidet cover (optional)
            if (animationName === 'CoverAction' && !state.isOpen) {
                // Automatically close seat and bidet cover when main cover closes
                if (animationStates.SeatAction.isOpen) {
                    animationStates.SeatAction.isOpen = false;
                    await playAnimationToState('SeatAction', false, duration);
                    updateButtonState(document.getElementById('btn-SeatAction'), 'SeatAction');
                }
                
                if (animationStates.BidetCoverAction.isOpen) {
                    animationStates.BidetCoverAction.isOpen = false;
                    await playAnimationToState('BidetCoverAction', false, duration);
                    updateButtonState(document.getElementById('btn-BidetCoverAction'), 'BidetCoverAction');
                }
            }
            
            console.log(`${animationName} toggled to ${state.isOpen ? 'open' : 'closed'}`);
        } catch (error) {
            console.error(`Error playing ${animationName}:`, error);
        }
    }
    
    // Cycle through LED modes
    function cycleAnimation(animationName) {
        const state = animationStates[animationName];
        const button = document.getElementById(`btn-${animationName}`);
        const ledIndicator = button.querySelector('.led-indicator');
        
        if (!state) return;
        
        // Cycle through modes: 0=off, 1=white, 2=blue, 3=warm, 4=rainbow
        state.mode = (state.mode + 1) % 5;
        
        // Update button text and LED color
        const modeNames = ['Off', 'White', 'Blue', 'Warm', 'Rainbow'];
        const modeColors = ['#666', '#ffffff', '#007bff', '#ff9900', 'linear-gradient(45deg, #ff0000, #00ff00, #0000ff)'];
        
        // Change LED indicator color
        if (state.mode === 4) { // Rainbow
            ledIndicator.style.background = modeColors[4];
        } else {
            ledIndicator.style.background = modeColors[state.mode];
        }
        
        // Update button class
        button.className = state.mode > 0 ? 'on' : 'off';
        
        console.log(`LED mode: ${modeNames[state.mode]}`);
        
        // Play LED animation based on mode
        playLEDAnimation(state.mode);
    }
    
    // Helper function to play animation to specific state
    async function playAnimationToState(animationName, targetState, duration) {
        return new Promise((resolve) => {
            // Calculate time based on state (0=start, 1=end)
            const targetTime = targetState ? 1 : 0;
            
            // Use model-viewer's animation API
            modelViewer.animationName = animationName;
            
            // Set the time directly (0 = start, 1 = end)
            // This sets the pose without playing the timeline
            modelViewer.time = targetTime;
            
            // For smooth transition, we could use animation mixer if available
            // For now, we'll just set the pose directly
            
            // Resolve after a short delay to ensure the pose is set
            setTimeout(resolve, 50);
        });
    }
    
    // Play LED animation based on mode
    async function playLEDAnimation(mode) {
        if (!availableAnimations.includes('LEDAction')) {
            console.warn('LEDAction animation not found in model');
            return;
        }
        
        try {
            switch(mode) {
                case 0: // Off
                    modelViewer.animationName = 'LEDAction';
                    modelViewer.time = 0;
                    modelViewer.pause();
                    break;
                case 1: // White
                    modelViewer.animationName = 'LEDAction';
                    modelViewer.time = 0.25; // Assuming your animation has different times for colors
                    break;
                case 2: // Blue
                    modelViewer.animationName = 'LEDAction';
                    modelViewer.time = 0.5;
                    break;
                case 3: // Warm
                    modelViewer.animationName = 'LEDAction';
                    modelViewer.time = 0.75;
                    break;
                case 4: // Rainbow (loop)
                    modelViewer.animationName = 'LEDAction';
                    modelViewer.play({ repetitions: Infinity });
                    break;
            }
        } catch (error) {
            console.error('Error playing LED animation:', error);
        }
    }
    
    // Update button visual state
    function updateButtonState(button, animationName) {
        const state = animationStates[animationName];
        const ledIndicator = button.querySelector('.led-indicator');
        
        if (!state) return;
        
        if (animationName === 'LEDAction') {
            // Handle LED separately
            return;
        }
        
        // For toggle animations
        if (state.isOpen !== undefined) {
            button.className = state.isOpen ? 'on' : 'off';
            ledIndicator.style.background = state.isOpen ? '#00ff00' : '#ff0000';
            button.innerHTML = `<span class="led-indicator"></span>${animationName.replace('Action', '')} ${state.isOpen ? 'On' : 'Off'}`;
        }
    }
    
    // Reset all animations to initial state
    function resetAll() {
        Object.keys(animationStates).forEach(name => {
            const state = animationStates[name];
            
            if (name === 'LEDAction') {
                state.mode = 0;
            } else {
                state.isOpen = false;
            }
            
            // Reset the animation pose
            if (availableAnimations.includes(name)) {
                modelViewer.animationName = name;
                modelViewer.time = 0;
            }
            
            // Update button
            const button = document.getElementById(`btn-${name}`);
            if (button) updateButtonState(button, name);
        });
        
        // Reset LED specifically
        const ledButton = document.getElementById('btn-LEDAction');
        const ledIndicator = ledButton.querySelector('.led-indicator');
        ledIndicator.style.background = '#666';
        ledButton.className = 'off';
        ledButton.innerHTML = `<span class="led-indicator"></span>LED Off`;
        
        // Visual feedback
        const resetBtn = document.getElementById('btn-Reset');
        resetBtn.style.background = '#28a745';
        setTimeout(() => {
            resetBtn.style.background = '';
        }, 300);
        
        console.log('All animations reset');
    }
    
    // Handle errors
    modelViewer.addEventListener('error', (event) => {
        console.error('Model viewer error:', event.detail);
        loading.innerHTML = `
            <div style="color: #ff6b6b; margin-bottom: 15px;">⚠️ Error loading model</div>
            <p style="font-size: 12px; opacity: 0.8;">Check if toilet_final.glb is in the same folder</p>
            <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 20px; background: #007bff; border: none; border-radius: 8px; color: white; cursor: pointer;">
                Retry
            </button>
        `;
    });
    
    // Preload animations
    async function preloadAnimations() {
        // This ensures animations are ready
        if (modelViewer.model && modelViewer.model.availableAnimations) {
            availableAnimations = modelViewer.model.availableAnimations;
        }
    }
</script>
</body>
</html>
