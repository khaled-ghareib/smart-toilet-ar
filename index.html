<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Icon Smart Toilet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
  }

  #title {
    position: absolute;
    top: 15px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 24px;
    z-index: 10;
  }

  #buttons {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 10px;
    z-index: 10;
    flex-wrap: wrap;
  }

  button, a {
    padding: 10px 16px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    background: #eee;
    color: #000;
  }

  #arBtn {
    background: #00c853;
    font-weight: bold;
  }
</style>
</head>

<body>

<div id="title">Icon Smart Toilet</div>

<div id="buttons">
  <button id="coverBtn">Cover</button>
  <button id="seatBtn">Seat</button>
  <button id="bidetBtn">Bidet</button>
  <button id="airBtn">Air Vent</button>

  <!-- REAL LINK – NO JS -->
  <a
    id="arBtn"
    href="https://www.arviewer.io/view/0b08b77e-9fd8-473a-a65d-1ace5390b65b"
    target="_blank"
  >
    View in AR
  </a>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js';

let scene, camera, renderer, mixer;
let actions = {};
let clock = new THREE.Clock();

init();
loadModel();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.5, 3);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));

  const dir = new THREE.DirectionalLight(0xffffff, 1);
  dir.position.set(3, 5, 2);
  scene.add(dir);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function loadModel() {
  const loader = new GLTFLoader();

  loader.load(
    './toilet_web.glb',
    (gltf) => {
      scene.add(gltf.scene);

      mixer = new THREE.AnimationMixer(gltf.scene);

      gltf.animations.forEach(clip => {
        const action = mixer.clipAction(clip);
        action.setLoop(THREE.LoopOnce);
        action.clampWhenFinished = true;
        actions[clip.name] = action;
      });

      bindUI();
      console.log('Animations loaded:', Object.keys(actions));
    },
    undefined,
    (err) => console.error(err)
  );
}

function playOnce(name) {
  if (!actions[name]) return;
  actions[name].reset();
  actions[name].play();
}

function bindUI() {
  document.getElementById('coverBtn').onclick = () => playOnce('CoverAction');
  document.getElementById('seatBtn').onclick = () => playOnce('SeatAction');
  document.getElementById('airBtn').onclick  = () => playOnce('AirventAction');

  document.getElementById('bidetBtn').onclick = () => {
    playOnce('BidetCoverAction');
    setTimeout(() => playOnce('BidetAction'), 500);
  };
}

function animate() {
  requestAnimationFrame(animate);
  if (mixer) mixer.update(clock.getDelta());
  renderer.render(scene, camera);
}
</script>

</body>
</html>
